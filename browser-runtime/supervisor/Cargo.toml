[package]
name = "cys-browserd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private native supervisor for the cys Browser Runtime"

[lib]
name = "cys_browserd"
path = "src/lib.rs"

[[bin]]
name = "cys-browserd"
path = "src/main.rs"

[dependencies]
cys-terminal = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }
