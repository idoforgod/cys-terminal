[package]
name = "cys-app"
version = "0.14.35"
edition = "2021"
description = "cys UI shell (Tauri 2) — thin client over the cysd socket"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time"] }
base64 = "0.22"
cys = { package = "cys-terminal", path = ".." }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ★W-8a(F2): 윈도우 데몬 교대 결과 확인 — 연결한 pipe 의 서버 PID(GetNamedPipeServerProcessId)·
#   프로세스 세대(GetProcessTimes 생성 시각)·종료 대기(WaitForSingleObject). 루트 크레이트와 같은 0.59.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }
