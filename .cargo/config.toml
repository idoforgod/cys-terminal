# W0-c 테스트 격리 봉인 — 모든 `cargo test`/`cargo run` 에 CYS_PACK_DIR 을 리포 내 샌드박스로
# 자동 주입한다(cargo가 빌드/테스트 프로세스 환경에 넣음). 직접 `cargo test` 타이핑(사고 벡터)도
# 구조적으로 봉인돼 라이브 ~/.cys/pack 을 만지지 않는다. relative=true 는 이 config 파일 기준 상대
# 경로(= 리포 루트/target/test-pack-sandbox)로 해석된다(target/ 은 .gitignore 대상).
#
# force=false: 이미 CYS_PACK_DIR 이 설정돼 있으면(예: `CYS_PACK_DIR=$(mktemp -d) cargo test`) 그것을
# 존중하고 덮지 않는다 — 테스트가 자체 override 로 격리 가능.
#
# ⚠ 릴리스 바이너리 실행 시점엔 이 env 가 없다(cargo build 산출물의 런타임엔 무영향) — 프로덕션
# pack_dir() 은 종전대로 CYS_PACK_DIR 미설정 시 ~/.cys/pack 으로 폴백한다.
[env]
CYS_PACK_DIR = { value = "target/test-pack-sandbox", relative = true, force = false }

# CRT 정책 SOT — Windows MSVC 바이너리는 CRT 정적 링크(자기완결).
# 근거: VCRUNTIME140.dll 부재 머신(VC++ 재배포 패키지 미설치)에서 cys/cysd/cys-browserd 가
# 기동 불능이던 현장 결함(2026-07-28 제보·v0.13.22 설치본 PE 임포트 실측 — 370개 exe 중
# 우리 3바이너리만 vcruntime140 동적 임포트). 이 선언 하나가 리포 루트 이하 모든 Windows MSVC
# cargo 빌드(사이드카·src-tauri·테스트·feasibility·미래 바이너리)에 상속된다 — CRT 정책이
# 빌드 사이트마다 창발하던 무선언 상태(cys-browserd 무성 감염의 원인)를 종결한다.
# 검증 게이트: scripts/verify_win_crt.py (release.yml·windows-build.yml Windows 잡 —
# PE 임포트 스윕 + 3카테고리 수리 마커. 문자열 grep 은 오검출로 부적합 판명, PE 파싱 고정).
# UCRT(api-ms-win-crt-*)는 Windows 10+ OS 동봉이라 정적화 대상이 아니어도 안전하지만,
# crt-static 은 vcruntime·UCRT 를 함께 정적화한다(tier-1 지원 경로).
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
