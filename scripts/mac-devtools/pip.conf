# cys: installed as <runtime>/python/pip.conf (pip's per-interpreter "site" configuration - it applies to the python
# that ships inside the app and to nothing else).
#
# Why: `pip install X` with that python would put X into the app bundle's own site-packages. Files added inside the
# bundle change its code signature seal (the app's own check then reports a damaged bundle) and they vanish at the
# next update. With this setting the package goes to the user's own site-packages instead
# (~/.local/lib/python3.x/site-packages), where the same python finds it.
#
# Not affected: a virtual environment (python3 -m venv ...) - it has its own prefix and does not read this file.
# To install somewhere else on purpose (--target, --prefix), switch it off for that command: PIP_USER=0 pip install ...
[install]
user = true
