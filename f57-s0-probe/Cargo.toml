[package]
name = "f57-s0-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "signal"] }
url = "2"

[profile.dev]
debug = 0
incremental = false
