# Diagnostic harness: does the in-app update (0.14.37 -> 0.14.42) work on a REAL Windows 11?
# See diag/README.md. Measurement steps never turn the job red (their result IS the data);
# only a failing publish step stays red. Results go to branch diag-results/<run>-<attempt>-<job>-<os>.
# Commit message tags choose the jobs: [product-only] -> only product-launch, [sacreal-only] -> only sacreal-e2e,
# [appe2e-only] -> only app-e2e (+ its tiny gate job), [cysdwin-only] -> only cysd-win (the cysd unit specimens on windows-latest), no tag -> all jobs
# except cysd-win (it runs only with its tag; app-e2e only when diag/appe2e-input.json has a run id above 0). Two tags -> those two.
# e2e and sacrules run only when none of the four tags is present.
# app-e2e is a matrix over the scenes of diag/appe2e-input.json (fresh / upgrade; README 7th section): its installer comes from the
# windows-build run id or, when release_tag is set there, from that release (a draft too) - the gate job says go for either.
name: diag-win11-update

on:
  push:
    branches: ['diag/**']

permissions:
  contents: write

concurrency:
  group: diag-win11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: 'e2e (${{ matrix.os }})'
    if: ${{ !contains(github.event.head_commit.message, '[w44-') && (!contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[product-only]') && !contains(github.event.head_commit.message, '[appe2e-only]') && !contains(github.event.head_commit.message, '[cysdwin-only]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025, windows-2022]
    env:
      DIAG_MATRIX_OS: ${{ matrix.os }}
      DIAG_JOB_LIMIT_MIN: '50'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      - name: e2e-update
        shell: powershell
        continue-on-error: true
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\e2e-update.ps1"
          Write-Host "e2e-update exit code: $LASTEXITCODE"
          exit 0

      - name: replica
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\replica.ps1"
          Write-Host "replica exit code: $LASTEXITCODE"
          exit 0

      # sac-real flips the real Smart App Control state: save everything measured so far first
      - name: publish-checkpoint (before sac-real)
        if: matrix.os == 'windows-11-arm'
        shell: cmd
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job e2e-pre-sacreal --os ${{ matrix.os }} --out "%RUNNER_TEMP%\diag-out"

      - name: sac-real
        if: matrix.os == 'windows-11-arm'
        shell: powershell
        continue-on-error: true
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\sac-real.ps1"
          Write-Host "sac-real exit code: $LASTEXITCODE"
          exit 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job e2e --os ${{ matrix.os }} --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  sacrules:
    name: 'sacrules (${{ matrix.os }})'
    if: ${{ !contains(github.event.head_commit.message, '[w44-') && (!contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[product-only]') && !contains(github.event.head_commit.message, '[appe2e-only]') && !contains(github.event.head_commit.message, '[cysdwin-only]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    env:
      DIAG_MATRIX_OS: ${{ matrix.os }}
      DIAG_JOB_LIMIT_MIN: '55'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      # one step = one PowerShell process: audit -> enforce -> remove (see diag/sacrules.ps1).
      # GITHUB_TOKEN is only for the checkpoint publishes sacrules.ps1 makes (before enforcing / after removing),
      # so that the audit results survive even if an enforced policy kills the runner.
      - name: sacrules
        shell: powershell
        continue-on-error: true
        timeout-minutes: 52
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\sacrules.ps1"
          Write-Host "sacrules exit code: $LASTEXITCODE"
          exit 0

      # Safety net that works even when the sacrules process died (or a NEW PowerShell is in Constrained Language Mode):
      # only core cmdlets and external commands. Removes any leftover DIAG-SAC-RULES policy.
      - name: ensure-policy-removed
        if: always()
        shell: powershell
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $lines = @()
          $ci = Join-Path $env:windir 'System32\CiTool.exe'
          if (-not (Test-Path -LiteralPath $ci)) {
            $lines += 'CiTool.exe not present: nothing to remove'
          } else {
            $raw = (& $ci -lp -json 2>&1 | Out-String)
            $lines += ('citool -lp -json returned {0} characters' -f $raw.Length)
            $found = 0
            try {
              $j = $raw | ConvertFrom-Json
              foreach ($p in $j.Policies) {
                if ($p.FriendlyName -eq 'DIAG-SAC-RULES') {
                  $found = $found + 1
                  $g = '{' + ([string]$p.PolicyID).Trim('{', '}') + '}'
                  $lines += ('leftover policy found, removing ' + $g)
                  $rm = (& $ci --remove-policy $g 2>&1 | Out-String)
                  $lines += ('remove output: ' + $rm.Trim())
                }
              }
            } catch {
              $lines += ('parse or remove problem: ' + $_.Exception.Message)
            }
            $lines += ('leftover DIAG-SAC-RULES policies handled: {0}' -f $found)
            if ($found -gt 0) {
              $raw2 = (& $ci -lp -json 2>&1 | Out-String)
              $still = $false
              try {
                $j2 = $raw2 | ConvertFrom-Json
                foreach ($p2 in $j2.Policies) { if ($p2.FriendlyName -eq 'DIAG-SAC-RULES') { $still = $true } }
              } catch { }
              $lines += ('policy still listed after removal: {0}' -f $still)
              if ($still) {
                $neutralDir = Join-Path $env:RUNNER_TEMP 'diag-work\sacpol\neutral'
                if (Test-Path -LiteralPath $neutralDir) {
                  foreach ($cf in (Get-ChildItem -LiteralPath $neutralDir -Filter '*.cip')) {
                    $up = (& $ci --update-policy $cf.FullName 2>&1 | Out-String)
                    $lines += ('deployed neutral (audit mode) policy ' + $cf.Name + ': ' + $up.Trim())
                  }
                } else {
                  $lines += 'no neutral policy folder found'
                }
              }
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          $dest = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (-not (Test-Path -LiteralPath $dest)) { New-Item -ItemType Directory -Path $dest -Force | Out-Null }
          $lines | Set-Content -LiteralPath (Join-Path $dest 'ensure-policy-removed.txt')
          exit 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job sacrules --os ${{ matrix.os }} --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-sacrules-${{ matrix.os }}
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  # The full reproduction with REAL Smart App Control (diag/sacreal-e2e.ps1, windows-11-arm only). [sacreal-only] in the commit
  # message runs ONLY this job; it is skipped by [product-only] or [appe2e-only] alone (and runs when [sacreal-only] is present).
  sacreal-e2e:
    name: 'sacreal-e2e (windows-11-arm)'
    if: ${{ !contains(github.event.head_commit.message, '[w44-') && (contains(github.event.head_commit.message, '[sacreal-only]') || (!contains(github.event.head_commit.message, '[product-only]') && !contains(github.event.head_commit.message, '[appe2e-only]') && !contains(github.event.head_commit.message, '[cysdwin-only]'))) }}
    runs-on: windows-11-arm
    timeout-minutes: 50
    env:
      DIAG_MATRIX_OS: windows-11-arm
      DIAG_JOB_LIMIT_MIN: '40'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      # one step = one PowerShell process: install 0.14.37 -> start the app -> SAC ON -> matrix -> install_update -> start the app
      # again -> RESTORE (see diag/sacreal-e2e.ps1). GITHUB_TOKEN is only for the checkpoint uploads the script makes (before SAC
      # is turned on, after scenario A), so that the results survive even if SAC takes the runner down.
      - name: sacreal-e2e
        shell: powershell
        continue-on-error: true
        timeout-minutes: 38
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\sacreal-e2e.ps1"
          Write-Host "sacreal-e2e exit code: $LASTEXITCODE"
          exit 0

      # Safety net that works even when the sacreal-e2e process died (or timed out) while SAC was on, and even when a NEW PowerShell
      # would be in Constrained Language Mode: only cmd, reg.exe and CiTool.exe. Writes the value 0 if it is not 0, then refreshes.
      - name: ensure-sac-restored
        if: ${{ always() }}
        shell: cmd
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set "SACKEY=HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy"
          set "SACVAL=VerifiedAndReputablePolicyState"
          set "SACLOG=%RUNNER_TEMP%\diag-out\ensure-sac-restored.txt"
          if not exist "%RUNNER_TEMP%\diag-out" mkdir "%RUNNER_TEMP%\diag-out"
          echo ensure-sac-restored %DATE% %TIME% > "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          set "SACCUR="
          for /f "tokens=3" %%A in ('reg query "%SACKEY%" /v %SACVAL% 2^>nul ^| findstr /i "%SACVAL%"') do set "SACCUR=%%A"
          echo value before = [%SACCUR%] >> "%SACLOG%"
          if /i not "%SACCUR%"=="0x0" reg add "%SACKEY%" /v %SACVAL% /t REG_DWORD /d 0 /f >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -r < nul >> "%SACLOG%" 2>&1
          echo CiTool refresh rc = %ERRORLEVEL% >> "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -lp -json < nul > "%RUNNER_TEMP%\diag-out\ensure-sac-restored-citool-lp.json" 2>&1
          type "%SACLOG%"
          exit /b 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job sacreal-e2e --os windows-11-arm --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-sacreal-e2e-windows-11-arm
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  # The PRODUCT's installer-launch module (diag/product/update_launch.rs = src/update_launch.rs, byte for byte) on REAL Smart App
  # Control (diag/product-launch.ps1, windows-11-arm only). [product-only] in the commit message runs ONLY this job; it is skipped by
  # [sacreal-only] or [appe2e-only] alone (and runs when [product-only] is present).
  product-launch:
    name: 'product-launch (windows-11-arm)'
    if: ${{ !contains(github.event.head_commit.message, '[w44-') && (contains(github.event.head_commit.message, '[product-only]') || (!contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[appe2e-only]') && !contains(github.event.head_commit.message, '[cysdwin-only]'))) }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      DIAG_MATRIX_OS: windows-11-arm
      DIAG_JOB_LIMIT_MIN: '26'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      # one step = one PowerShell process: build the two drivers (x64 = verdict, aarch64 = auxiliary) -> start them (OFF stage) ->
      # checkpoint -> SAC ON -> go -> ON stage -> RESTORE (see diag/product-launch.ps1). GITHUB_TOKEN is only for the checkpoint
      # upload the script makes before SAC is turned on.
      - name: product-launch
        shell: powershell
        continue-on-error: true
        timeout-minutes: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\product-launch.ps1"
          Write-Host "product-launch exit code: $LASTEXITCODE"
          exit 0

      # Safety net that works even when the product-launch process died (or timed out) while SAC was on, and even when a NEW PowerShell
      # would be in Constrained Language Mode: only cmd, reg.exe and CiTool.exe. Writes the value 0 if it is not 0, then refreshes.
      - name: ensure-sac-restored
        if: ${{ always() }}
        shell: cmd
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set "SACKEY=HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy"
          set "SACVAL=VerifiedAndReputablePolicyState"
          set "SACLOG=%RUNNER_TEMP%\diag-out\ensure-sac-restored.txt"
          if not exist "%RUNNER_TEMP%\diag-out" mkdir "%RUNNER_TEMP%\diag-out"
          echo ensure-sac-restored %DATE% %TIME% > "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          set "SACCUR="
          for /f "tokens=3" %%A in ('reg query "%SACKEY%" /v %SACVAL% 2^>nul ^| findstr /i "%SACVAL%"') do set "SACCUR=%%A"
          echo value before = [%SACCUR%] >> "%SACLOG%"
          if /i not "%SACCUR%"=="0x0" reg add "%SACKEY%" /v %SACVAL% /t REG_DWORD /d 0 /f >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -r < nul >> "%SACLOG%" 2>&1
          echo CiTool refresh rc = %ERRORLEVEL% >> "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -lp -json < nul > "%RUNNER_TEMP%\diag-out\ensure-sac-restored-citool-lp.json" 2>&1
          type "%SACLOG%"
          exit /b 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job product-launch --os windows-11-arm --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-product-launch-windows-11-arm
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  # Reads diag/appe2e-input.json (the master fills in windows_build_run_id = the run of windows-build.yml for the product branch,
  # right before pushing; 0 = no input). A tiny ubuntu job so that no Windows runner is allocated for app-e2e without an input.
  # Optional keys (README 7th section; without them nothing changes but the scene list): release_tag "vX.Y.Z" (the installer of that
  # release, a draft too - it wins over the run id), scenes ["fresh","upgrade"] (default: both; one is allowed), upgrade_from "0.14.42",
  # upgrade_mode "emulate" | "updater", upgrade_expect "X.Y.Z" (needed for updater). Every value is checked for its form; a bad one is
  # printed (also as a notice annotation), handed on as `why`, and go is false. go = no bad value AND (run id above 0 OR release_tag OR
  # the only scene is upgrade in updater mode, which needs no installer). When go is false the scene list is ["fresh"]: a run that is
  # forced by [appe2e-only] then allocates ONE runner, as before, and writes the reason into its result.
  appe2e-gate:
    name: 'appe2e-gate'
    if: ${{ !contains(github.event.head_commit.message, '[w44-') && (contains(github.event.head_commit.message, '[appe2e-only]') || (!contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[product-only]') && !contains(github.event.head_commit.message, '[cysdwin-only]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.read.outputs.go }}
      run_id: ${{ steps.read.outputs.run_id }}
      artifact: ${{ steps.read.outputs.artifact }}
      release_tag: ${{ steps.read.outputs.release_tag }}
      scenes: ${{ steps.read.outputs.scenes }}
      upgrade_from: ${{ steps.read.outputs.upgrade_from }}
      upgrade_mode: ${{ steps.read.outputs.upgrade_mode }}
      upgrade_expect: ${{ steps.read.outputs.upgrade_expect }}
      why: ${{ steps.read.outputs.why }}
    steps:
      - uses: actions/checkout@v4

      - name: read-input
        id: read
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          rid = 0
          art = 'cys-windows-x64-nsis'
          tag = ''
          scenes = ['fresh', 'upgrade']
          ufrom = '0.14.42'
          umode = 'emulate'
          uexp = ''
          bad = []
          d = {}
          try:
              d = json.load(open('diag/appe2e-input.json', encoding='utf-8'))
              rid = int(str(d.get('windows_build_run_id') or 0).strip() or 0)
              art = str(d.get('artifact') or art).strip() or art
          except Exception as e:
              print('appe2e-input.json unreadable: %s' % e, file=sys.stderr)
              bad.append('diag/appe2e-input.json could not be read (%s)' % type(e).__name__)
          if not isinstance(d, dict):
              d = {}
              bad.append('diag/appe2e-input.json is not a JSON object')
          def one(name):
              v = d.get(name)
              return '' if v is None else str(v).strip()
          VER = r'[0-9]+\.[0-9]+\.[0-9]+'
          v = one('release_tag')
          if v:
              if re.fullmatch('v' + VER, v):
                  tag = v
              else:
                  bad.append('release_tag must look like v0.14.43')
          sc = d.get('scenes')
          if sc is not None:
              if isinstance(sc, list) and sc and all(isinstance(x, str) and x in ('fresh', 'upgrade') for x in sc) and len(set(sc)) == len(sc):
                  scenes = [x for x in ('fresh', 'upgrade') if x in sc]
              else:
                  bad.append('scenes must be a non-empty array of "fresh" / "upgrade" without repeats')
          v = one('upgrade_from')
          if v:
              if re.fullmatch(VER, v):
                  ufrom = v
              else:
                  bad.append('upgrade_from must look like 0.14.42')
          v = one('upgrade_mode')
          if v:
              if v in ('emulate', 'updater'):
                  umode = v
              else:
                  bad.append('upgrade_mode must be emulate or updater')
          v = one('upgrade_expect')
          if v:
              if re.fullmatch(VER, v):
                  uexp = v
              else:
                  bad.append('upgrade_expect must look like 0.14.43')
          if not bad and 'upgrade' in scenes and umode == 'updater' and not uexp:
              bad.append('upgrade_mode updater needs upgrade_expect (the version the public endpoint must offer)')
          # the installer under test is needed by every scene except "upgrade in updater mode" (that old app downloads by itself)
          needs_installer = ('fresh' in scenes) or (umode == 'emulate')
          go = (not bad) and (rid > 0 or tag != '' or not needs_installer)
          why = re.sub(r'[\r\n]+', ' ', '; '.join(bad))[:400]
          if not go:
              scenes = ['fresh']
          msg = 'go=%s run_id=%d release_tag=%s scenes=%s upgrade %s -> %s (%s)%s' % ('true' if go else 'false', rid, tag or '-', ','.join(scenes), ufrom, uexp or '(the installer under test)', umode, (' REFUSED: ' + why) if why else '')
          print('::notice title=appe2e-gate::' + msg.replace('%', '%25'), file=sys.stderr)
          print('run_id=%d' % rid)
          print('artifact=%s' % art)
          print('release_tag=%s' % tag)
          print('scenes=%s' % json.dumps(scenes, separators=(',', ':')))
          print('upgrade_from=%s' % ufrom)
          print('upgrade_mode=%s' % umode)
          print('upgrade_expect=%s' % uexp)
          print('why=%s' % why)
          print('go=%s' % ('true' if go else 'false'))
          PY
          cat "$GITHUB_OUTPUT"

  # The WHOLE 0.14.43 app on a real Windows 11 (diag/app-e2e.ps1, windows-11-arm only): installer built by windows-build.yml for the
  # product branch (artifact of the run in diag/appe2e-input.json), updated through the REAL Update button (click flow), once with
  # SAC off (success path) and once with REAL Smart App Control on (blocked path). [appe2e-only] in the commit message runs ONLY this
  # job (and its gate); it is skipped by [sacreal-only] or [product-only] alone; without a tag it runs only when the input has a run id.
  # 5th run: after the restore a LAST scene TEAM runs in the same script (the "create a team directly" flow of the real UI, SAC off:
  # app start + up to 6 min of observation + evidence, about 10-14 min) - the job and the script step got +15 min for it, and
  # DIAG_TEAM_EXTRA_MIN (+15, on top of DIAG_JOB_LIMIT_MIN 40 which the OFF / ON scenes keep using unchanged) is the time the scene may use.
  # 7th README section: the job is a MATRIX over the scenes of the gate (APPE2E_SCENE). scene fresh = everything above, unchanged (result
  # branch / artifact names keep "app-e2e"). scene upgrade = diag/app-upgrade.ps1 through the same script: a public older version is
  # installed and running, the installer under test goes on top of it the way that old app's updater does it, then the TEAM scene
  # runs on the upgraded app (results: job name "app-upgrade"). The upgrade scene never turns Smart App Control on. The installer
  # under test comes from the windows-build artifact (download-installer) or from a release (download-release-installer), never both.
  app-e2e:
    name: 'app-e2e (windows-11-arm, ${{ matrix.scene }})'
    needs: appe2e-gate
    if: ${{ !contains(github.event.head_commit.message, '[w44-') && (contains(github.event.head_commit.message, '[appe2e-only]') || (needs.appe2e-gate.outputs.go == 'true' && !contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[product-only]') && !contains(github.event.head_commit.message, '[cysdwin-only]'))) }}
    runs-on: windows-11-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # the scene list of the gate, always a JSON array; the fallback only matters when the gate left no output at all
        scene: ${{ fromJSON(needs.appe2e-gate.outputs.scenes || '["fresh"]') }}
    # download-artifact reads the artifacts of ANOTHER workflow run: needs actions: read (a job level block replaces the workflow one)
    permissions:
      contents: write
      actions: read
    env:
      DIAG_MATRIX_OS: windows-11-arm
      DIAG_JOB_LIMIT_MIN: '40'
      DIAG_TEAM_EXTRA_MIN: '50'
      APPE2E_RUN_ID: ${{ needs.appe2e-gate.outputs.run_id }}
      APPE2E_ARTIFACT: ${{ needs.appe2e-gate.outputs.artifact }}
      APPE2E_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/diag/appe2e-manifest.json
      APPE2E_SCENE: ${{ matrix.scene }}
      APPE2E_RELEASE_TAG: ${{ needs.appe2e-gate.outputs.release_tag }}
      APPE2E_UPGRADE_FROM: ${{ needs.appe2e-gate.outputs.upgrade_from }}
      APPE2E_UPGRADE_MODE: ${{ needs.appe2e-gate.outputs.upgrade_mode }}
      APPE2E_UPGRADE_EXPECT: ${{ needs.appe2e-gate.outputs.upgrade_expect }}
      APPE2E_GATE_WHY: ${{ needs.appe2e-gate.outputs.why }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      # the NSIS setup.exe of the product build (artifact name and path: windows-build.yml, "Upload NSIS installer artifact");
      # not when a release tag is given (that wins) and not without a run id (upgrade in updater mode needs no installer)
      - name: download-installer
        if: ${{ needs.appe2e-gate.outputs.go == 'true' && needs.appe2e-gate.outputs.release_tag == '' && needs.appe2e-gate.outputs.run_id != '0' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.appe2e-gate.outputs.artifact }}
          run-id: ${{ needs.appe2e-gate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}\appe2e-installer

      # OR the installer of a RELEASE of this repository, into the same folder (README 7th section): diag/fetch-release-asset.mjs finds the
      # release by tag_name in the release list (a DRAFT has no tag endpoint; this job's token has contents: write, so drafts are listed),
      # takes the one asset that ends with _x64-setup.exe, and checks size and digest. Its report (also when it fails) goes to the
      # results folder. The token is never printed and is not sent to the storage host the download is redirected to.
      - name: download-release-installer
        if: ${{ needs.appe2e-gate.outputs.go == 'true' && needs.appe2e-gate.outputs.release_tag != '' }}
        shell: cmd
        continue-on-error: true
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\fetch-release-asset.mjs --tag "%APPE2E_RELEASE_TAG%" --suffix _x64-setup.exe --out "%RUNNER_TEMP%\appe2e-installer" --report "%RUNNER_TEMP%\diag-out\appe2e-installer-source.json"

      # one step = one PowerShell process: inputs -> OFF run (success path) -> reinstall -> ON run under REAL SAC -> RESTORE -> cleanup ->
      # events -> verdict -> summary -> TEAM scene (last, SAC off; +15 min of step time for it) -> TEAM report (see diag/app-e2e.ps1).
      # GITHUB_TOKEN is only for the checkpoint upload the script makes before SAC is turned on.
      # With APPE2E_SCENE=upgrade the same script runs the UPGRADE scene instead (diag/app-upgrade.ps1; no SAC switch, no checkpoint).
      - name: app-e2e
        shell: powershell
        continue-on-error: true
        timeout-minutes: 105
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPE2E_INSTALLER_DIR: ${{ runner.temp }}\appe2e-installer
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\app-e2e.ps1"
          Write-Host "app-e2e exit code: $LASTEXITCODE"
          exit 0

      # Safety net that works even when the app-e2e process died (or timed out) while SAC was on, and even when a NEW PowerShell
      # would be in Constrained Language Mode: only cmd, reg.exe and CiTool.exe. Writes the value 0 if it is not 0, then refreshes.
      - name: ensure-sac-restored
        if: ${{ always() }}
        shell: cmd
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set "SACKEY=HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy"
          set "SACVAL=VerifiedAndReputablePolicyState"
          set "SACLOG=%RUNNER_TEMP%\diag-out\ensure-sac-restored.txt"
          if not exist "%RUNNER_TEMP%\diag-out" mkdir "%RUNNER_TEMP%\diag-out"
          echo ensure-sac-restored %DATE% %TIME% > "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          set "SACCUR="
          for /f "tokens=3" %%A in ('reg query "%SACKEY%" /v %SACVAL% 2^>nul ^| findstr /i "%SACVAL%"') do set "SACCUR=%%A"
          echo value before = [%SACCUR%] >> "%SACLOG%"
          if /i not "%SACCUR%"=="0x0" reg add "%SACKEY%" /v %SACVAL% /t REG_DWORD /d 0 /f >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -r < nul >> "%SACLOG%" 2>&1
          echo CiTool refresh rc = %ERRORLEVEL% >> "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -lp -json < nul > "%RUNNER_TEMP%\diag-out\ensure-sac-restored-citool-lp.json" 2>&1
          type "%SACLOG%"
          exit /b 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job ${{ matrix.scene == 'upgrade' && 'app-upgrade' || 'app-e2e' }} --os windows-11-arm --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.scene == 'upgrade' && 'app-upgrade' || 'app-e2e' }}-windows-11-arm
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  # The cysd unit specimens of the PRODUCT on a REAL Windows, with their FULL failure text (diag/cysdwin-digest.py). windows-health.yml of
  # the product runs `cargo test --bin cysd` as a non-blocking step, but its log cannot be read anonymously (annotations show a cut list
  # only). This job runs the SAME command in the SAME environment - runner windows-latest (x64, the label of windows-health.yml), bash,
  # PYTHONUTF8=1, Python 3.12 (setup-python), dtolnay/rust-toolchain@stable, CYS_PACK_DIR=$(mktemp -d), --test-threads=1 --nocapture and
  # the skip list of the input file - keeps the whole log, cuts it into one file per failure + a digest + a summary, and publishes
  # them to a results branch. Input: diag/cysdwin-input.json {"ref": <product commit SHA of THIS repository>, "filter": "", "skip": [...]};
  # the product is checked out into the separate folder p/ (a short name on purpose: the Windows path stays close to the one
  # windows-health builds in). [cysdwin-only] in the commit message runs ONLY this job; the other tags alone never run it, and without
  # a tag it does not run at all (unlike the other jobs it has no default run). The cargo step may take 45 minutes (build included).
  cysd-win:
    name: 'cysd-win (windows-latest)'
    if: ${{ !contains(github.event.head_commit.message, '[w44-') && (contains(github.event.head_commit.message, '[cysdwin-only]')) }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # the job env of windows-health: UTF-8 mode for every python step
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reads and checks diag/cysdwin-input.json. Never fails: a problem becomes go=false plus a reason that the digest step writes into
      # the summary. The values travel as step outputs and reach later scripts only through env: (never pasted into a script text).
      - name: read-input
        id: input
        shell: powershell
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $go = 'false'
          $why = ''
          $ref = ''
          $filter = ''
          $skips = ''
          try {
            $path = Join-Path $env:GITHUB_WORKSPACE 'diag\cysdwin-input.json'
            $j = ConvertFrom-Json ([System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8))
            $ref = ([string]$j.ref).Trim()
            $filter = ([string]$j.filter).Trim()
            $sk = New-Object System.Collections.Generic.List[string]
            foreach ($s in @($j.skip)) {
              $t = ([string]$s).Trim()
              if ($t) { $sk.Add($t) }
            }
            if (-not $ref) {
              $why = 'diag/cysdwin-input.json: ref is empty (put the product commit SHA there)'
            } elseif ($ref -notmatch '^[0-9A-Za-z][0-9A-Za-z._/-]{0,199}$') {
              $why = 'diag/cysdwin-input.json: ref has characters that are not allowed'
            } elseif ($filter -notmatch '^[A-Za-z0-9_:]*$') {
              $why = 'diag/cysdwin-input.json: filter has characters that are not allowed (letters, digits, _ and : only)'
            } else {
              $bad = @($sk.ToArray() | Where-Object { $_ -notmatch '^[A-Za-z0-9_:]+$' })
              if ($bad.Count -gt 0) {
                $why = 'diag/cysdwin-input.json: skip names with characters that are not allowed: ' + ($bad -join ', ')
              } else {
                $go = 'true'
                $skips = ($sk.ToArray() -join ' ')
              }
            }
          } catch {
            $why = 'diag/cysdwin-input.json could not be read: ' + $_.Exception.Message
          }
          $why = ($why -replace '[\r\n]+', ' ')
          $enc = New-Object System.Text.UTF8Encoding($false)
          $text = 'go=' + $go + "`n" + 'ref=' + $ref + "`n" + 'filter=' + $filter + "`n" + 'skips=' + $skips + "`n" + 'why=' + $why + "`n"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $text, $enc)
          Write-Host ('cysd-win input: go={0} ref={1} filter=[{2}] skips=[{3}] why=[{4}]' -f $go, $ref, $filter, $skips, $why)
          exit 0

      # the product commit, in its own folder (fetch-depth 0 as in windows-health; no credentials are left in the checkout)
      - name: checkout-product
        id: pco
        if: ${{ steps.input.outputs.go == 'true' }}
        uses: actions/checkout@v4
        timeout-minutes: 15
        with:
          ref: ${{ steps.input.outputs.ref }}
          path: p
          fetch-depth: 0
          persist-credentials: false

      # no go-condition on purpose: the digest step needs this python even when the product checkout failed or the input was bad
      - name: Setup Python 3.12
        if: ${{ always() }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust toolchain (as windows-health)
        if: ${{ steps.input.outputs.go == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      # facts that explain a different result later (image version, toolchain, paths); written to the results folder
      - name: environment facts
        if: ${{ steps.input.outputs.go == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set +e
          OUT="${RUNNER_TEMP}/diag-out"
          mkdir -p "$OUT"
          {
            echo "== runner =="
            echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?} RUNNER_OS=${RUNNER_OS:-?} RUNNER_ARCH=${RUNNER_ARCH:-?} RUNNER_NAME=${RUNNER_NAME:-?}"
            echo "== versions =="
            rustc -Vv 2>&1
            cargo -V 2>&1
            rustup show 2>&1 | head -20
            python --version 2>&1
            bash --version 2>&1 | head -1
            git --version 2>&1
            node --version 2>&1
            echo "== product checkout =="
            git -C p log -1 --format='%H %s' 2>&1
            echo "== variables (selected) =="
            for v in HOME USERPROFILE APPDATA LOCALAPPDATA TEMP TMP RUNNER_TEMP GITHUB_WORKSPACE PYTHONUTF8 OSTYPE MSYSTEM CARGO_HOME RUSTUP_HOME; do echo "$v=${!v:-<unset>}"; done
            echo "== PATH (bash view, first 25) =="
            echo "$PATH" | tr ':' '\n' | head -25
            echo "== uname / ver =="
            uname -a
            cmd //c ver
          } > "$OUT/cysdwin-env.txt" 2>&1
          exit 0

      # the cysd step of windows-health.yml, with the log kept whole: -e off, rc caught from PIPESTATUS, the log streamed through tee,
      # CYS_PACK_DIR=$(mktemp -d), --test-threads=1 --nocapture, the skip list from the input file. continue-on-error: a failing or cut
      # run still goes on to the digest. The 45 minutes cover build and run.
      - name: cargo test --bin cysd (as windows-health, full log kept)
        id: cysd
        if: ${{ steps.input.outputs.go == 'true' }}
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        working-directory: p
        env:
          CYSD_FILTER: ${{ steps.input.outputs.filter }}
          CYSD_SKIPS: ${{ steps.input.outputs.skips }}
        run: |
          set +e
          set -uo pipefail
          CYSD_DIR="${RUNNER_TEMP:-/tmp}/cysd-win"
          rm -rf "$CYSD_DIR"
          mkdir -p "$CYSD_DIR"
          date +%s > "$CYSD_DIR/start"
          LOG="$CYSD_DIR/cargo.log"
          args=(--test-threads=1 --nocapture)
          for s in $CYSD_SKIPS; do args+=(--skip "$s"); done
          flt=()
          if [ -n "${CYSD_FILTER:-}" ]; then flt=("$CYSD_FILTER"); fi
          cmdline="cargo test --bin cysd --"
          if [ -n "${CYSD_FILTER:-}" ]; then cmdline="$cmdline $CYSD_FILTER"; fi
          echo "$cmdline ${args[*]}" > "$CYSD_DIR/cmd.txt"
          cat "$CYSD_DIR/cmd.txt"
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cysd -- ${flt[@]+"${flt[@]}"} "${args[@]}" 2>&1 | tee "$LOG"
          rc="${PIPESTATUS[0]}"
          date +%s > "$CYSD_DIR/end"
          echo "$rc" > "$CYSD_DIR/rc"
          exit "$rc"

      # publish-results.mjs needs a current Node (global fetch, AbortSignal.timeout): set up AFTER the cargo step so that the test
      # environment is the one of windows-health
      - uses: actions/setup-node@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          node-version: '22'

      # failure files + digest + summary + the whole log (cut when it is too big for the publisher): diag/cysdwin-digest.py never fails
      - name: digest
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          CYSD_REF: ${{ steps.input.outputs.ref }}
          CYSD_FILTER: ${{ steps.input.outputs.filter }}
          CYSD_SKIPS: ${{ steps.input.outputs.skips }}
          CYSD_WHY: ${{ steps.input.outputs.why }}
          CYSD_O_INPUT: ${{ steps.input.outcome }}
          CYSD_O_CHECKOUT: ${{ steps.pco.outcome }}
          CYSD_O_CARGO: ${{ steps.cysd.outcome }}
          # Git Bash must not rewrite slashes/colons in the arguments (the why text has both)
          MSYS_NO_PATHCONV: '1'
        run: |
          set +e
          D="${RUNNER_TEMP}/cysd-win"
          OUT="${RUNNER_TEMP}/diag-out"
          mkdir -p "$OUT"
          python "$GITHUB_WORKSPACE/diag/cysdwin-digest.py" --dir "$D" --out "$OUT" --ref "$CYSD_REF" --filter "$CYSD_FILTER" --skip "$CYSD_SKIPS" --why "$CYSD_WHY" --outcome "read-input=$CYSD_O_INPUT" --outcome "checkout-product=$CYSD_O_CHECKOUT" --outcome "cargo=$CYSD_O_CARGO" --annotate
          echo "digest exit code: $?"
          # python missing or dead: at least the raw log goes to the results folder (cut by hand when it is bigger than the publisher takes)
          if [ ! -f "$OUT/cysdwin-cargo.log" ] && [ -f "$D/cargo.log" ]; then
            sz="$(wc -c < "$D/cargo.log")"
            if [ "$sz" -le 40000000 ]; then
              cp "$D/cargo.log" "$OUT/cysdwin-cargo.log"
            else
              { head -c 15000000 "$D/cargo.log"; printf '\n[... CUT by the workflow fallback: log has %s bytes ...]\n' "$sz"; tail -c 15000000 "$D/cargo.log"; } > "$OUT/cysdwin-cargo.log"
            fi
          fi
          exit 0

      - name: list-out
        if: ${{ always() }}
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      # same call form as the other jobs. continue-on-error: the one thing that can fail here is the raw log (up to 40 MB, sent as one
      # base64 blob; the publisher gives each request 60 s and throws away the whole publish when one blob does not go through) -
      # the next step then publishes everything else
      - name: publish-results
        id: pub
        if: ${{ always() }}
        continue-on-error: true
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job cysd-win --os windows-latest --out "%RUNNER_TEMP%\diag-out"

      # only when the publish above failed: a copy of the results folder WITHOUT the raw log goes to the same branch (the raw log stays in
      # the artifact of this run). This step has no continue-on-error: if it fails too, the job is red.
      - name: publish-results (again, without the raw log)
        if: ${{ always() && steps.pub.outcome == 'failure' }}
        shell: bash
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          LITE="${RUNNER_TEMP}/diag-out-lite"
          rm -rf "$LITE"
          mkdir -p "$LITE"
          cp -R "${RUNNER_TEMP}/diag-out/." "$LITE/"
          rm -f "$LITE/cysdwin-cargo.log"
          printf '%s\n' 'The first publish of this job failed (most likely because of the raw log cysdwin-cargo.log, which can be 40 MB).' 'The raw log is NOT in this branch; it is in the artifact diag-cysd-win-windows-latest of the same run. The cysdwin-summary.txt text about the raw log describes the file as it was written, not this branch.' > "$LITE/cysdwin-RAWLOG-NOT-PUBLISHED.txt"
          node diag/publish-results.mjs --job cysd-win --os windows-latest --out "$LITE"

      - name: upload-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diag-cysd-win-windows-latest
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14
