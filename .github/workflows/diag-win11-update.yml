# Diagnostic harness: does the in-app update (0.14.37 -> 0.14.42) work on a REAL Windows 11?
# See diag/README.md. Measurement steps never turn the job red (their result IS the data);
# only a failing publish step stays red. Results go to branch diag-results/<run>-<attempt>-<job>-<os>.
# Commit message tags choose the jobs: [product-only] -> only product-launch, [sacreal-only] -> only sacreal-e2e,
# [appe2e-only] -> only app-e2e (+ its tiny gate job), no tag -> all jobs (app-e2e only when diag/appe2e-input.json has a run id above 0).
# e2e and sacrules run only when none of the three tags is present.
name: diag-win11-update

on:
  push:
    branches: ['diag/**']

permissions:
  contents: write

concurrency:
  group: diag-win11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: 'e2e (${{ matrix.os }})'
    if: ${{ !contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[product-only]') && !contains(github.event.head_commit.message, '[appe2e-only]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025, windows-2022]
    env:
      DIAG_MATRIX_OS: ${{ matrix.os }}
      DIAG_JOB_LIMIT_MIN: '50'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      - name: e2e-update
        shell: powershell
        continue-on-error: true
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\e2e-update.ps1"
          Write-Host "e2e-update exit code: $LASTEXITCODE"
          exit 0

      - name: replica
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\replica.ps1"
          Write-Host "replica exit code: $LASTEXITCODE"
          exit 0

      # sac-real flips the real Smart App Control state: save everything measured so far first
      - name: publish-checkpoint (before sac-real)
        if: matrix.os == 'windows-11-arm'
        shell: cmd
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job e2e-pre-sacreal --os ${{ matrix.os }} --out "%RUNNER_TEMP%\diag-out"

      - name: sac-real
        if: matrix.os == 'windows-11-arm'
        shell: powershell
        continue-on-error: true
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\sac-real.ps1"
          Write-Host "sac-real exit code: $LASTEXITCODE"
          exit 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job e2e --os ${{ matrix.os }} --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  sacrules:
    name: 'sacrules (${{ matrix.os }})'
    if: ${{ !contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[product-only]') && !contains(github.event.head_commit.message, '[appe2e-only]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    env:
      DIAG_MATRIX_OS: ${{ matrix.os }}
      DIAG_JOB_LIMIT_MIN: '55'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      # one step = one PowerShell process: audit -> enforce -> remove (see diag/sacrules.ps1).
      # GITHUB_TOKEN is only for the checkpoint publishes sacrules.ps1 makes (before enforcing / after removing),
      # so that the audit results survive even if an enforced policy kills the runner.
      - name: sacrules
        shell: powershell
        continue-on-error: true
        timeout-minutes: 52
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\sacrules.ps1"
          Write-Host "sacrules exit code: $LASTEXITCODE"
          exit 0

      # Safety net that works even when the sacrules process died (or a NEW PowerShell is in Constrained Language Mode):
      # only core cmdlets and external commands. Removes any leftover DIAG-SAC-RULES policy.
      - name: ensure-policy-removed
        if: always()
        shell: powershell
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $lines = @()
          $ci = Join-Path $env:windir 'System32\CiTool.exe'
          if (-not (Test-Path -LiteralPath $ci)) {
            $lines += 'CiTool.exe not present: nothing to remove'
          } else {
            $raw = (& $ci -lp -json 2>&1 | Out-String)
            $lines += ('citool -lp -json returned {0} characters' -f $raw.Length)
            $found = 0
            try {
              $j = $raw | ConvertFrom-Json
              foreach ($p in $j.Policies) {
                if ($p.FriendlyName -eq 'DIAG-SAC-RULES') {
                  $found = $found + 1
                  $g = '{' + ([string]$p.PolicyID).Trim('{', '}') + '}'
                  $lines += ('leftover policy found, removing ' + $g)
                  $rm = (& $ci --remove-policy $g 2>&1 | Out-String)
                  $lines += ('remove output: ' + $rm.Trim())
                }
              }
            } catch {
              $lines += ('parse or remove problem: ' + $_.Exception.Message)
            }
            $lines += ('leftover DIAG-SAC-RULES policies handled: {0}' -f $found)
            if ($found -gt 0) {
              $raw2 = (& $ci -lp -json 2>&1 | Out-String)
              $still = $false
              try {
                $j2 = $raw2 | ConvertFrom-Json
                foreach ($p2 in $j2.Policies) { if ($p2.FriendlyName -eq 'DIAG-SAC-RULES') { $still = $true } }
              } catch { }
              $lines += ('policy still listed after removal: {0}' -f $still)
              if ($still) {
                $neutralDir = Join-Path $env:RUNNER_TEMP 'diag-work\sacpol\neutral'
                if (Test-Path -LiteralPath $neutralDir) {
                  foreach ($cf in (Get-ChildItem -LiteralPath $neutralDir -Filter '*.cip')) {
                    $up = (& $ci --update-policy $cf.FullName 2>&1 | Out-String)
                    $lines += ('deployed neutral (audit mode) policy ' + $cf.Name + ': ' + $up.Trim())
                  }
                } else {
                  $lines += 'no neutral policy folder found'
                }
              }
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          $dest = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (-not (Test-Path -LiteralPath $dest)) { New-Item -ItemType Directory -Path $dest -Force | Out-Null }
          $lines | Set-Content -LiteralPath (Join-Path $dest 'ensure-policy-removed.txt')
          exit 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job sacrules --os ${{ matrix.os }} --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-sacrules-${{ matrix.os }}
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  # The full reproduction with REAL Smart App Control (diag/sacreal-e2e.ps1, windows-11-arm only). [sacreal-only] in the commit
  # message runs ONLY this job; it is skipped by [product-only] or [appe2e-only] alone (and runs when [sacreal-only] is present).
  sacreal-e2e:
    name: 'sacreal-e2e (windows-11-arm)'
    if: ${{ contains(github.event.head_commit.message, '[sacreal-only]') || (!contains(github.event.head_commit.message, '[product-only]') && !contains(github.event.head_commit.message, '[appe2e-only]')) }}
    runs-on: windows-11-arm
    timeout-minutes: 50
    env:
      DIAG_MATRIX_OS: windows-11-arm
      DIAG_JOB_LIMIT_MIN: '40'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      # one step = one PowerShell process: install 0.14.37 -> start the app -> SAC ON -> matrix -> install_update -> start the app
      # again -> RESTORE (see diag/sacreal-e2e.ps1). GITHUB_TOKEN is only for the checkpoint uploads the script makes (before SAC
      # is turned on, after scenario A), so that the results survive even if SAC takes the runner down.
      - name: sacreal-e2e
        shell: powershell
        continue-on-error: true
        timeout-minutes: 38
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\sacreal-e2e.ps1"
          Write-Host "sacreal-e2e exit code: $LASTEXITCODE"
          exit 0

      # Safety net that works even when the sacreal-e2e process died (or timed out) while SAC was on, and even when a NEW PowerShell
      # would be in Constrained Language Mode: only cmd, reg.exe and CiTool.exe. Writes the value 0 if it is not 0, then refreshes.
      - name: ensure-sac-restored
        if: ${{ always() }}
        shell: cmd
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set "SACKEY=HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy"
          set "SACVAL=VerifiedAndReputablePolicyState"
          set "SACLOG=%RUNNER_TEMP%\diag-out\ensure-sac-restored.txt"
          if not exist "%RUNNER_TEMP%\diag-out" mkdir "%RUNNER_TEMP%\diag-out"
          echo ensure-sac-restored %DATE% %TIME% > "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          set "SACCUR="
          for /f "tokens=3" %%A in ('reg query "%SACKEY%" /v %SACVAL% 2^>nul ^| findstr /i "%SACVAL%"') do set "SACCUR=%%A"
          echo value before = [%SACCUR%] >> "%SACLOG%"
          if /i not "%SACCUR%"=="0x0" reg add "%SACKEY%" /v %SACVAL% /t REG_DWORD /d 0 /f >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -r < nul >> "%SACLOG%" 2>&1
          echo CiTool refresh rc = %ERRORLEVEL% >> "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -lp -json < nul > "%RUNNER_TEMP%\diag-out\ensure-sac-restored-citool-lp.json" 2>&1
          type "%SACLOG%"
          exit /b 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job sacreal-e2e --os windows-11-arm --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-sacreal-e2e-windows-11-arm
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  # The PRODUCT's installer-launch module (diag/product/update_launch.rs = src/update_launch.rs, byte for byte) on REAL Smart App
  # Control (diag/product-launch.ps1, windows-11-arm only). [product-only] in the commit message runs ONLY this job; it is skipped by
  # [sacreal-only] or [appe2e-only] alone (and runs when [product-only] is present).
  product-launch:
    name: 'product-launch (windows-11-arm)'
    if: ${{ contains(github.event.head_commit.message, '[product-only]') || (!contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[appe2e-only]')) }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      DIAG_MATRIX_OS: windows-11-arm
      DIAG_JOB_LIMIT_MIN: '26'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      # one step = one PowerShell process: build the two drivers (x64 = verdict, aarch64 = auxiliary) -> start them (OFF stage) ->
      # checkpoint -> SAC ON -> go -> ON stage -> RESTORE (see diag/product-launch.ps1). GITHUB_TOKEN is only for the checkpoint
      # upload the script makes before SAC is turned on.
      - name: product-launch
        shell: powershell
        continue-on-error: true
        timeout-minutes: 17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\product-launch.ps1"
          Write-Host "product-launch exit code: $LASTEXITCODE"
          exit 0

      # Safety net that works even when the product-launch process died (or timed out) while SAC was on, and even when a NEW PowerShell
      # would be in Constrained Language Mode: only cmd, reg.exe and CiTool.exe. Writes the value 0 if it is not 0, then refreshes.
      - name: ensure-sac-restored
        if: ${{ always() }}
        shell: cmd
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set "SACKEY=HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy"
          set "SACVAL=VerifiedAndReputablePolicyState"
          set "SACLOG=%RUNNER_TEMP%\diag-out\ensure-sac-restored.txt"
          if not exist "%RUNNER_TEMP%\diag-out" mkdir "%RUNNER_TEMP%\diag-out"
          echo ensure-sac-restored %DATE% %TIME% > "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          set "SACCUR="
          for /f "tokens=3" %%A in ('reg query "%SACKEY%" /v %SACVAL% 2^>nul ^| findstr /i "%SACVAL%"') do set "SACCUR=%%A"
          echo value before = [%SACCUR%] >> "%SACLOG%"
          if /i not "%SACCUR%"=="0x0" reg add "%SACKEY%" /v %SACVAL% /t REG_DWORD /d 0 /f >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -r < nul >> "%SACLOG%" 2>&1
          echo CiTool refresh rc = %ERRORLEVEL% >> "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -lp -json < nul > "%RUNNER_TEMP%\diag-out\ensure-sac-restored-citool-lp.json" 2>&1
          type "%SACLOG%"
          exit /b 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job product-launch --os windows-11-arm --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-product-launch-windows-11-arm
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14

  # Reads diag/appe2e-input.json (the master fills in windows_build_run_id = the run of windows-build.yml for the product branch,
  # right before pushing; 0 = no input). A tiny ubuntu job so that no Windows runner is allocated for app-e2e without an input.
  appe2e-gate:
    name: 'appe2e-gate'
    if: ${{ contains(github.event.head_commit.message, '[appe2e-only]') || (!contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[product-only]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.read.outputs.go }}
      run_id: ${{ steps.read.outputs.run_id }}
      artifact: ${{ steps.read.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: read-input
        id: read
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          rid = 0
          art = 'cys-windows-x64-nsis'
          try:
              d = json.load(open('diag/appe2e-input.json', encoding='utf-8'))
              rid = int(str(d.get('windows_build_run_id') or 0).strip() or 0)
              art = str(d.get('artifact') or art).strip() or art
          except Exception as e:
              print('appe2e-input.json unreadable: %s' % e, file=sys.stderr)
          print('run_id=%d' % rid)
          print('artifact=%s' % art)
          print('go=%s' % ('true' if rid > 0 else 'false'))
          PY
          cat "$GITHUB_OUTPUT"

  # The WHOLE 0.14.43 app on a real Windows 11 (diag/app-e2e.ps1, windows-11-arm only): installer built by windows-build.yml for the
  # product branch (artifact of the run in diag/appe2e-input.json), updated through the REAL Update button (click flow), once with
  # SAC off (success path) and once with REAL Smart App Control on (blocked path). [appe2e-only] in the commit message runs ONLY this
  # job (and its gate); it is skipped by [sacreal-only] or [product-only] alone; without a tag it runs only when the input has a run id.
  app-e2e:
    name: 'app-e2e (windows-11-arm)'
    needs: appe2e-gate
    if: ${{ contains(github.event.head_commit.message, '[appe2e-only]') || (needs.appe2e-gate.outputs.go == 'true' && !contains(github.event.head_commit.message, '[sacreal-only]') && !contains(github.event.head_commit.message, '[product-only]')) }}
    runs-on: windows-11-arm
    timeout-minutes: 50
    # download-artifact reads the artifacts of ANOTHER workflow run: needs actions: read (a job level block replaces the workflow one)
    permissions:
      contents: write
      actions: read
    env:
      DIAG_MATRIX_OS: windows-11-arm
      DIAG_JOB_LIMIT_MIN: '40'
      APPE2E_RUN_ID: ${{ needs.appe2e-gate.outputs.run_id }}
      APPE2E_ARTIFACT: ${{ needs.appe2e-gate.outputs.artifact }}
      APPE2E_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/diag/appe2e-manifest.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '22'

      # Windows PowerShell 5.1 parser over every diag script: a parse error would stop a script before it writes anything
      - name: syntax-check
        shell: powershell
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add(('PowerShell {0} on {1}' -f $PSVersionTable.PSVersion, $env:PROCESSOR_ARCHITECTURE))
          foreach ($f in (Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'diag') -Filter '*.ps1')) {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { $lines.Add(('PARSE ERROR {0}:{1}:{2} {3}' -f $f.Name, $e.Extent.StartLineNumber, $e.Extent.StartColumnNumber, $e.Message)) }
            } else {
              $lines.Add(('ok {0}' -f $f.Name))
            }
          }
          $lines | ForEach-Object { Write-Host $_ }
          [System.IO.File]::WriteAllText((Join-Path $out 'syntax-check.txt'), (($lines.ToArray()) -join "`r`n"))
          exit 0

      - name: p0-facts
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p0-facts.ps1"
          Write-Host "p0-facts exit code: $LASTEXITCODE"
          exit 0

      - name: p1-assets
        shell: powershell
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\p1-assets.ps1"
          Write-Host "p1-assets exit code: $LASTEXITCODE"
          exit 0

      # the NSIS setup.exe of the product build (artifact name and path: windows-build.yml, "Upload NSIS installer artifact")
      - name: download-installer
        if: ${{ needs.appe2e-gate.outputs.go == 'true' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.appe2e-gate.outputs.artifact }}
          run-id: ${{ needs.appe2e-gate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}\appe2e-installer

      # one step = one PowerShell process: inputs -> OFF run (success path) -> reinstall -> ON run under REAL SAC -> RESTORE (see
      # diag/app-e2e.ps1). GITHUB_TOKEN is only for the checkpoint upload the script makes before SAC is turned on.
      - name: app-e2e
        shell: powershell
        continue-on-error: true
        timeout-minutes: 36
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPE2E_INSTALLER_DIR: ${{ runner.temp }}\appe2e-installer
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\app-e2e.ps1"
          Write-Host "app-e2e exit code: $LASTEXITCODE"
          exit 0

      # Safety net that works even when the app-e2e process died (or timed out) while SAC was on, and even when a NEW PowerShell
      # would be in Constrained Language Mode: only cmd, reg.exe and CiTool.exe. Writes the value 0 if it is not 0, then refreshes.
      - name: ensure-sac-restored
        if: ${{ always() }}
        shell: cmd
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set "SACKEY=HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy"
          set "SACVAL=VerifiedAndReputablePolicyState"
          set "SACLOG=%RUNNER_TEMP%\diag-out\ensure-sac-restored.txt"
          if not exist "%RUNNER_TEMP%\diag-out" mkdir "%RUNNER_TEMP%\diag-out"
          echo ensure-sac-restored %DATE% %TIME% > "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          set "SACCUR="
          for /f "tokens=3" %%A in ('reg query "%SACKEY%" /v %SACVAL% 2^>nul ^| findstr /i "%SACVAL%"') do set "SACCUR=%%A"
          echo value before = [%SACCUR%] >> "%SACLOG%"
          if /i not "%SACCUR%"=="0x0" reg add "%SACKEY%" /v %SACVAL% /t REG_DWORD /d 0 /f >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -r < nul >> "%SACLOG%" 2>&1
          echo CiTool refresh rc = %ERRORLEVEL% >> "%SACLOG%"
          reg query "%SACKEY%" /v %SACVAL% >> "%SACLOG%" 2>&1
          "%windir%\System32\CiTool.exe" -lp -json < nul > "%RUNNER_TEMP%\diag-out\ensure-sac-restored-citool-lp.json" 2>&1
          type "%SACLOG%"
          exit /b 0

      - name: list-out
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $d = Join-Path $env:RUNNER_TEMP 'diag-out'
          if (Test-Path -LiteralPath $d) {
            Get-ChildItem -LiteralPath $d -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($d.Length + 1) }
          } else {
            Write-Host "no diag-out folder"
          }
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job app-e2e --os windows-11-arm --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-app-e2e-windows-11-arm
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14
