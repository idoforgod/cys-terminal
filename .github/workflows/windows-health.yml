name: windows-health (H-WIN 실기)

# ★목적(T-0147-7 W4 · 부채 V4 해소 · 검체 H-WIN-11): 부트스트랩 건강성 러너의 **Windows 검체군을
#   실제 Windows 에서 돌린다.** 지금까지 G18–G25(백슬래시·드라이브 경로·named pipe·taskkill·CYS_PY
#   폴백·pack-guard 접두·cygpath 안내)의 판정은 전부 **macOS 러너의 스텁 목**이었다 — 재감사가
#   RC4 로 분류한 "Windows 무검증 베이스라인"의 실체가 이것이다. 스텁은 회귀를 조기에 잡는 값싼
#   장치이지 플랫폼 증명이 아니다: 스텁이 초록인데 실기가 깨지는 조합(경로 구분자·PATH 해소·
#   락 프리미티브)이 이 리포에서 이미 두 번 실사고를 냈다(0.14.4 D1 형제 import · ConPTY 마우스).
#
# ★범위(최소 구성 — 의도된 한계)
#   · H-WIN-1~10 + A8 락(H-CONC-1·3) + A6 발화경로(H-DETECT-10) + H-WIN-11(잡 계약 자기검증)만 돈다.
#   · **전 검체를 돌리지 않는다**: 다수 검체가 macOS 전용 픽스처(launchd·lsof·flock)나 레포 전 트리
#     스캔을 전제해 Windows 에서 skip 이 되고, skip 무더기는 초록의 의미를 흐린다. 러너는 그래서
#     `--only` 로 대상을 명시한다(플랫폼 목록의 단일 출처는 아래 WIN_SPECIMENS 한 줄).
#   · 이 잡은 어떤 릴리스도 만들지 않고 아티팩트도 올리지 않는다(release.yml 과 완전 독립).
#
# ★레인 대조 게이트(ci-branch.yml '팩 스위트 레인 대조')와의 관계 — **의도적으로 등재하지 않았다**:
#   그 게이트는 `test_[a-z0-9_]+` 토큰(= `test_*.py` 스위트 이름)의 레인 간 드리프트를 본다. 이 잡은
#   개별 스위트를 직접 부르지 않고 **건강성 러너**만 부르므로 추출 토큰이 0건이고, 그 상태로
#   LANES/SUBSET_LANES 에 넣으면 게이트의 fail-closed(0건 추출=추출기 파손)가 발동해 CI 를
#   상시 적색으로 만든다. 러너의 검체 목록은 파일 안(`_REG`)에 있고 `--list`/`--json` 으로 기계
#   판독되므로 레인 간 사본이 애초에 없다. **이 잡이 나중에 `test_*.py` 를 직접 부르기 시작하면
#   그때 SUBSET_LANES 에 등재하라**(그 시점부터는 드리프트 표면이 생긴다).

# ★U-26 ①(2026-08-24 · 부트 결정론 캠페인): 종전 트리거는 `feat/**` push + 수동뿐이라
#   **태그 릴리스(`v*`)에서 Windows 검체가 한 번도 돌지 않았다.** 릴리스 레인(release.yml)은
#   같은 태그로 windows-latest 빌드를 돌리지만 그건 '컴파일·번들'이지 부트스트랩 계약 검증이
#   아니다 — 즉 출하 시점의 Windows 검증은 0 이었다(§10 D-6 · CHANGESET C-10).
#   ⚠ 비용 규율: 늘리는 것은 **태그 push 뿐**이다(`branches` 는 종전 그대로 `feat/**`).
#     GitHub Actions 의 push 필터는 branches/tags 가 OR 이고, 태그 push 는 branches 필터에
#     매칭되지 않으므로 일상 push 빈도는 하나도 늘지 않는다. 태그는 릴리스당 1회다.
#   ⚠ 이 잡은 **release.yml 을 막지 않는다**(GH Actions 는 워크플로 간 needs 가 없다).
#     같은 태그 SHA 의 체크로 나란히 뜨고, 공개 발행은 어차피 오너 승인(release-publish.yml)
#     이라 발행 전에 사람이 적색을 본다. '자동 차단'이 필요해지면 release-publish 쪽에
#     체크 조회를 다는 것이 다음 단계인데, 그건 발행을 막는 힘이라 별도 승인 사안이다.
#   롤백: 아래 `tags:` 두 줄 삭제 = 종전 동작(파일 1곳·부작용 0).
#
# ★fix/** 편입(2026-09-04 · master 판정 ⓐ — ci-branch `96502cc`·windows-build `153b1d1` 과 같은 형식).
#   위 U-26 이 '태그에서 0회'를 닫았지만 **수리 레인(`fix/0.14.30-*`)에서는 여전히 0회**였다.
#   Windows 부트스트랩 계약을 실제로 고치는 곳이 지금 그 수리 레인인데, 그 변경의 실기 판정이
#   태그 시점에야 나오면 되돌리는 비용이 가장 비싼 자리에서 처음 드러난다 — windows-build 가
#   같은 이유로 편입됐고(`153b1d1`), 첫 실발화가 곧바로 실회귀 1건을 잡았다(인코딩 → `16d2341`).
#   ⚠ 비용: 위 U-26 의 '일상 push 빈도는 안 늘어난다' 는 이제 성립하지 않는다. `fix/**` push 마다
#     이 잡이 돈다 — master 가 "C5-1 윈도우 실기 검증이 이 릴리스의 핵심 앵커라 레인 비용보다
#     관측 공백 제거가 우선"으로 판정했다. 완화는 워커 측 규율이다(논리 단위 2~3개마다 묶어서 push).
#   롤백: `branches` 에서 `'fix/**'` 한 항목 삭제 = 종전 동작.
on:
  push:
    branches: ['feat/**', 'fix/**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ⚠이 잡에는 `if:` 조건을 달지 마라. 조건부 Windows 검증은 "돌지 않는 초록"이 되고, 그것이
  #   부채 V4(무검증 베이스라인)의 재생산이다. 예산이 문제면 트리거(on:)를 좁혀라.
  win-health:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # ★Windows 러너 stdout 기본 cp1252 방어(run 31395642155): 한글 검체 title 인쇄가
      #   UnicodeEncodeError 로 죽어 실기 판정 전체가 관측 불능이 되던 결함. 러너 main 진입부
      #   reconfigure 가드와 이중 수리 — 잡의 모든 python 단계(--json 재실행·요약 인라인 포함)를 덮는다.
      PYTHONUTF8: '1'
    steps:
      # ★fetch-depth 0(2026-08-10 W-C · run 31396459407): H-WIN-5 의 계측기 자기검증은
      #   calibration ref(a96d8b1 등)의 실체를 요구한다 — 기본 shallow checkout 은 ref 부재로
      #   구 인벤토리 산출 0 → hard fail. 전체 이력을 받으면 다른 검체의 skip(no-git) 계측
      #   대조도 실측정으로 승격된다(부수 이득).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 러너는 stdlib 전용(네트워크 0)이라 별도 의존성 설치가 없다. 3.12 = 동봉 embeddable
      # 런타임(python-3.12.10-embed-amd64)과 같은 마이너로 맞춘다(실기 환경 근접).
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 실기 환경 사실을 먼저 기록한다 — 초록/빨강의 해석 근거다(bash=Git Bash 존재가 전제:
      # 훅 검체는 `bash <hook>` 으로 훅을 실행한다).
      - name: 실기 환경 확인 (python · bash · 경로 규약)
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys,os;print('python',sys.version.split()[0],'os.name',os.name)"
          bash --version | head -1
          echo "OSTYPE=${OSTYPE:-?} · which bash=$(command -v bash)"

      # ★H-WIN 검체 실기. `--json` 으로 기계 판독 결과를 남기고(회귀 시 원 결함 ID 역추적),
      #   러너 exit 를 그대로 잡 판정으로 쓴다(발효 검체의 fail 은 hard fail).
      - name: 부트스트랩 건강성 — H-WIN 검체 실기 (windows-latest)
        shell: bash
        run: |
          set -euo pipefail
          R="cysjavis-pack/bin/tests/run_bootstrap_health.py"
          [ -f "$R" ] || { echo "건강성 러너 누락: $R (git add 누락 의심)" >&2; exit 1; }
          # 플랫폼 검체 목록의 단일 출처(이 한 줄). H-WIN-11 은 잡 계약 자기검증 + 실기 재실행.
          # H-MISSION-1(기계유래 스폰 게이트 §4-10)은 Windows 실기 편입(2026-08-10 P3C) — git
          # 계측 대조(D4A_REF·pre-t1)는 shallow checkout 에서 graceful skip(no-git) 검증됨.
          # H-WIN-12(SYS32-TIMEOUT · 2026-08-13): System32 timeout.exe 함정에서 save-state.sh
          # BOOT_SNAPSHOT 생성 경로가 실행됨을 Windows 실기로 증명 — cys_timeout_run GNU 판별 수리의 검체.
          # ★H-IDENT-1 동승(2026-08-16): claim 신원 실패 ⇄ 정당거부 분리 3겹. 이 결함은 조상 체인
          #   단절이 원인이라 **Windows 에서 더 자주** 발현한다(git-bash 한 겹 + 고아 프로세스의
          #   부모 pid 소멸). 검체 자체는 소스 구조 판정이라 플랫폼 무관이지만, Windows 러너가
          #   빌드하는 그 트리에 3겹이 실제로 실려 있는지를 이 레인에서도 확증한다.
          # ★H-CYCLE-1 동승(2026-08-20 R3): cycle-autopilot Windows single-flight 개통 —
          #   count_cycle_agent os_name 분기표(nt=PowerShell CIM fail-closed) · pid_alive
          #   비파괴(OpenProcess 계열 · os.kill 0회) · self-test os.fork 케이스 한정 SKIP.
          #   판정은 주입식(전 플랫폼 결정론)이지만 Windows 실기 트리에 실려 있음을 이 레인이 확증한다.
          # ★H-PACK-CRLF 편입(2026-08-23 U-1): CRLF 결함은 **Windows 체크아웃에서만 발현**한다
          #   (Git for Windows 설치 기본값 core.autocrlf=true). 다른 OS 에서 아무리 초록이어도
          #   그것은 결함이 존재할 수 없는 환경에서의 초록이라 증거가치가 0이다 — 정확히
          #   이 파일 머리말이 말하는 "돌지 않는 초록". `.gitattributes` 봉인이 Windows 러너의
          #   실제 체크아웃 바이트를 LF 로 만드는지는 이 레인만이 실측할 수 있다.
          WIN_SPECIMENS="H-WIN-1,H-WIN-2,H-WIN-3,H-WIN-4,H-WIN-5,H-WIN-6,H-WIN-7,H-WIN-8,H-WIN-9,H-WIN-10,H-WIN-11,H-WIN-12,H-CONC-1,H-CONC-3,H-DETECT-10,H-MISSION-1,H-IDENT-1,H-CYCLE-1,H-PACK-CRLF"
          echo "== H-WIN 실기: $WIN_SPECIMENS =="
          # ★단일 실행 + rc 포획으로 교체(2026-09-04 실사고). 종전엔 bare 실행이 먼저 돌아
          #   `set -euo pipefail` 아래에서 스텝을 **즉사**시켰고, 검체별 사유를 찍는 아래 블록은
          #   정작 실패했을 때만 실행되지 않았다 — 진단이 필요 없을 때만 진단이 도는 구조다.
          #   실측: 8d03bf4 런(33874334807)의 annotation 은 "exit code 1" 한 줄이 전부였다.
          #   더구나 전 검체를 두 번 돌려 간헐 검체(H-CONC-3 등)는 두 판정이 갈릴 수 있었다.
          #   ci-branch 가 이미 쓰는 검증된 형식(`--json > 파일 || rc=$?` → 판독 블록)으로 맞춘다.
          rc=0
          python "$R" --only "$WIN_SPECIMENS" --json > win-health.json || rc=$?
          python - "$rc" <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          try:
              d = json.load(open("win-health.json", encoding="utf-8"))
          except Exception as e:                      # noqa: BLE001 — 파싱 실패도 관측 실패다
              print("::error::건강성 결과 JSON 을 읽지 못했다(%s) — 러너가 중도 사망했을 수 있다. "
                    "이 상태의 '문제 없음' 은 근거가 아니다(fail-closed)." % e, file=sys.stderr)
              sys.exit(1)
          s = d["summary"]
          print("[win-health] verdict=%s pass=%s fail=%s skip=%s pending=%s"
                % (s["verdict"], s["pass"], s["fail"], s["skip"], s["pending"]))
          for r in d["specimens"]:
              print("  %-6s %-12s %s" % (r["status"].upper(), r["id"], r.get("reason", r.get("detail", ""))[:160]))
          # ★실패 검체는 annotation 채널로 올린다(2026-09-04). 이 저장소의 CI 로그는 토큰 없이
          #   읽을 수 없어(익명 403) print 는 원인 추적에 쓸 수 없다 — check-runs 의 annotations
          #   만이 익명으로 읽힌다. ci-branch 가 이미 쓰는 형식을 그대로 따른다(검증됨:
          #   그 형식 덕에 H-CONC-3 을 로그 없이 특정했다).
          for r in d["specimens"]:
              if r["status"] == "fail":
                  print("::error title=%s::%s"
                        % (r["id"], (r.get("reason") or r.get("detail") or "")[:600]))
          # 측정 실패는 조용한 통과가 아니다 — 실기 목적이 skip 무더기로 무력화되면 잡을 세운다.
          if s["fail"]:
              sys.exit(1)
          if s["pass"] == 0:
              print("::error::Windows 실기에서 PASS 0건 — 검체가 전부 skip/pending 이면 이 잡은 "
                    "무검증 베이스라인을 재생산한다(fail-closed).", file=sys.stderr)
              sys.exit(1)
          # 러너가 0 이 아닌 rc 로 끝났는데 위 갈래가 아무것도 잡지 못했다면, 우리가 모르는
          # 이유로 죽은 것이다 — 그 상태의 초록은 근거가 아니다(rc 포획의 존재 이유).
          if rc != 0:
              print("::error::건강성 러너가 rc=%d 로 끝났는데 실패 검체는 0건이다 — 판정 불가(fail-closed)."
                    % rc, file=sys.stderr)
              sys.exit(1)
          PY

      # ★P1-4(완전 초기화 시뮬레이션 확정 2026-08-16): `src/factory_reset.rs` 의 Windows 계약
      #   (%LOCALAPPDATA% 상태 루트·`cysd.prev*.exe` 세대 잔재 판정·`bash "C:/…"` 훅 문자열·
      #   디렉토리 심링크 제거·CREATE_NO_WINDOW)은 지금까지 **macOS 에서만** 검증됐다 —
      #   이 파일 머리말이 말하는 "스텁 초록 ≠ 플랫폼 증명"의 정확한 재현이다. 완전 초기화는
      #   전 데몬을 죽이고 사용자 데이터를 옮기는 최고 위험 등급이라, Windows 회귀를 잡지 못하는
      #   게이트로는 출하할 수 없다. 대상을 `factory_reset::` 로 좁혀 예산을 지킨다.
      #   ⚠이 스텝에 `if:` 조건을 달지 마라 — 위 잡 주석의 근거와 동일(돌지 않는 초록 금지).
      - name: Rust 툴체인 (factory-reset Windows 계약 검증용)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test --lib factory_reset (Windows 실기)
        shell: bash
        run: |
          set -euo pipefail
          # CYS_PACK_DIR 임시 격리 — W0-a 봉인(테스트가 라이브 ~/.cys/pack 접촉 금지) 충족.
          CYS_PACK_DIR="$(mktemp -d)" cargo test --lib factory_reset:: -- --test-threads=1

      # ★D5 env 게이트의 Windows 파이프라인 실기 검증 (v0.14 품질 라인 · 적대검증 2R major 수리).
      #
      #   무엇을 보는가(2026-08-17 강등 반영): `cys::d5_gate_for_os` 는 **mac = 무조건 ·
      #   Windows = 옵트인(`~/.cys/win-no-alt-screen` · `CYS_WIN_NO_ALT_SCREEN=1`)일 때만** 참이다.
      #   그래서 이 핀은 Windows 산출물의 **두 행**을 고정한다 —
      #    ⓐ 기본(미옵트인): `cys launch-agent` 가 만드는 surface.create env 맵에 D5 키가 **없다**
      #       (= Windows 기본 동작이 강등 전 출고본과 동일하다는 주장의 실기 증명).
      #    ⓑ 옵트인: 그 맵에 CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN=1 이 실린다.
      #   강등 근거(앵커 ④ 전 pane 사망 · 실기 스모크 B-5 미수행)는 `src/lib.rs` 의
      #   `d5_gate_for_os` doc 이 정본이다. 옵트인은 **에이전트 부트 체인을 건드리는** 경로이므로,
      #   오너 절대앵커("Windows 설치파일 업데이트에 신중")를 이유로 기본값에서 빠져 있다.
      #
      #   왜 여기(health 레인)인가 — 태그 레인이 아니라:
      #    · `--lib` D5 핀(OS × 옵트인 매핑)은 비용 0 이라 태그 레인(release.yml)에도 넣었다.
      #    · 그러나 **`src/bin/cys.rs` 의 `#[cfg(windows)]` ②-win 파이프라인 핀**(surface.create
      #      env 맵의 실 산출물을 보는 유일한 단언)은 지금까지 **어디서도 컴파일된 적이 없다**.
      #      처음 컴파일하는 15k 줄 테스트 하네스라 D5 와 무관한 이유로 깨질 수 있고, 그 발견은
      #      **태그를 만드는 순간이 아니라 그 전에** 나야 한다.
      #      ∴ 발견용 비용은 이 health 레인이 지고, 태그 레인은 확실한 것만 싣는다.
      #   ⚠이 스텝에 `if:` 를 달지 마라(잡 머리말의 '돌지 않는 초록 금지'와 같은 근거).
      - name: cargo test --bin cys D5 파이프라인 핀 (Windows 실기 · cfg(windows) 블록 최초 컴파일)
        shell: bash
        run: |
          set -euo pipefail
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cys d5_env_injection -- --test-threads=1

      # ── IG-31(★C4 선행 · master 배정 2026-09-05): cysd 검체가 **어느 CI 레인에서도 Windows 에서
      #   돌지 않았다**(W-B 실측). windows-build=cargo test 0건 · 이 파일=factory_reset::/d5 둘만 ·
      #   release.yml 의 --bin cysd 는 aarch64-apple-darwin 조건이라 macOS 전용. 그래서 R5 persist_epoch
      #   의 Windows replace-safety, write_intent tmp+rename 이 **재는 대상은 Windows 인데 근거가
      #   정적 판독 + macOS 실행뿐**이었다. 초록/적색 이전에 **아예 돌지 않는다**(무측정).
      #   ★범위는 축 필터로 시작한다 — 감독자 원자쓰기·예약·해제. 전수 확대 금지이고,
      #     초록 1사이클 뒤 넓히는 A10 승격 관행을 따른다(IG-31 처분).
      #   ★보고를 실패 하류에 두지 않는다(W-C 52차 실증): `-e` 를 빼고 rc 를 잡은 뒤
      #     **파싱보다 먼저** 로그 꼬리를 방출한다 — 파싱이 죽어도 판독 근거가 남는다.
      - name: cargo test --bin cysd 감독자 축 (Windows 실기 · IG-31)
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          LOG="$(mktemp)"
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cysd -- --test-threads=1 --skip hwmon:: > "$LOG" 2>&1
          rc=$?
          cat "$LOG"
          [ "$rc" -eq 0 ] && exit 0
          echo "::error title=cysd-win 실패::rc=$rc — 아래 꼬리 20줄이 원문이다"
          tail -20 "$LOG" | sed 's/^/::error title=cysd-win 로그::/'
          summary="$(grep -E '^test result:' "$LOG" | tail -1 || true)"
          failed="$(printf '%s' "$summary" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' || true)"
          names="$(awk '/^failures:$/{f=1;next} f&&/^    [a-zA-Z_]/{print $1} f&&/^$/{f=0}' "$LOG" | sort -u | tr '\n' ' ')"
          if [ -z "$summary" ]; then
            echo "::error title=cysd-win 측정 실패::rc=$rc 인데 'test result' 요약이 없다 — 컴파일 실패이거나 하네스가 요약 전에 죽었다. '실패한 테스트 없음' 이 아니다"
          elif [ "${failed:-0}" -eq 0 ]; then
            echo "::error title=cysd-win 측정 실패::rc=$rc 인데 failed=0 이다 — 개별 테스트 실패가 아니라 하네스 이상이다(101=러스트 패닉)"
          else
            echo "::error title=cysd-win 테스트 실패::failed=$failed — $names"
          fi
          exit "$rc"

      - name: 결과 업로드 (기계 판독 JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-health-json
          path: win-health.json
          if-no-files-found: warn
