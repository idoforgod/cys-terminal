name: windows-build (feasibility)
# DIAG BRANCH ONLY (diag/0.14.56-c03-win) - cut down for the C-03 win32 diagnostic.
# Kept byte-for-byte from f138f0fa: header, checkout, secret scan, runtime preparation,
# and the C-03 control step. Removed: Bun/Rust setup and every build/install step.
# Added: the two DIAG steps at the end. Never merge this file.

# ★목적: Windows x64 자기완결 설치파일(cys-terminal + cysjavis 팩 + bash/python 런타임) 빌드·검증.
#   feat/windows-x64-dist 브랜치 push 시 자동 실행 → setup.exe 를 Actions 아티팩트로 업로드.
#   release.yml(태그 트리거·공개 repo 발행)과 완전 독립 — 이 잡은 어떤 릴리스도 만들지 않는다.
#   미서명(프로파일 A). createUpdaterArtifacts=false 라 서명키 불요.

on:
  push:
    # ★fix/** 편입(2026-09-04 · master 판정 — ci-branch.yml 의 D4 편입과 같은 논리).
    #   Windows 는 설치·봉인·무중단 재설치의 **유일한 실기 검증처**인데, 트리거가
    #   feat/windows-x64-dist 하나뿐이라 수리 레인(fix/0.14.30-*)의 Windows 변경이
    #   **어느 레인에서도 돌지 않았다** — 태그 레인에 가서야 드러난다는 뜻이고, 그때는
    #   되돌리는 비용이 가장 비싸다. IG-4 가 요구하는 'Windows CI green 증적'도 이 트리거
    #   없이는 workflow_dispatch 수단이 있어야만 얻을 수 있었다(실측: gh 미설치 환경에서 불가).
    #   대가는 fix/** 푸시마다 ~20분 레인이 도는 것이며, master 가 품질 우선으로 수용했다.
    #   태그·발행 트리거는 여전히 없다 — 이 파일은 어떤 릴리스도 만들지 않는다.
    branches: ['feat/windows-x64-dist', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  # ★Tauri CLI 버전 고정 — release.yml env 와 같은 값(단일 SOT 의 미러 · W5-1 · 2026-08-29).
  #   NSIS 템플릿(installer.nsi)은 CLI 버전에 결박되고 훅(nsis-hooks.nsh)은 2.11.4 템플릿 계약
  #   (NSIS-CONTRACT.md §7)에 대해 검증됐다. floating `@2` 는 오늘 2.11.4 로 해소 — 동작 무변경·
  #   무음 템플릿 교체 차단이 목적. ★2.11.4 미만 금지($UpdateMode 회귀). 값 변경은
  #   release.yml·scripts/build-macos-signed.sh 와 동시에.
  TAURI_CLI_VERSION: '2.11.4'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30   # DIAG: CEO E-b cap for the single dispatch
    steps:
      - uses: actions/checkout@v4

      # ★시크릿/개인정보 발행 hard-gate (빌드·임베드 전 최우선 — fail-fast). git-추적 전 트리를
      # fail-closed로 스캔해 개인 홈경로·개인 프로필 디렉토리·개인 계정 핸들·이메일·키토큰
      # 누출을 차단한다. 비0이면 워크플로우 실패. windows 러너라 Git Bash로 실행(shell: bash).
      - name: Secret/PII scan (pre-build hard-gate)
        shell: bash
        run: bash scripts/secret-scan.sh --all

      - name: 동봉 런타임 준비 (PortableGit + Python embeddable)
        shell: bash
        run: |
          set -euo pipefail
          RT="src-tauri/runtime"
          rm -rf "$RT"; mkdir -p "$RT"
          echo "== PortableGit 2.55.0 (bash + coreutils + git) =="
          curl -fL -o pg.7z.exe "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.1/PortableGit-2.55.0-64-bit.7z.exe"
          7z x pg.7z.exe -o"$RT/git" -y >/dev/null
          # 안전한 경량화: 문서·매뉴얼만 제거(런타임 기능 무관).
          rm -rf "$RT/git/mingw64/share/doc" "$RT/git/usr/share/doc" \
                 "$RT/git/mingw64/share/man" "$RT/git/usr/share/man" 2>/dev/null || true
          echo "== Python 3.12.10 embeddable (stdlib + _sqlite3 + ssl) =="
          curl -fL -o py.zip "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          7z x py.zip -o"$RT/python" -y >/dev/null
          cp "$RT/python/python.exe" "$RT/python/python3.exe"
          # embeddable ._pth: 아래 3줄이 sys.path 를 확정한다(표준 경로 계산 우회).
          # ⚠`.` 은 **이 ._pth 파일이 있는 디렉터리(= 번들 python 루트)** 를 뜻한다 — 스크립트 폴더가 아니다.
          #   따라서 팩 bin/ 형제 모듈 import 는 이 줄로 해결되지 않는다(2026-07-29 Windows 실측:
          #   `ModuleNotFoundError: No module named 'javis_scrub'`). 해결 주체는 각 스크립트의 sys.path
          #   가드다(cysjavis-pack/bin/*.py · 회귀 잠금 tests/test_import_guard.py).
          # ★내용 3줄 동결 — `import site` 를 빼면 pip·site-packages 가 죽어 앱 내 CLI 설치가 붕괴한다.
          printf 'python312.zip\n.\nimport site\n' > "$RT/python/python312._pth"
          # DIAG run 3: get-pip / uv / Node.js downloads removed on this branch (unused by the control and DIAG steps - census in _evidence 0.14.56-C03-WIN/run3-census).
          # 라이선스 고지(동봉 재배포 의무).
          mkdir -p "$RT/LICENSES"
          printf 'Bundled runtimes and their licenses:\n- Git for Windows (git): GPLv2 (https://github.com/git-for-windows/git)\n- MSYS2 bash + GNU coreutils: GPLv3\n- CPython (embeddable): PSF License (https://www.python.org)\n- pip (get-pip bootstrap): MIT\n- uv (astral-sh): Apache-2.0 OR MIT (https://github.com/astral-sh/uv)\n- Node.js (+npm/npx): MIT (https://nodejs.org)\nWritten offer for corresponding source: contact the distributor.\n' > "$RT/LICENSES/BUNDLED-RUNTIMES.txt"
          echo "== 확인 =="
          ls -la "$RT/git/usr/bin/bash.exe" "$RT/git/cmd/git.exe" "$RT/python/python3.exe"
          # ★훅 bash 하드 단언 (2026-08-01 · 윈도우 감사 T3-3). Claude Code 는 훅(hook) 실행에
          # PortableGit 의 **런처** bash(`runtime\git\bin\bash.exe`)를 쓴다 — MSYS 실 바이너리인
          # `usr\bin\bash.exe` 와 **다른 파일**이고, 데몬의 셸 탐지도 `runtime/git/bin` 을 본진으로
          # 명시한다(src/bin/cysd/schedule.rs:805-810 windows_bash_candidates). 종전 게이트는
          # usr\bin 만 단언해 이 경로가 무검증이었다 — 빠지면 훅이 통째로 죽는다(무증상 배포).
          if [ ! -f "$RT/git/bin/bash.exe" ]; then
            echo "FATAL: runtime/git/bin/bash.exe 부재 — Claude Code 훅 실행 경로가 사라졌다."
            echo "       (PortableGit 레이아웃 변경 또는 경량화 스텝이 git/bin 을 지웠을 가능성)"
            ls -la "$RT/git" || true
            exit 1
          fi
          ls -la "$RT/git/bin/bash.exe"
          du -sh "$RT" "$RT/git" "$RT/python" || true
          # ── runtime-manifest 산출 (부트 v2 명세 §2-10 G5 · 티켓 C1 · release.yml 과 동일 절차) ──
          # 이 레인이 매니페스트의 **실기 검증처**다: 아래 자기완결 검증 스텝이 실제 설치본 트리와
          # 이 파일을 대조해, "소스 트리 해시가 NSIS 를 거쳐 설치본까지 살아남는가"를 측정한다.
          # ★PYTHONUTF8=1 — 러너 기본 stdout 인코딩(cp1252/cp949)에 `✓` 가 없어 성공 메시지가
          #   UnicodeEncodeError 로 죽고, 그 exit 1 이 이 도구 계약의 '불일치'와 겹쳤다
          #   (2026-09-04 windows-build 실사고 · 도구 자신도 _widen_stdio 로 닫았다 — 이건 2층).
          PYTHONUTF8=1 PYTHONDONTWRITEBYTECODE=1 python3 cysjavis-pack/bin/javis_runtime_seal.py emit \
            --root "$RT" --out src-tauri/resources/runtime-manifest.json \
            --app-version "$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][0-9.]*)".*/\1/')" \
            --source win-src

      - name: C-03 owned process native Windows (bundled Python)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Native Job/spawn/no-console tests; local macOS skips are not evidence.
          # -B protects the staged runtime and pack from bytecode writes.
          C03_TEST_BASH="$(cygpath -w "$PWD/src-tauri/runtime/git/bin/bash.exe")" src-tauri/runtime/python/python.exe -B -u cysjavis-pack/bin/tests/test_owned_process.py

      - name: C-03 win32 DIAG RUN 2 (launch matrix + watcher control, reports only)
        if: always()
        timeout-minutes: 12
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2; do
            echo "== C03 DIAG RUN 2 iteration $i (bundled Python) =="
            C03_DIAG_WINDOW=35 src-tauri/runtime/python/python.exe -B -u diag/c03-win/diag_c03_win_run2.py "bundled-$i" || echo "C03DIAG-RC bundled-$i rc=$?"
          done

      - name: C-03 win32 DIAG RUN 2 under the runner system Python
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        run: |
          set -uo pipefail
          command -v python && python -V
          C03_DIAG_WINDOW=35 python -B -u diag/c03-win/diag_c03_win_run2.py "system-1" || echo "C03DIAG-RC system-1 rc=$?"
