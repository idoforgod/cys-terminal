name: windows-build (feasibility)

# ★목적: Windows x64 자기완결 설치파일(cys-terminal + cysjavis 팩 + bash/python 런타임) 빌드·검증.
#   feat/windows-x64-dist 브랜치 push 시 자동 실행 → setup.exe 를 Actions 아티팩트로 업로드.
#   release.yml(태그 트리거·공개 repo 발행)과 완전 독립 — 이 잡은 어떤 릴리스도 만들지 않는다.
#   미서명(프로파일 A). createUpdaterArtifacts=false 라 서명키 불요.

on:
  push:
    # ★fix/** 편입(2026-09-04 · master 판정 — ci-branch.yml 의 D4 편입과 같은 논리).
    #   Windows 는 설치·봉인·무중단 재설치의 **유일한 실기 검증처**인데, 트리거가
    #   feat/windows-x64-dist 하나뿐이라 수리 레인(fix/0.14.30-*)의 Windows 변경이
    #   **어느 레인에서도 돌지 않았다** — 태그 레인에 가서야 드러난다는 뜻이고, 그때는
    #   되돌리는 비용이 가장 비싸다. IG-4 가 요구하는 'Windows CI green 증적'도 이 트리거
    #   없이는 workflow_dispatch 수단이 있어야만 얻을 수 있었다(실측: gh 미설치 환경에서 불가).
    #   대가는 fix/** 푸시마다 ~20분 레인이 도는 것이며, master 가 품질 우선으로 수용했다.
    #   태그·발행 트리거는 여전히 없다 — 이 파일은 어떤 릴리스도 만들지 않는다.
    branches: ['feat/windows-x64-dist', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  # ★Tauri CLI 버전 고정 — release.yml env 와 같은 값(단일 SOT 의 미러 · W5-1 · 2026-08-29).
  #   NSIS 템플릿(installer.nsi)은 CLI 버전에 결박되고 훅(nsis-hooks.nsh)은 2.11.4 템플릿 계약
  #   (NSIS-CONTRACT.md §7)에 대해 검증됐다. floating `@2` 는 오늘 2.11.4 로 해소 — 동작 무변경·
  #   무음 템플릿 교체 차단이 목적. ★2.11.4 미만 금지($UpdateMode 회귀). 값 변경은
  #   release.yml·scripts/build-macos-signed.sh 와 동시에.
  TAURI_CLI_VERSION: '2.11.4'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ★시크릿/개인정보 발행 hard-gate (빌드·임베드 전 최우선 — fail-fast). git-추적 전 트리를
      # fail-closed로 스캔해 개인 홈경로·개인 프로필 디렉토리·개인 계정 핸들·이메일·키토큰
      # 누출을 차단한다. 비0이면 워크플로우 실패. windows 러너라 Git Bash로 실행(shell: bash).
      - name: Secret/PII scan (pre-build hard-gate)
        shell: bash
        run: bash scripts/secret-scan.sh --all

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust (x86_64-pc-windows-msvc = 러너 네이티브)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: windows-x64-feasibility

      - name: 동봉 런타임 준비 (PortableGit + Python embeddable)
        shell: bash
        run: |
          set -euo pipefail
          RT="src-tauri/runtime"
          rm -rf "$RT"; mkdir -p "$RT"
          echo "== PortableGit 2.55.0 (bash + coreutils + git) =="
          curl -fL -o pg.7z.exe "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.1/PortableGit-2.55.0-64-bit.7z.exe"
          7z x pg.7z.exe -o"$RT/git" -y >/dev/null
          # 안전한 경량화: 문서·매뉴얼만 제거(런타임 기능 무관).
          rm -rf "$RT/git/mingw64/share/doc" "$RT/git/usr/share/doc" \
                 "$RT/git/mingw64/share/man" "$RT/git/usr/share/man" 2>/dev/null || true
          echo "== Python 3.12.10 embeddable (stdlib + _sqlite3 + ssl) =="
          curl -fL -o py.zip "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          7z x py.zip -o"$RT/python" -y >/dev/null
          cp "$RT/python/python.exe" "$RT/python/python3.exe"
          # embeddable ._pth: 아래 3줄이 sys.path 를 확정한다(표준 경로 계산 우회).
          # ⚠`.` 은 **이 ._pth 파일이 있는 디렉터리(= 번들 python 루트)** 를 뜻한다 — 스크립트 폴더가 아니다.
          #   따라서 팩 bin/ 형제 모듈 import 는 이 줄로 해결되지 않는다(2026-07-29 Windows 실측:
          #   `ModuleNotFoundError: No module named 'javis_scrub'`). 해결 주체는 각 스크립트의 sys.path
          #   가드다(cysjavis-pack/bin/*.py · 회귀 잠금 tests/test_import_guard.py).
          # ★내용 3줄 동결 — `import site` 를 빼면 pip·site-packages 가 죽어 앱 내 CLI 설치가 붕괴한다.
          printf 'python312.zip\n.\nimport site\n' > "$RT/python/python312._pth"
          # ── pip 부트스트랩 (embeddable은 pip 미포함 → 'No module named pip' 방지) ──
          echo "== get-pip (embeddable python pip 부트스트랩) =="
          curl -fL -o "$RT/python/get-pip.py" "https://bootstrap.pypa.io/get-pip.py"
          "$RT/python/python.exe" "$RT/python/get-pip.py" --no-warn-script-location
          rm -f "$RT/python/get-pip.py"
          # ── uv/uvx 동봉 (serena·nlm-mcp-cli가 uvx 전제 → C20/C43 FAIL 방지). runtime/python은 cysd가 PATH 주입. ──
          echo "== uv 0.11.26 (x86_64-pc-windows-msvc) 동봉 =="
          curl -fL -o uv.zip "https://github.com/astral-sh/uv/releases/download/0.11.26/uv-x86_64-pc-windows-msvc.zip"
          7z x uv.zip -o"$RT/python" -y >/dev/null
          ls -la "$RT/python/uv.exe" "$RT/python/uvx.exe"
          # ── node + npm/npx 동봉 (mac 0.7.0 파리티 — 순정 Windows엔 node 부재. runtime/node는 cysd가 PATH 주입) ──
          echo "== Node.js 22.17.1 (npm/npx — win-x64, mac과 동일 핀) =="
          curl -fL -o node.zip "https://nodejs.org/dist/v22.17.1/node-v22.17.1-win-x64.zip"
          7z x node.zip -o"$RT" -y >/dev/null
          mv "$RT/node-v22.17.1-win-x64" "$RT/node"
          ls -la "$RT/node/node.exe" "$RT/node/npm.cmd"
          # 라이선스 고지(동봉 재배포 의무).
          mkdir -p "$RT/LICENSES"
          printf 'Bundled runtimes and their licenses:\n- Git for Windows (git): GPLv2 (https://github.com/git-for-windows/git)\n- MSYS2 bash + GNU coreutils: GPLv3\n- CPython (embeddable): PSF License (https://www.python.org)\n- pip (get-pip bootstrap): MIT\n- uv (astral-sh): Apache-2.0 OR MIT (https://github.com/astral-sh/uv)\n- Node.js (+npm/npx): MIT (https://nodejs.org)\nWritten offer for corresponding source: contact the distributor.\n' > "$RT/LICENSES/BUNDLED-RUNTIMES.txt"
          echo "== 확인 =="
          ls -la "$RT/git/usr/bin/bash.exe" "$RT/git/cmd/git.exe" "$RT/python/python3.exe"
          # ★훅 bash 하드 단언 (2026-08-01 · 윈도우 감사 T3-3). Claude Code 는 훅(hook) 실행에
          # PortableGit 의 **런처** bash(`runtime\git\bin\bash.exe`)를 쓴다 — MSYS 실 바이너리인
          # `usr\bin\bash.exe` 와 **다른 파일**이고, 데몬의 셸 탐지도 `runtime/git/bin` 을 본진으로
          # 명시한다(src/bin/cysd/schedule.rs:805-810 windows_bash_candidates). 종전 게이트는
          # usr\bin 만 단언해 이 경로가 무검증이었다 — 빠지면 훅이 통째로 죽는다(무증상 배포).
          if [ ! -f "$RT/git/bin/bash.exe" ]; then
            echo "FATAL: runtime/git/bin/bash.exe 부재 — Claude Code 훅 실행 경로가 사라졌다."
            echo "       (PortableGit 레이아웃 변경 또는 경량화 스텝이 git/bin 을 지웠을 가능성)"
            ls -la "$RT/git" || true
            exit 1
          fi
          ls -la "$RT/git/bin/bash.exe"
          du -sh "$RT" "$RT/git" "$RT/python" || true

      - name: Build Windows x64 (Tauri → NSIS setup.exe)
        shell: bash
        env:
          PYTHONUTF8: '1'   # Windows Python 기본 cp1252 stdout에서 한국어 print 크래시 방지
        run: |
          set -euo pipefail
          # createUpdaterArtifacts=false 인라인 override — 이 잡은 서명키 없는 가능성 빌드라
          # updater 서명 산출을 끈다(릴리스 경로 release.yml은 windows conf 기본값 true+서명키 사용).
          # ★W5-1: CLI 는 워크플로 env TAURI_CLI_VERSION 으로 고정(파일 머리 env 주석).
          # ★W5-2: --verbose + tee 로 makensis 출력 가시화 + 훅 컴파일 가드 문자열(NSIS-CONTRACT.md §5
          #   3종 · !error) 재검. !error 는 빌드를 이미 hard-fail 시킨다(pipefail 보존) — grep 은 종료코드
          #   삼킴·경고 강등 회귀를 로그 층에서 잡는 2차 벨트. 토큰은 계약 문서 문자열 그대로(창작 금지).
          bunx "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --config '{"bundle":{"createUpdaterArtifacts":false}}' --verbose 2>&1 | tee nsis-build.log
          if grep -E 'refusing to build a blind oracle|sidecar source not found at compile time|version resource regression' nsis-build.log; then
            echo "::error::NSIS 훅 빌드 가드 발화(위 매치 라인) — 오라클 전제가 깨진 설치기는 검증 무의미(NSIS-CONTRACT.md §5)" >&2
            exit 1
          fi
          echo "OK: NSIS 빌드 로그 가드 통과 (훅 컴파일 가드 문자열 0건)"

      - name: Upload NSIS installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cys-windows-x64-nsis
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # ★Windows VERSIONINFO 상시 게이트 (W5-3 · 2026-08-29 — release.yml 동형 · 실패 = 잡 실패).
      #   훅 신선도 오라클(nsis-hooks.nsh: GetDLLVersion == 컴파일 상수)의 전제 = 세 산출물 모두
      #   수치 VERSIONINFO(VS_FIXEDFILEINFO) 보유 + 릴리스 버전 일치. 리소스 없는 PE(크로스 빌드
      #   회귀·winresource 회귀)는 POSIX makensis !getdllversion 이 빈 값을 무음 정의할 수 있고,
      #   현장에선 전 설치가 exit 4 로 거부된다 — 훅의 !error 가드와 독립인 2차 오라클로 영구 단언.
      #   이 잡은 --target 없이 빌드하므로 메인 exe 는 target/release/ 에 있다(release.yml 과 경로만 다름).
      - name: Windows VERSIONINFO 게이트 (cys·cysd·cys-app 수치 버전 == 릴리스 버전)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $v) { throw 'tauri.conf.json version 파싱 실패' }
          $expected = "$v.0"
          $files = @(
            'src-tauri/binaries/cys-x86_64-pc-windows-msvc.exe',
            'src-tauri/binaries/cysd-x86_64-pc-windows-msvc.exe',
            'target/release/cys-app.exe'
          )
          $bad = @()
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { $bad += "${f}: 파일 부재(빌드 산출 경로 회귀)"; continue }
            $vi = (Get-Item $f).VersionInfo
            $num = '{0}.{1}.{2}.{3}' -f $vi.FileMajorPart, $vi.FileMinorPart, $vi.FileBuildPart, $vi.FilePrivatePart
            if ($num -eq '0.0.0.0') { $bad += "${f}: 수치 VERSIONINFO 부재/0.0.0.0 — 리소스 없는 PE(크로스 빌드·winresource 회귀) = 현장 전 설치 거부(exit 4) 계급"; continue }
            if ($num -ne $expected) { $bad += "${f}: 수치 VERSIONINFO $num != 기대 $expected (버전 SOT 불일치 또는 스테일 산출물)"; continue }
            Write-Host "OK  $f  VS_FIXEDFILEINFO=$num"
          }
          if ($bad.Count) {
            $bad | ForEach-Object { Write-Host "::error::VERSIONINFO 게이트: $_" }
            throw "VERSIONINFO 게이트 실패 ($($bad.Count)건)"
          }
          Write-Host "VERSIONINFO 게이트 통과: 3종 전부 수치 버전 == $expected"

      - name: 자기완결 검증 (silent install → 동봉 bash·python3 실행)
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "setup.exe 없음" }
          Write-Host ("installer: {0}  size={1}MB" -f $exe.FullName, [math]::Round($exe.Length/1MB,1))
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 6
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $inst = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter cysd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inst) { throw "설치 후 cysd.exe 를 LOCALAPPDATA 아래에서 못 찾음" }
          $dir = $inst.Directory.FullName
          $rt = Join-Path $dir 'runtime'
          Write-Host "install dir: $dir"
          Write-Host "== runtime top-level =="; if (Test-Path $rt) { Get-ChildItem $rt | Select-Object -ExpandProperty Name } else { throw "runtime 폴더 없음: $rt" }
          # cysd PATH 주입이 기대하는 정확 경로(구조 보존 시): runtime\git\usr\bin\bash.exe · runtime\python\python3.exe
          $bash = Get-ChildItem -Path $rt -Recurse -Filter bash.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'git\\usr\\bin\\bash\.exe$' } | Select-Object -First 1
          if (-not $bash) { $bash = Get-ChildItem -Path $rt -Recurse -Filter bash.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $py = Get-ChildItem -Path $rt -Recurse -Filter python3.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "bash: $($bash.FullName)"
          Write-Host "python3: $($py.FullName)"
          if (-not $bash) { throw "동봉 bash.exe 를 runtime 아래에서 못 찾음" }
          if (-not $py)   { throw "동봉 python3.exe 를 runtime 아래에서 못 찾음" }
          # cysd 하드코딩 경로와 실제 구조 일치 확인(불일치 시 명시 실패 → cysd PATH 주입도 교정 필요).
          if ($bash.FullName -notmatch 'runtime\\git\\usr\\bin\\bash\.exe$') { throw "bash 경로가 cysd 기대(runtime\git\usr\bin)와 불일치: $($bash.FullName)" }
          if ($py.FullName   -notmatch 'runtime\\python\\python3\.exe$')     { throw "python3 경로가 cysd 기대(runtime\python)와 불일치: $($py.FullName)" }
          & $bash.FullName --version
          # ★훅 bash 하드 단언 — 설치된 트리에서도 검증한다(빌드 트리 단언의 짝).
          # Claude Code 는 훅을 `<git>\bin\bash.exe -c "<명령>"` 형태로 띄운다. 존재만이 아니라
          # **그 형태로 실제 실행되는지**까지 확인해야 "있는데 못 도는" 상태를 잡는다.
          $hookBash = Join-Path $dir 'runtime\git\bin\bash.exe'
          if (-not (Test-Path $hookBash)) {
            Get-ChildItem (Join-Path $dir 'runtime\git') -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            throw "훅 bash 부재: $hookBash (Claude Code 훅 실행 경로 — 빠지면 훅이 통째로 죽는다)"
          }
          $hookOut = (& $hookBash -c "echo hook-bash-ok") -join ''
          if ($LASTEXITCODE -ne 0 -or $hookOut -notmatch 'hook-bash-ok') {
            throw "훅 bash 실행 실패: $hookBash (exit=$LASTEXITCODE out='$hookOut')"
          }
          Write-Host "hook bash: $hookBash  ->  $hookOut"
          & $py.FullName --version
          & $py.FullName -c "import sqlite3, ssl, json, hashlib, urllib.request, ast; print('embeddable stdlib OK (sqlite3+ssl+json+hashlib+urllib+ast)')"
          if ($LASTEXITCODE -ne 0) { throw "동봉 python3 stdlib import 실패" }
          Write-Host "OK: 자기완결 런타임 설치·실행·경로일치 검증 통과"

      - name: PTY 스모크 (검은 pane 회귀 게이트 — ConPTY 셸 출력·실행 + pane env 실주입 실측)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter cysd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inst) { throw "설치된 cysd.exe 미발견" }
          $dir = $inst.Directory.FullName
          $cys = Join-Path $dir 'cys.exe'
          # list가 형제 cysd를 자동 기동(4초 대기 내장) — ping은 순수 프로브라 autostart가
          # 의도적으로 꺼져 있어(cys.rs) 부트스트랩에 못 쓴다. 첫 시도 실패 시 1회 재시도.
          & $cys list; if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 3; & $cys list }
          if ($LASTEXITCODE -ne 0) { throw "cysd 기동 실패 (named pipe 미응답)" }
          $ref = (& $cys new-surface --title pty-smoke | Select-Object -Last 1).Trim()
          if (-not $ref) { throw "new-surface 실패" }
          Write-Host "surface: $ref"
          # ① 셸 프롬프트 도달 실측 — 검은 pane 회귀 시 여기서 실패한다.
          #    (ConPTY 자식이 pseudoconsole에 못 붙으면 출력이 PTY에 영영 도달하지 않는다.)
          $deadline = (Get-Date).AddSeconds(60); $screen = ''
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $screen = (& $cys read-screen --surface $ref) -join "`n"
            if ($screen -match 'PS ') { break }
          }
          Write-Host "== screen(prompt) =="; Write-Host $screen
          if ($screen -notmatch '\S') { throw "PTY 출력 0바이트 — 검은 pane 회귀 (셸 출력이 pseudoconsole에 도달하지 않음)" }
          if ($screen -notmatch 'PS ') { throw "PowerShell 프롬프트 미검출 — 셸이 pseudoconsole에 붙지 않았거나 즉시 종료" }
          # ② 입력→실행→출력 왕복 실측 — 문자열 연결 결과는 셸이 실제 평가해야만 화면에 나타난다
          #    (타이핑 에코만으로는 'cys-exec-proof' 원문이 등장하지 않게 조합).
          & $cys send --surface $ref "echo ('cys-exec-' + 'proof')"
          & $cys send-key --surface $ref Return
          $deadline = (Get-Date).AddSeconds(40); $ok = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $screen = (& $cys read-screen --surface $ref) -join "`n"
            if ($screen -match 'cys-exec-proof') { $ok = $true; break }
          }
          if (-not $ok) { Write-Host "== screen(roundtrip) =="; Write-Host $screen; throw "실행 왕복 실패 — PTY 입력 또는 셸 실행 경로 결함" }
          Write-Host "OK: ConPTY 프롬프트·실행 왕복 실측 통과"
          # ③ pane env 실주입 관측 (P4-3 사슬 분절② — E2E 대리검체: 설치 트리 → cysd 스폰 → pane env).
          #    U-20 사슬의 CI 가능 상한은 두 분절이다 — 분절①(빌드·설치트리에 훅 bash 실재)은 위
          #    "자기완결 검증" 스텝의 하드 단언이 이미 잰다. 이 블록이 분절②: cysd 가 pane 에
          #    CLAUDE_CODE_GIT_BASH_PATH(U-20 · spawn_env_pairs)와 CYS_SEAT_TOKEN(P1 · 좌석 토큰)을
          #    **실제로 싣는가**. 마지막 분절③(벤더 claude 가 그 env 로 훅을 실발화하는가)은 claude
          #    CLI 인증이 필요해 어떤 CI 로도 게이트化 불가 — docs/RELEASE.md 의 Windows 실기 수동
          #    체크리스트가 그 몫이다(과장 금지 — 이 스텝의 초록은 분절②까지만 증명한다).
          #    ★돌지 않는 초록 금지: 아래 단언은 주입 회귀 시 실제로 던진다 — spawn_env_pairs 가
          #    U-20 쌍을 빼먹으면 u20-env-absent, BUNDLED_GIT_BASH_REL 좌표와 설치 트리가 어긋나면
          #    u20-env-dangling, mint/주입 회귀면 seat-env-absent 로 각각 폐로한다.
          #    ★마커는 분할 리터럴("u20-env-"+"ok")로 조립 — 타이핑 에코만으로는 원문이 화면에
          #    등장하지 않는다(② 'cys-exec-proof' 와 동일 트릭). 프로브는 외부 pwsh 가 아니라
          #    **pane 속 셸**이 평가한다(외부 단일따옴표 → $env: 리터럴 전달).
          #    ★CYS_SEAT_TOKEN 값은 화면·로그 어디에도 찍지 않는다(존재 여부만) — 토큰의 관측
          #    채널 등재 금지 계약(state.rs Surface.seat_token) 준수.
          & $cys send --surface $ref 'if ($env:CLAUDE_CODE_GIT_BASH_PATH) { if (Test-Path $env:CLAUDE_CODE_GIT_BASH_PATH) { ("u20-env-" + "ok") } else { ("u20-env-" + "dangling ") + $env:CLAUDE_CODE_GIT_BASH_PATH } } else { ("u20-env-" + "absent") }'
          & $cys send-key --surface $ref Return
          & $cys send --surface $ref 'if ($env:CYS_SEAT_TOKEN) { ("seat-env-" + "present") } else { ("seat-env-" + "absent") }'
          & $cys send-key --surface $ref Return
          $deadline = (Get-Date).AddSeconds(40); $u20 = $false; $seat = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $screen = (& $cys read-screen --surface $ref) -join "`n"
            if ($screen -match 'u20-env-ok') { $u20 = $true }
            if ($screen -match 'seat-env-present') { $seat = $true }
            if ($u20 -and $seat) { break }
          }
          if (-not ($u20 -and $seat)) {
            Write-Host "== screen(env-probe) =="; Write-Host $screen
            if ($screen -match 'u20-env-absent')   { throw "U-20 미주입: pane env 에 CLAUDE_CODE_GIT_BASH_PATH 부재 — spawn_env_pairs 주입 회귀(시스템 Git 없는 기계에서 훅 전멸 계급)" }
            if ($screen -match 'u20-env-dangling') { throw "U-20 좌표 불일치: CLAUDE_CODE_GIT_BASH_PATH 가 실재하지 않는 경로를 가리킴 — BUNDLED_GIT_BASH_REL 과 설치 트리의 어긋남(없는 경로 통보는 미통보보다 나쁘다)" }
            if ($screen -match 'seat-env-absent')  { throw "좌석 토큰 미배달: pane env 에 CYS_SEAT_TOKEN 부재 — mint_seat_token/주입 회귀(P1 체인 단절 시 claim 폴백 사망 계급)" }
            throw "pane env 관측 실패: 프로브 마커 미도달 (u20=$u20 seat=$seat) — PTY 입력·실행 경로 또는 주입 회귀"
          }
          Write-Host "OK: pane env 실주입 관측 통과 (CLAUDE_CODE_GIT_BASH_PATH=실재 경로 · CYS_SEAT_TOKEN=존재)"
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      # ─────────────────────────────────────────────────────────────────────────
      # T3 기능 스모크 (WINFIX_T3_SMOKE_PLAN.md · row별 PASS/FAIL). release 무관.
      # 행별 결과를 "T3-N RESULT: PASS|FAIL" 로 stdout에 남긴다(매트릭스 승격 판독원). 크리티컬 행만 throw.
      # ★W8 확장(2026-08-16 · 스펙 v4 §A13 ⓐ~ⓕ — 기대값은 Wave1 현행 계약): ng1~ng3(부서 이름검증
      #   거부·usage·부작용0) · tpl(설치 팩 CEO 템플릿 == 리포 커밋본 바이트) · c03(신선 팩 preflight
      #   C03 4종+pin.ceo 전부 PASS) · alt(status --json 의 alt_screen 관측 키). 전부 크리티컬 행 —
      #   릴리스 시퀀싱 1단계 'win T3 green 증적→태그'의 판독원이다(release-lane-check.sh 가 상기).
      # ─────────────────────────────────────────────────────────────────────────
      - name: T3 기능 스모크 (온보딩·hook·env주입·부서·python3·이름검증·CEO템플릿·C03·alt_screen)
        shell: pwsh
        timeout-minutes: 20   # ★백스톱: 어떤 하위 호출이 hang해도 20분에 스텝 종료(6h 방지 · W8 preflight 전수 실행 예산 포함)
        run: |
          $inst = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter cysd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inst) { throw "설치된 cysd.exe 미발견" }
          $dir = $inst.Directory.FullName
          $cys = Join-Path $dir 'cys.exe'
          $results = @{}
          $userHome = $env:USERPROFILE
          function Rec($id,$ok,$note){ $results["$id"] = [bool]$ok; Write-Host ("T3-{0} RESULT: {1}  {2}" -f $id, ($(if($ok){'PASS'}else{'FAIL'})), $note) }
          # ★바운드 실행: 외부 exe가 hang해도 스텝이 멈추지 않게 timeout kill. @{Code;Out} 반환(Code=-1=timeout).
          function Bx($exe,$argv,$ms){
            $o=[System.IO.Path]::GetTempFileName(); $e=[System.IO.Path]::GetTempFileName()
            try {
              $p=Start-Process -FilePath $exe -ArgumentList $argv -NoNewWindow -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
              if(-not $p.WaitForExit($ms)){ try{$p.Kill($true)}catch{}; Write-Host ("  [timeout {0}ms] {1} {2}" -f $ms,$exe,($argv -join ' ')); return @{Code=-1;Out=''} }
              $out=Get-Content $o -Raw -ErrorAction SilentlyContinue
              $er=Get-Content $e -Raw -ErrorAction SilentlyContinue
              return @{Code=$p.ExitCode;Out="$out$er"}
            } finally { Remove-Item $o,$e -Force -ErrorAction SilentlyContinue }
          }

          # ── T3-1/T3-2: 온보딩(init-pack) + hook 등록·내용(RC-1·RC-2) ──
          try {
            (Bx $cys @('init-pack') 60000).Out | Out-Host
            $packOk = Test-Path (Join-Path $userHome '.cys\pack\agents.json')
            $settings = @(Get-ChildItem (Join-Path $userHome '.cys\claude\settings.json'),(Join-Path $userHome '.claude\settings.json') -ErrorAction SilentlyContinue)
            $hookCmd = ''
            foreach ($s in $settings) { try { $j=Get-Content $s.FullName -Raw|ConvertFrom-Json; $c=$j.hooks.SessionStart.hooks.command; if($c){$hookCmd="$c"} } catch {} }
            Rec 1 ($packOk) "pack=$packOk"
            Rec 2 ($hookCmd -match '^bash "') "hookCmd=$hookCmd"
          } catch { Rec 1 $false "$_"; Rec 2 $false "$_" }

          # ── T3-1b(autostart) daemon install → schtasks 등록 + ★진짜 KeepAlive(RestartOnFailure·ExecutionTimeLimit PT0S) ──
          try {
            (Bx $cys @('daemon','install') 30000).Out | Out-Host
            $q = (schtasks /Query /TN cysd 2>&1); $reg = ($LASTEXITCODE -eq 0)
            $xml = (schtasks /Query /TN cysd /XML 2>&1) -join "`n"
            $hasRof = ($xml -match 'RestartOnFailure'); $hasPt0 = ($xml -match 'PT0S')
            Rec '1b' ($reg -and $hasRof -and $hasPt0) "cysd reg=$reg RestartOnFailure=$hasRof ExecTimeLimit_PT0S=$hasPt0"
          } catch { Rec '1b' $false "$_" }

          # ── 데몬 기동(named pipe 바인드·RC-4 기본) — 바운드 ──
          $r = Bx $cys @('list') 30000; if ($r.Code -ne 0) { Start-Sleep 3; $r = Bx $cys @('list') 30000 }
          Rec 'pipe' ($r.Code -eq 0) "named pipe bind (code=$($r.Code))"

          # ── T3-13: python3 해소(RC-12) — 동봉 runtime python3.exe 실재+실행 ──
          try { $py = Join-Path $dir 'runtime\python\python3.exe'; $rp = Bx $py @('-c','print(1)') 15000; Rec 13 ($rp.Code -eq 0 -and (Test-Path $py)) "python3=$py code=$($rp.Code)" } catch { Rec 13 $false "$_" }

          # ── T3-3(env주입 메커니즘·스텁): claude 실로그인 불가 → 스텁 에이전트로 env 주입만 검증(전부 바운드) ──
          try {
            $py = Join-Path $dir 'runtime\python\python3.exe'
            $aj = Join-Path $userHome '.cys\pack\agents.json'
            $pyprog = 'import json,sys; aj=sys.argv[1]; d=json.load(open(aj,encoding="utf-8")); d["stubenv"]={"cmd":"Write-Host CCDPROOF=$env:CLAUDE_CONFIG_DIR","env":{"CLAUDE_CONFIG_DIR":"${CYS_ACCOUNT_DIR:-ENVINJECT_OK}"},"inject_delay_secs":3,"ready_marker":"CCDPROOF=","clear_cmd":"/clear"}; json.dump(d,open(aj,"w",encoding="utf-8"),ensure_ascii=False,indent=2); print("stubenv OK")'
            # 복잡인자(공백·$·따옴표)는 Bx(Start-Process 재-quoting)가 깨뜨림 → 직접 & 호출(빠른 파일쓰기·hang 무).
            & $py -c $pyprog $aj | Out-Host
            (Bx $cys @('launch-agent','--role','worker','--agent','stubenv') 90000).Out | Out-Host
            & $cys send --to worker 'Write-Host CCDFRESH=$env:CLAUDE_CONFIG_DIR' 2>&1 | Out-Null
            & $cys send-key --to worker Return 2>&1 | Out-Null
            $envProof=$false; $scr=''
            $deadline=(Get-Date).AddSeconds(40)
            while((Get-Date) -lt $deadline){ Start-Sleep 3; $scr=(Bx $cys @('read-screen','--to','worker') 15000).Out; if($scr -match 'CCDFRESH=ENVINJECT_OK'){$envProof=$true;break} }
            if (-not $envProof) { Write-Host "== stub screen =="; Write-Host $scr }
            Rec 3 $envProof "env주입 스텁 CCDFRESH=ENVINJECT_OK (해소+주입 E2E · claude 실발동은 오너 실기 마커)"
          } catch { Rec 3 $false "$_" }

          # ── T3-7/T3-10: 부서 스폰·로그(RC-5/6/15·단일부서·전부 바운드) ──
          try {
            $bash = Join-Path $dir 'runtime\git\usr\bin\bash.exe'
            $deptTool = Join-Path $userHome '.cys\pack\bin\cys-dept'
            $env:PATH = "$dir;$(Join-Path $dir 'runtime\git\usr\bin');$(Join-Path $dir 'runtime\python');$env:PATH"
            $env:CYS_DEPT_DEFAULT_ACCOUNT = 'citest'   # 부서 계정격리 base 해석용(미설정 시 allocate fail-closed exit5)
            $r = Bx $bash @($deptTool,'allocate') 60000; Write-Host "cys-dept allocate: $($r.Out)"
            $name = (($r.Out -split "`n") | Where-Object { $_ -match '^dept-\d+' } | Select-Object -Last 1)
            if ($name) { $name = $name.Trim() }
            $deptOk = ($r.Code -eq 0 -and $name -match '^dept-\d+$')
            $logdir = Join-Path $env:LOCALAPPDATA "cys\cys-dept-$name"
            Start-Sleep 3
            $logOk = ($deptOk -and (Test-Path (Join-Path $logdir 'cysd.log')))
            Rec 7 $deptOk "cys-dept allocate → $name (code=$($r.Code))"
            Rec 10 $logOk "dept_logdir cysd.log @ $logdir"
            if ($deptOk) { (Bx $bash @($deptTool,'down',$name) 30000) | Out-Null }
          } catch { Rec 7 $false "$_"; Rec 10 $false "$_" }

          # ═══ W8 확장 행 (스펙 v4 §A13 · Wave1 현행 계약 = 정본 기대값) ═══
          # 도구 경로·PATH·PYTHONUTF8 을 T3-7 블록과 독립으로 재확립한다(그 try 가 실패해도 여기는 돈다).
          $bash2 = Join-Path $dir 'runtime\git\usr\bin\bash.exe'
          $py2 = Join-Path $dir 'runtime\python\python3.exe'
          $deptTool2 = Join-Path $userHome '.cys\pack\bin\cys-dept'
          $env:PATH = "$dir;$(Join-Path $dir 'runtime\git\usr\bin');$(Join-Path $dir 'runtime\python');$env:PATH"
          $env:PYTHONUTF8 = '1'   # 임베디드 python cp1252 기본 인코딩에서 한글 디렉티브 UTF-8 강제(RC-16 관례)
          $reg = Join-Path $userHome '.cys\depts.json'

          # ── ng1(ⓐ): `launch --help` = **name 위치** → exit 2 가 정본(★구 시뮬레이션 문서의
          #    'usage exit 0' 기대값은 폐기됨 — '--help' 부서 등재→껍데기 CEO 승격 실사고의 재발 차단).
          #    단언 4종: exit 2 · stderr 진단(usage 1줄 병기 — ASCII 부분으로 매칭·인코딩 비의존) ·
          #    %LOCALAPPDATA% state(log) dir 부재 · depts.json 무등재(부작용 0).
          try {
            $r = Bx $bash2 @($deptTool2,'launch','--help') 30000
            $diagOk = ($r.Out -match 'usage: cys-dept launch')
            $dirAbsent = -not (Test-Path (Join-Path $env:LOCALAPPDATA 'cys\cys-dept---help'))
            $regClean = (-not (Test-Path $reg)) -or ((Get-Content $reg -Raw) -notmatch [regex]::Escape('"--help"'))
            Rec 'ng1' ($r.Code -eq 2 -and $diagOk -and $dirAbsent -and $regClean) "launch --help exit=$($r.Code)(기대2) diag=$diagOk stateAbsent=$dirAbsent regClean=$regClean"
          } catch { Rec 'ng1' $false "$_" }

          # ── ng2(ⓑ): **cmd 위치** --help = usage(stdout)·exit 0 — 가드(exit 7)·검증보다 앞·역할 무관 ──
          try {
            $r = Bx $bash2 @($deptTool2,'--help') 30000
            Rec 'ng2' ($r.Code -eq 0 -and $r.Out -match 'usage: cys-dept') "--help exit=$($r.Code)(기대0) usage=$($r.Out -match 'usage: cys-dept')"
          } catch { Rec 'ng2' $false "$_" }

          # ── ng3(ⓒ): 비정형 이름('.' 포함 — win pipe_slug 점 소거 충돌 봉합의 표적) → 전부 exit 2·부작용 0.
          #    rotate 는 미등재=exit 8 이 선행하므로 비정형명을 레지스트리에 직접 시드해 '등재됐어도
          #    kill 이전 exit 2'(반파괴 half-op 봉합)를 잰다 — 시드는 검사 직후 원복. create 는 exit 2
          #    (≠3)로 'key 화이트리스트가 카탈로그 존재 검사보다 선행'까지 함께 단언한다.
          try {
            $r1 = Bx $bash2 @($deptTool2,'launch','bad.name') 30000
            $ok1 = ($r1.Code -eq 2 -and -not (Test-Path (Join-Path $env:LOCALAPPDATA 'cys\cys-dept-bad.name')) -and ((-not (Test-Path $reg)) -or ((Get-Content $reg -Raw) -notmatch [regex]::Escape('"bad.name"'))))
            & $py2 -c "import json,os; p=os.path.expanduser('~/.cys/depts.json'); d=json.load(open(p,encoding='utf-8')) if os.path.exists(p) else {'depts':{}}; d.setdefault('depts',{})['bad.name']={}; open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False))"
            $r2 = Bx $bash2 @($deptTool2,'rotate','bad.name') 30000
            $ok2 = ($r2.Code -eq 2)
            & $py2 -c "import json,os; p=os.path.expanduser('~/.cys/depts.json'); d=json.load(open(p,encoding='utf-8')); d.get('depts',{}).pop('bad.name',None); open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False))"
            $r3 = Bx $bash2 @($deptTool2,'create','bad.key') 30000
            $ok3 = ($r3.Code -eq 2)
            Rec 'ng3' ($ok1 -and $ok2 -and $ok3) "launch=$($r1.Code) rotate(등재 비정형)=$($r2.Code) createKey=$($r3.Code) — 전부 2 기대·부작용 0=$ok1"
          } catch { Rec 'ng3' $false "$_" }

          # ── tpl(ⓓ): 설치 팩의 CEO_TEMPLATE.md == 리포 커밋본 **바이트** 대조(sha256) — 설치 경로가
          #    템플릿을 변형하면(개행·인코딩 포함) 승격 표지·드리프트 게이트 전제가 무너진다 ──
          try {
            $repoTpl = Join-Path (Get-Location) 'cysjavis-pack\directives\CEO_TEMPLATE.md'
            $instTpl = Join-Path $userHome '.cys\pack\directives\CEO_TEMPLATE.md'
            $tplOk = (Test-Path $repoTpl) -and (Test-Path $instTpl) -and ((Get-FileHash -Algorithm SHA256 $repoTpl).Hash -eq (Get-FileHash -Algorithm SHA256 $instTpl).Hash)
            Rec 'tpl' $tplOk "설치 팩 CEO_TEMPLATE.md sha256 == 리포 커밋본 (repo=$(Test-Path $repoTpl) inst=$(Test-Path $instTpl))"
          } catch { Rec 'tpl' $false "$_" }

          # ── c03(ⓔ): 신선 팩(T3-1 init-pack 산출) preflight 를 **임베디드 python**으로 전수 실행
          #    (--safe=무변경 진단·--json) → C03 4종(master/worker/cso/reviewer)+C03.pin.ceo 전부 PASS.
          #    전체 exit 코드는 게이트가 아니다(러너엔 claude 등 부재 — 다른 검사의 FAIL 은 정상 소음).
          #    stdout/stderr 를 분리 캡처한다(Bx 는 병합이라 JSON 파싱이 stderr 소음에 오염됨).
          try {
            $pfScript = Join-Path $userHome '.cys\pack\bin\javis_preflight.py'
            if (-not (Test-Path $pfScript)) { throw "신선 팩 preflight 부재: $pfScript" }
            $pfOut = Join-Path $env:RUNNER_TEMP 'preflight-c03.json'
            $pfErr = Join-Path $env:RUNNER_TEMP 'preflight-c03.err'
            $pp = Start-Process -FilePath $py2 -ArgumentList @($pfScript,'--safe','--json') -NoNewWindow -PassThru -RedirectStandardOutput $pfOut -RedirectStandardError $pfErr
            if (-not $pp.WaitForExit(360000)) { try{$pp.Kill($true)}catch{}; throw "preflight --safe --json 6분 타임아웃" }
            $doc = Get-Content $pfOut -Raw | ConvertFrom-Json
            $need = @('C03.pin.master','C03.pin.worker','C03.pin.cso','C03.pin.reviewer','C03.pin.ceo')
            $bad = @()
            foreach ($cid in $need) {
              $rows = @($doc.checks | Where-Object { $_.id -eq $cid })
              if ($rows.Count -lt 1) { $bad += "$cid=미발화" }
              else { foreach ($row in $rows) { if ($row.status -ne 'PASS') { $bad += "$cid=$($row.status)" } } }
            }
            if ($bad.Count -gt 0) {
              Write-Host "== C03 비-PASS 상세 =="
              foreach ($cid in $need) { @($doc.checks | Where-Object { $_.id -eq $cid }) | ForEach-Object { Write-Host ("  [{0}] {1} - {2}" -f $_.status, $_.id, $_.detail) } }
            }
            Rec 'c03' ($bad.Count -eq 0) ("신선 팩 C03 4종+pin.ceo: " + $(if($bad.Count -eq 0){'전부 PASS'}else{$bad -join ' / '}))
          } catch { Rec 'c03' $false "$_" }

          # ── alt(ⓕ): T3 는 데몬을 띄우므로(위 pipe 행) status --json(org.status)에 D5 관측 필드
          #    alt_screen 키가 실린다를 단언 — surface 1개를 명시 생성해 노드 0개 무의미 통과를 차단 ──
          try {
            (Bx $cys @('new-surface','--title','t3-altscreen') 30000).Out | Out-Host
            $st = Bx $cys @('status','--json') 30000
            $altOk = ($st.Code -eq 0 -and $st.Out -match '"alt_screen"')
            Rec 'alt' $altOk "status --json alt_screen 키 존재(code=$($st.Code)) — D5 surface.list/org.status 동형 관측 필드"
          } catch { Rec 'alt' $false "$_" }

          # ── 집계 + 크리티컬 게이트 ──
          Write-Host "== T3 SMOKE 집계 =="
          $results.GetEnumerator() | Sort-Object Name | ForEach-Object { Write-Host ("  T3-{0}: {1}" -f $_.Key, ($(if($_.Value){'PASS'}else{'FAIL'}))) }
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # ★W8 확장 행 전부 크리티컬 — A13 이 이 판독을 릴리스 차단 게이트의 증적으로 지정한다.
          $crit = @('1','2','1b','pipe','13','ng1','ng2','ng3','tpl','c03','alt')
          $failed = $crit | Where-Object { -not $results["$_"] }
          if ($failed) { throw ("크리티컬 T3 행 실패: " + ($failed -join ',')) }
          Write-Host "OK: T3 크리티컬 스모크 통과 (나머지 행은 집계 로그로 승격 판독)"

      # ─────────────────────────────────────────────────────────────────────────
      # T4 무중단 재설치 스모크 (W4 잠금 무관 배치 + P1b 잔해청소 — nsis-hooks.nsh의 실기기 검증).
      # 핵심 assert: 라이브 데몬+세션 위로 setup.exe /S 재설치 → 데몬 PID 불변·세션 생존·
      # 배치 증거(★2026-08-29 W4 오라클: 같은 버전 재설치는 스왑을 단락하므로 prev 미생성이 정상 —
      # "prev 존재 OR 설치 SHA == 소스 SHA" 로 판정) → 새 cysd 기동 시 prev·`.new` 잔해 청소(P1b).
      # + T4-9/10 rotate_daemon 프리미티브(P3 지연 핸드오프): lame-duck 데몬의 drain 봉사·PID 세대교체.
      # + 다음 스텝 T4-14: 이미지 잠금 업그레이드 회귀(2026-08-28 실사고 재현 — 잠긴 구 CLI 위로 성공).
      # 이 기능은 "업데이트=전 세션 사망" 불안을 없애는 축이라 실기기 검증 없이 출하 금지.
      # ─────────────────────────────────────────────────────────────────────────
      - name: T4 무중단 재설치 스모크 (rename-swap 데몬 생존)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          function Bx($exe,$argv,$ms){
            $o=[System.IO.Path]::GetTempFileName(); $e=[System.IO.Path]::GetTempFileName()
            try {
              $p=Start-Process -FilePath $exe -ArgumentList $argv -NoNewWindow -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
              if(-not $p.WaitForExit($ms)){ try{$p.Kill($true)}catch{}; return @{Code=-1;Out=''} }
              return @{Code=$p.ExitCode;Out="$(Get-Content $o -Raw -ErrorAction SilentlyContinue)$(Get-Content $e -Raw -ErrorAction SilentlyContinue)"}
            } finally { Remove-Item $o,$e -Force -ErrorAction SilentlyContinue }
          }
          $inst = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter cysd.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'cysd.exe' } | Select-Object -First 1
          if (-not $inst) { throw "T4: 설치된 cysd.exe 미발견" }
          $dir = $inst.Directory.FullName; $cys = Join-Path $dir 'cys.exe'; $cysd = $inst.FullName
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "T4: setup.exe 미발견" }

          # ① 데몬 기동 + PID 기록 + 라이브 세션(role=master 셸) 생성
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 1
          Start-Process -FilePath $cysd -WindowStyle Hidden
          $r = $null; foreach($i in 1..20){ Start-Sleep 1; $r = Bx $cys @('list') 15000; if($r.Code -eq 0){ break } }
          if ($r.Code -ne 0) { throw "T4: 데몬 기동 실패(pipe 미응답)" }
          $pidBefore = (Get-Process cysd | Select-Object -First 1).Id
          (Bx $cys @('new-surface','--role','master') 30000).Out | Out-Host
          $before = (Bx $cys @('list') 15000).Out
          if ($before -notmatch 'role=master') { throw "T4: 사전 세션 생성 실패: $before" }
          # ①' 실장애 재현(2026-07-02 msys-2.0.dll Can't write → Abort): 라이브 bash가 runtime DLL을
          # 로드한 상태로 재설치한다 — T4 초판은 PowerShell 셸이라 이 잠금을 재현 못 해 놓쳤다.
          $bash = Join-Path $dir 'runtime\git\usr\bin\bash.exe'
          # ArgumentList 배열은 공백 인자 quoting을 잃는다(PS Start-Process 고질) → 단일 문자열로 전달
          $bp = Start-Process -FilePath $bash -ArgumentList '-c "sleep 600"' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          if ($bp.HasExited) { throw "T4: bash 잠금 프로세스 기동 실패" }
          Write-Host "T4 사전상태: daemon pid=$pidBefore, master surface 생성됨, bash(msys DLL 잠금) pid=$($bp.Id)"

          # ② 라이브 상태 그대로 silent 재설치 (rename-swap 경로)
          $ri = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host ("T4-1 RESULT: {0}  reinstall exit={1}" -f ($(if($ri.ExitCode -eq 0){'PASS'}else{'FAIL'})), $ri.ExitCode)
          if ($ri.ExitCode -ne 0) { throw "T4-1: 재설치 실패 exit=$($ri.ExitCode)" }
          Start-Sleep 2

          # ③ assert: 데몬 PID 불변 + pipe 응답 + 세션 생존 + prev 존재 + 새 cysd.exe 존재
          $alive = Get-Process -Id $pidBefore -ErrorAction SilentlyContinue
          Write-Host ("T4-2 RESULT: {0}  daemon pid={1} alive" -f ($(if($alive){'PASS'}else{'FAIL'})), $pidBefore)
          $after = (Bx $cys @('list') 20000)
          $sessOk = ($after.Code -eq 0 -and $after.Out -match 'role=master')
          Write-Host ("T4-3 RESULT: {0}  pipe+session (code={1})" -f ($(if($sessOk){'PASS'}else{'FAIL'})), $after.Code)
          function ShaOf($p) { if (Test-Path $p) { (Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash } else { 'MISSING' } }
          $srcCys  = (Get-ChildItem 'src-tauri/binaries/cys-*.exe'  | Select-Object -First 1)
          $srcCysd = (Get-ChildItem 'src-tauri/binaries/cysd-*.exe' | Select-Object -First 1)
          if (-not $srcCys -or -not $srcCysd) { throw "T4-4/T4-12: 빌드 사이드카(src-tauri/binaries)를 못 찾음" }
          $freshCys  = (ShaOf $cys)  -eq (ShaOf $srcCys.FullName)
          $freshCysd = (ShaOf $cysd) -eq (ShaOf $srcCysd.FullName)
          # ★T4-4 재정의(2026-08-29 W4 · nsis-hooks.nsh CYS_PLACE ① 오라클 단락 :187-193).
          # 신선도 판정이 절대 오라클(정식의 VERSIONINFO DWORD == 이번 빌드 컴파일 상수)로 바뀌어
          # **같은 버전 재설치는 스왑 자체를 하지 않는다**(prev 미생성이 정상 — 0.14.27 의
          # "같은 버전 재설치 → 영원한 exit 4 루프" 수리의 짝). 이 레인은 같은 setup 을 재설치
          # 하므로 종전 단언("cysd.prev.exe 존재")은 구조적으로 적색이 된다. 새 계약:
          # 스왑이 일어났으면 prev 가 남고, 단락됐으면 정식이 이미 이번 빌드 바이트다 —
          # "prev 존재 OR 설치 SHA == 소스 SHA"(NSIS-CONTRACT.md §4 '같은 버전 /S 재설치' 행).
          $prevExists = Test-Path (Join-Path $dir 'cysd.prev.exe')
          $prevOk = $prevExists -or $freshCysd
          Write-Host ("T4-4 RESULT: {0}  배치 증거(cysd.prev 존재={1} OR 설치SHA==소스SHA={2} — 오라클 단락 허용)" -f ($(if($prevOk){'PASS'}else{'FAIL'})), $prevExists, $freshCysd)
          $newOk = Test-Path $cysd
          Write-Host ("T4-5 RESULT: {0}  새 cysd.exe 존재" -f ($(if($newOk){'PASS'}else{'FAIL'})))
          # ★T4-11/T4-12 (2026-08-01 · 윈도우 실사고 "CLI 소실" 회귀 잠금).
          # 실사고 상태는 "cys.exe·cysd.exe 가 둘 다 부재하고 .prev.exe 만 잔존"이었다. 종전 T4는
          # cysd.exe 존재만 봤고 cys.exe 는 직접 단언하지 않았으며, 무엇보다 "파일이 있다"와
          # "새 빌드가 실제로 들어왔다"를 구분하지 못했다 — SetOverwrite try 는 추출 실패를
          # 조용히 스킵하므로 구본이 그대로 남아도 존재 검사는 통과한다(무증상 반쪽 업그레이드).
          # T4-11 = 존재(소실 회귀), T4-12 = 내용 동일성(신본 반영). 둘 다 결정론이다.
          $cliOk = Test-Path $cys
          Write-Host ("T4-11 RESULT: {0}  새 cys.exe 존재(CLI 소실 회귀 잠금)" -f ($(if($cliOk){'PASS'}else{'FAIL'})))
          $freshOk = $freshCys -and $freshCysd
          Write-Host ("T4-12 RESULT: {0}  설치된 cys/cysd = 방금 빌드한 사이드카와 바이트 동일(신본 반영 · cys={1} cysd={2})" -f ($(if($freshOk){'PASS'}else{'FAIL'})), $freshCys, $freshCysd)
          $bashAlive = -not $bp.HasExited
          Write-Host ("T4-7 RESULT: {0}  잠금 bash 생존(무사망)" -f ($(if($bashAlive){'PASS'}else{'FAIL'})))
          $msysOk = Test-Path (Join-Path $dir 'runtime\git\usr\bin\msys-2.0.dll')
          Write-Host ("T4-8 RESULT: {0}  msys-2.0.dll 신본 추출(잠금 스윕 검증)" -f ($(if($msysOk){'PASS'}else{'FAIL'})))
          # ★T4-13: 실패 흔적 파일(POSTINSTALL 검증 게이트가 남기는 유일한 무인 판독원)이 없어야 한다.
          $failMark = Join-Path $dir 'cys-install-failure.txt'
          $noFail = -not (Test-Path $failMark)
          if (-not $noFail) { Write-Host "== cys-install-failure.txt =="; Get-Content $failMark }
          Write-Host ("T4-13 RESULT: {0}  설치 실패 흔적(cys-install-failure.txt) 부재" -f ($(if($noFail){'PASS'}else{'FAIL'})))
          if (-not ($alive -and $sessOk -and $prevOk -and $newOk -and $cliOk -and $freshOk -and $noFail -and $bashAlive -and $msysOk)) { Write-Host "== after list =="; Write-Host $after.Out; throw "T4: 무중단 재설치 assert 실패" }

          # ③' T4-9 rotate_daemon 1단계 스모크: 스큐(lame-duck) 상태의 구 데몬이 drain RPC를 봉사하는지.
          # rotate_daemon(src-tauri/main.rs)은 drain을 best-effort(let _ =)로 취급하므로 exit 코드는
          # 로그만 남기고(비0 허용 = 프로덕션 의미론 동일), 워치독 내 완주(hang 아님)만 게이트한다.
          $dr = Bx $cys @('drain') 30000
          $drOk = ($dr.Code -ne -1)
          Write-Host ("T4-9 RESULT: {0}  drain 완주(lame-duck 데몬 RPC, exit={1})" -f ($(if($drOk){'PASS'}else{'FAIL'})), $dr.Code)
          if (-not $drOk) { throw "T4-9: drain이 워치독(30s) 내 미완주 — lame-duck 데몬 hang" }

          # ④ P1b: 잠금 해제(bash 종료) → 구 데몬 종료 → 새 cysd 기동 → prev 잔해 재귀 자가청소 assert
          try { $bp.Kill($true) } catch {}
          Stop-Process -Id $pidBefore -Force; Start-Sleep 2
          Start-Process -FilePath $cysd -WindowStyle Hidden
          $r2 = $null; foreach($i in 1..20){ Start-Sleep 1; $r2 = Bx $cys @('list') 15000; if($r2.Code -eq 0){ break } }
          if ($r2.Code -ne 0) { throw "T4: 새 데몬 기동 실패" }
          Start-Sleep 2
          # T4-10 rotate 세대교체 증거: 새 데몬 PID ≠ 구 PID (교대가 재사용이 아니라 신 바이너리 프로세스).
          $pidAfter = (Get-Process cysd | Select-Object -First 1).Id
          $swapOk = ($pidAfter -ne $pidBefore)
          Write-Host ("T4-10 RESULT: {0}  데몬 세대교체(신 pid={1} ≠ 구 pid={2})" -f ($(if($swapOk){'PASS'}else{'FAIL'})), $pidAfter, $pidBefore)
          $rootPrev = Test-Path (Join-Path $dir 'cysd.prev.exe')
          $rtLeft = @(Get-ChildItem (Join-Path $dir 'runtime') -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*.prev*' })
          $rtPrev = $rtLeft.Count
          # ★W4(2026-08-29) 추가 단언: 훅 스테이징 산출물 `<bin>.new.exe` 는 성공 설치 후 $INSTDIR
          #   에 남지 않아야 한다 — 배치 성공 시 rename 으로 소멸 + Delete 벨트(nsis-hooks.nsh:323),
          #   오라클 단락 시에도 stale `.new` 를 지운다(:191). 정식 존재 시 cysd 부팅 가드(W1)도
          #   삭제한다. 남아 있으면 배치 트랜잭션 또는 가드 회귀다(NSIS-CONTRACT.md §1).
          $newLeft = @(Get-ChildItem $dir -File -Filter '*.new.exe' -ErrorAction SilentlyContinue)
          # ★P1b 격리함(정의처 src/bin/cysd/main.rs `UPDATE_TRASH_DIR`). 삭제(remove_file)는 **아직
          # 매핑 중인 PE 이미지에 대해 반드시 실패**하므로(라이브 세션 셸이 runtime\ DLL 을 물고 있는
          # 것이 이 제품의 정상 상태다 — T4 스스로 $bp 로 그 상황을 만든다), 새 cysd 는 삭제 실패
          # 잔해를 설치 루트 하위 격리함으로 rename 해 회수를 완결한다(매핑된 이미지는 삭제는
          # 거부돼도 rename 은 허용 — 설치기 unlock-sweep 과 같은 원리). 홀더가 죽으면 다음 기동의
          # 스윕이 격리본을 삭제한다.
          # 게이트는 **완화하지 않는다**: 종전과 동일하게 runtime 트리 잔해 0 + 루트 체인 잔해 0 을
          # 단언한다. 격리 건수는 사실대로 함께 찍는다 — "0개를 청소했다"와 "N개를 격리해서 0이다"는
          # 다른 상태이므로 로그가 그 차이를 숨기면 안 된다.
          $qDir = Join-Path $dir '.cys-update-trash'
          $qCount = @(Get-ChildItem $qDir -Recurse -File -ErrorAction SilentlyContinue).Count
          $cleaned = (-not $rootPrev) -and ($rtPrev -eq 0) -and ($newLeft.Count -eq 0)
          Write-Host ("T4-6 RESULT: {0}  새 cysd 기동 후 잔해 청소(P1b — root+runtime prev 잔존 {1}개 · 격리 {2}개 · rootPrev={3} · .new.exe 잔존 {4}개[0 기대])" -f ($(if($cleaned){'PASS'}else{'FAIL'})), $rtPrev, $qCount, $rootPrev, $newLeft.Count)
          if (-not $cleaned) {
            # ★진단 덤프(2026-08-26 회귀 대응): 종전 로그는 '잔존 9개' 하나뿐이라 무엇이 왜 남았는지
            # 알 수 없었다. 잔해 이름 + **설치 트리에서 실행 중인 프로세스**(=삭제 실패의 유일한 원인
            # 인 홀더)를 함께 남겨 다음 실패는 한 번에 규명되게 한다.
            Write-Host "== 잔존 잔해(runtime 재귀) =="
            $rtLeft | ForEach-Object { Write-Host ("  {0}" -f $_.FullName) }
            Write-Host "== 잔존 .new.exe (배치 트랜잭션/가드 회귀 후보) =="
            $newLeft | ForEach-Object { Write-Host ("  {0}" -f $_.FullName) }
            Write-Host "== 설치 트리에서 실행 중인 프로세스(홀더 후보) =="
            Get-Process -ErrorAction SilentlyContinue | ForEach-Object {
              $pth = $null; try { $pth = $_.Path } catch {}
              if ($pth -and $pth.StartsWith($dir, [StringComparison]::OrdinalIgnoreCase)) { Write-Host ("  pid={0} {1}" -f $_.Id, $pth) }
            }
          }
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $cleaned) { throw "T4-6: 잔해 미청소(prev 또는 .new.exe 잔존)" }
          if (-not $swapOk) { throw "T4-10: 데몬 세대교체 실패(PID 불변 — 구 데몬 잔존)" }
          Write-Host "OK: T4 무중단 재설치 스모크 전행 통과 — 업데이트 중 데몬·세션 무사망 실증"

      # ─────────────────────────────────────────────────────────────────────────
      # T4-14 이미지 잠금 업그레이드 회귀 (2026-08-28 실사고 재현 — W4 잠금 무관 배치의 표적 시험).
      # 실사고: 구 cys.exe 가 프로세스(브리지 재스폰 스톰)에 이미지 잠금된 채 설치가 돌아 추출이
      #   무음 스킵(SetOverwrite try)되고, 지문 게이트가 그것을 실패로 판정 → 영원한 exit 4 루프
      #   + CLI 소실 계열(AUDIT-2ND-PASS-2026-08-28). 새 훅 계약(nsis-hooks.nsh CYS_PLACE ②~⑧ ·
      #   NSIS-CONTRACT.md §2): 잠긴 실행 이미지는 덮어쓰기 불가·rename 가능이므로 `.new` 추출→
      #   검증→rename 2단 배치로 **성공해야 한다**(exit 0 + 신버전).
      # 재현법: 정식 cys.exe 를 '다른 VERSIONINFO 의 자기완결 실행 PE'(cmd.exe 사본 = 구버전
      #   스탠드인)로 바꾸고 **실행해 진짜 이미지 잠금**을 만든 채 /S 재설치한다. 배타 핸들
      #   (FileShare None) 잠금과는 다른 계급이다 — 그 쪽은 rename 도 거부돼 exit 4 가 정답
      #   (체크리스트 P6). 이미지 잠금은 rename 이 허용되므로 성공이 정답이다.
      # ─────────────────────────────────────────────────────────────────────────
      - name: T4-14 이미지 잠금 업그레이드 회귀 (잠긴 구 cys.exe 위로 성공)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter cysd.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'cysd.exe' } | Select-Object -First 1
          if (-not $inst) { throw "T4-14: 설치된 cysd.exe 미발견" }
          $dir = $inst.Directory.FullName
          $cys = Join-Path $dir 'cys.exe'
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "T4-14: setup.exe 미발견" }
          # 기대 버전 = 빌드 SOT(루트 Cargo.toml [package].version — cys --version 의 CARGO_PKG_VERSION 원천)
          $expVer = (Select-String -Path 'Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $expVer) { throw "T4-14: Cargo.toml 버전 파싱 실패" }
          # ① 구버전 스탠드인: 다른 VERSIONINFO 를 가진 자기완결 PE(cmd.exe 사본)를 정식 자리에 —
          #    오라클(CYS_ORACLE)이 notfresh 로 판정해 스왑 기계가 실제로 돈다(단락 아님).
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 1
          Get-ChildItem $dir -File -Filter 'cys.prev*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $cys -Force
          Write-Host ("스탠드인 배치: cys.exe VERSIONINFO = {0} (이번 빌드 {1} 와 달라야 한다)" -f (Get-Item $cys).VersionInfo.FileVersion, $expVer)
          # ② 실행 = 진짜 이미지 잠금(덮어쓰기·삭제 거부 / rename 허용) — 실사고의 잠금 계급
          $lock = Start-Process -FilePath $cys -ArgumentList '/c ping -n 900 127.0.0.1 >nul' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          if ($lock.HasExited) { throw "T4-14: 스탠드인 잠금 프로세스 기동 실패" }
          # ③ 잠긴 채 무인 업그레이드 — 성공(exit 0)해야 한다
          $ri = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          $exitOk = ($ri.ExitCode -eq 0)
          # ④ 정식 = 신본 바이트 + 실행 출력이 신버전. ★바이트 대조를 먼저 한다 — 스왑 실패로
          #    정식이 아직 cmd 스탠드인이면 `--version` 인자가 대화형 cmd 를 띄워 스텝이 hang 한다.
          $srcCys = (Get-ChildItem 'src-tauri/binaries/cys-*.exe' | Select-Object -First 1)
          if (-not $srcCys) { throw "T4-14: 빌드 사이드카(src-tauri/binaries)를 못 찾음" }
          $shaOk = (Get-FileHash -Algorithm SHA256 -LiteralPath $cys).Hash -eq (Get-FileHash -Algorithm SHA256 -LiteralPath $srcCys.FullName).Hash
          $vOut = ''
          if ($shaOk) { $vOut = (& $cys --version) -join ' ' }
          $verOk = $shaOk -and ($vOut -match [regex]::Escape($expVer))
          $lockAlive = -not $lock.HasExited
          $noFail = -not (Test-Path (Join-Path $dir 'cys-install-failure.txt'))
          # 스탠드인은 prev 슬롯으로 rename 대피됐어야 한다(잠금 프로세스가 그 이름으로 생존 —
          # 커밋 후 슬롯 정리는 best-effort 라 홀더가 쥔 슬롯은 남는 것이 정상 · 훅 L6).
          $slotCnt = @(Get-ChildItem $dir -File -Filter 'cys.prev*.exe' -ErrorAction SilentlyContinue).Count
          $ok = $exitOk -and $verOk -and $lockAlive -and $noFail -and ($slotCnt -ge 1)
          Write-Host ("T4-14 RESULT: {0}  잠긴 구 cys.exe 위로 업그레이드 (exit={1}[0 기대] · 신본SHA={2} · --version='{3}'[~{4}] · 잠금프로세스 생존={5} · 실패파일 부재={6} · prev 슬롯 대피={7}개[>=1])" -f ($(if($ok){'PASS'}else{'FAIL'})), $ri.ExitCode, $shaOk, $vOut, $expVer, $lockAlive, $noFail, $slotCnt)
          if (-not $noFail) { Write-Host "== cys-install-failure.txt =="; Get-Content (Join-Path $dir 'cys-install-failure.txt') }
          # 정리: 잠금 해제 → 스탠드인 대피본 제거(이후 스텝 오염 방지 — 남아도 cysd 스윕이 지우지만 결정성 위해)
          try { $lock.Kill($true) } catch {}
          Start-Sleep 1
          Get-ChildItem $dir -File -Filter 'cys.prev*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "T4-14: 이미지 잠금 업그레이드 회귀 실패 — 2026-08-28 실사고 계열(잠긴 구 CLI 위로 신본 미반영 또는 성공 위장)" }
          Write-Host "OK: T4-14 — 잠긴 구 CLI 위로 업그레이드 성공 + 신버전 반영 실증"

      # ─────────────────────────────────────────────────────────────────────────
      # T4-15 배타 핸들 거부 회귀 (R2 라운드2 신설 — 체크리스트 P6 · NSIS-CONTRACT §3·§4 의 기계 시험).
      # 종전 레인의 공백: 훅의 **거부 계열 분기**(CYS_PLACE vacate-locked → 트랜잭션 undo →
      #   실패 파일 4토큰 → exit 4)는 어느 레인에서도 0회 실행이었다 — T4 는 오라클 단락(성공),
      #   T4-14 는 이미지 잠금(rename 허용 = 성공)만 밟는다. 배타 핸들(FileShare None)은 rename
      #   의 DELETE 접근까지 거부하므로 **거부가 정답**인 유일한 잠금 계급이다(P6).
      # 시나리오(§9-5 의 세대 분할 조합을 의도적으로 재현):
      #   ① cys.exe = 구버전 스탠드인(cmd 사본)을 **실행**(이미지 잠금 — 훅 배치 경로 강제)
      #   ② cysd.exe = 구버전 스탠드인 + 이 스텝의 pwsh 가 **거부 계급 핸들**(FileShare Read
      #      — 쓰기·rename 거부·읽기 허용) 유지
      #   ③ /S 업그레이드 → cys 는 훅이 배치 성공($5=prev), cysd 는 vacate-locked 거부 →
      #      트랜잭션 undo 가 cys 를 구본으로 되돌림(not-updated) → exit 4 + 4토큰 실패 파일 +
      #      콜백(CYS_ABORT_RESCUE)이 스테이징 .new 정리(정식 동작본 확인 시에만 지우는 갈래).
      #   ④ 핸들 해제 후 재실행 = 치유(exit 0 · 전부 신본 · 실패 파일 삭제) — 계약의 안내문
      #      ("run this installer again")이 참인지까지 잰다. 스탠드인 프로세스는 내내 생존
      #      (무사망 — 전 pane kill 금지 앵커의 이 레인 대리검체).
      # ─────────────────────────────────────────────────────────────────────────
      - name: T4-15 배타 핸들 거부 회귀 (exit 4 + 4토큰 + 구본 무손상 + 재실행 치유)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          # ★annotation 이스케이프. GitHub 워크플로 명령은 `%`·개행을 이스케이프해야 본문이
          #   잘리지 않는다(`%` 를 **먼저** 바꾼다 — 순서를 뒤집으면 %0A 의 % 가 다시 먹힌다).
          function Esc([string]$s) { $s -replace '%','%25' -replace "`r",'' -replace "`n",'%0A' }
          # ★설치 트리는 앞의 '자기완결 검증' 스텝이 계약 경로(%LOCALAPPDATA%\cys)로 확정하고
          #   버전 마커로 동일성을 못 박은 값을 그대로 받는다(R1 codex #9 · master 판정 2026-09-04).
          #   재귀 검색으로 되돌리지 마라 — 잔존 설치를 집어 초록이 거짓이 된다.
          $dir = $env:CYS_INSTALL_DIR
          if (-not $dir) { throw "T4-15: CYS_INSTALL_DIR 미확정 — 앞의 '자기완결 검증' 스텝이 실패했거나 스텝 순서가 바뀌었다" }
          if (-not (Test-Path (Join-Path $dir 'cysd.exe'))) { throw "T4-15: 설치 디렉터리에 cysd.exe 가 없다: $dir" }
          if ((Get-Content (Join-Path $dir 'cys-installed-version.txt') -Raw).Trim() -ne $env:CYS_INSTALL_VER) { throw "T4-15: 설치본이 그 사이 바뀌었다 — 마커 != 설치 시 확정값($env:CYS_INSTALL_VER)" }
          $inst = Get-Item (Join-Path $dir 'cysd.exe')
          $cys = Join-Path $dir 'cys.exe'; $cysd = Join-Path $dir 'cysd.exe'
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "T4-15: setup.exe 미발견" }
          $expVer = (Select-String -Path 'Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          function ShaOf($p) { (Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash }
          # ① 사전 정돈 + 구버전 스탠드인 2종 배치(cmd 사본 = 다른 VERSIONINFO → 오라클 notfresh)
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 1
          Get-ChildItem (Join-Path $dir '*') -File -Include 'cys.prev*.exe','cysd.prev*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $cys -Force
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $cysd -Force
          $oldSha = ShaOf "$env:SystemRoot\System32\cmd.exe"
          $lock = Start-Process -FilePath $cys -ArgumentList '/c ping -n 900 127.0.0.1 >nul' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          if ($lock.HasExited) { throw "T4-15: 스탠드인 잠금 프로세스 기동 실패" }
          # ② cysd 에 거부 계급 핸들: FileShare **Read** = 쓰기(템플릿 truncate-write)와
          #    rename(DELETE 접근) 은 거부하되 읽기(오라클 FileOpen/GetDLLVersion)는 허용 —
          #    AV·백업·인덱서가 쥐는 전형이자 P6("배타 핸들 ⇒ exit 4")이 뜻하는 그 계급이다.
          #    ⚠FileShare None 은 다른 계급이다: 오라클 읽기까지 눈멀어 LASTDITCH 가 '부재/절단'
          #    으로 오판(현행 exit 3 + unrecoverable 오분류·무손상은 유지) — 별도 이슈로 기록.
          $fs = [System.IO.File]::Open($cysd, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::Read)
          try {
            # ③ 잠긴 채 무인 업그레이드 — **거부(exit 4)가 정답**이다(성공 주장 = P6 위반)
            $ri = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
            $exit4 = ($ri.ExitCode -eq 4)
            $failMark = Join-Path $dir 'cys-install-failure.txt'
            $hasMark = Test-Path $failMark
            $l1Ok = $false; $unrecEmpty = $false; $rbEmpty = $false; $nuOk = $false; $prOk = $false
            if ($hasMark) {
              $txt = @(Get-Content $failMark)
              Write-Host "== cys-install-failure.txt =="; $txt | ForEach-Object { Write-Host "  $_" }
              $l1Ok      = [bool]($txt[0] -match 'critical executable verification FAILED \(exit 4\)')
              $unrecEmpty = [bool](($txt | Where-Object { $_ -like 'unrecoverable:*' }) -match '^unrecoverable:\s*$')
              $rbEmpty    = [bool](($txt | Where-Object { $_ -like 'rolled-back-to-previous:*' }) -match '^rolled-back-to-previous:\s*$')
              $nuOk       = [bool](($txt | Where-Object { $_ -like 'not-updated:*' }) -match 'cys\.exe\(not-updated\)')
              $prOk       = [bool](($txt | Where-Object { $_ -like 'placement-refused:*' }) -match 'cysd\.exe\(vacate-locked\)')
            }
            # 구본 무손상: cys 는 undo 로 복귀, cysd 는 손도 못 댔다 — 둘 다 스탠드인 바이트 그대로
            $cysOld  = (ShaOf $cys)  -eq $oldSha
            $cysdOld = (ShaOf $cysd) -eq $oldSha
            $lockAlive = -not $lock.HasExited
            # 콜백 정리 확인: 정식 동작본 확인 갈래가 스테이징 .new 를 지웠다(§1 '콜백' 삭제자)
            $noNew = -not ((Test-Path (Join-Path $dir 'cys.new.exe')) -or (Test-Path (Join-Path $dir 'cysd.new.exe')))
            $ok1 = $exit4 -and $hasMark -and $l1Ok -and $unrecEmpty -and $rbEmpty -and $nuOk -and $prOk -and $cysOld -and $cysdOld -and $lockAlive -and $noNew
            $res1 = ("T4-15a RESULT: {0}  배타 핸들 거부 (exit={1}[4 기대] · 실패파일={2} · 1행={3} · unrec空={4} · rb空={5} · not-updated[cys]={6} · refused[cysd]={7} · cys구본={8} · cysd구본={9} · 프로세스생존={10} · .new정리={11})" -f ($(if($ok1){'PASS'}else{'FAIL'})), $ri.ExitCode, $hasMark, $l1Ok, $unrecEmpty, $rbEmpty, $nuOk, $prOk, $cysOld, $cysdOld, $lockAlive, $noNew)
            Write-Host $res1
            if (-not $ok1) {
              # ★실패 사유를 annotation 채널로 올린다(2026-09-04 진단 배선). 이 스텝은 이미 11개
              #   판정 필드를 전부 찍지만 그건 **로그**뿐이고, 이 저장소의 CI 로그는 토큰 없이
              #   읽을 수 없다(익명 403). 그래서 3레인 동시 실패가 "exit code 1" 한 줄로만
              #   관측됐다 — 진단 정보가 부족한 게 아니라 **읽히는 채널에 없었다**.
              #   실패했을 때만 올린다(성공 런의 annotation 을 더럽히지 않는다).
              $d1 = $res1
              if ($hasMark) { $d1 += "`n-- cys-install-failure.txt --`n" + ((Get-Content $failMark) -join "`n") }
              $rem = (Get-ChildItem (Join-Path $dir '*') -File -Include 'cys*.exe','cysd*.exe' -ErrorAction SilentlyContinue |
                      ForEach-Object { "{0} {1}B" -f $_.Name, $_.Length }) -join "`n"
              $d1 += "`n-- 설치 디렉터리 실행파일 잔재(.new/.prev 세대 판정용) --`n" + $rem
              Write-Host ("::error title=T4-15a::" + (Esc $d1))
              throw "T4-15a: 거부 계약 위반 — P6(배타 핸들 ⇒ exit 4 + 구본 무손상) 또는 §3 토큰 스키마 회귀"
            }
          } finally {
            $fs.Close()
          }
          # ④ 치유: 핸들 해제 후 재실행 — 계약 안내문의 기계 검증(스탠드인 프로세스는 계속 실행 중)
          $ri2 = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          $srcCys  = (Get-ChildItem 'src-tauri/binaries/cys-*.exe'  | Select-Object -First 1)
          $srcCysd = (Get-ChildItem 'src-tauri/binaries/cysd-*.exe' | Select-Object -First 1)
          $healedCys  = (ShaOf $cys)  -eq (ShaOf $srcCys.FullName)
          $healedCysd = (ShaOf $cysd) -eq (ShaOf $srcCysd.FullName)
          $noMark = -not (Test-Path (Join-Path $dir 'cys-install-failure.txt'))
          $marker = Join-Path $dir 'cys-installed-version.txt'
          $markerOk = (Test-Path $marker) -and ((Get-Content $marker -Raw) -match [regex]::Escape($expVer))
          $lockAlive2 = -not $lock.HasExited
          $ok2 = ($ri2.ExitCode -eq 0) -and $healedCys -and $healedCysd -and $noMark -and $markerOk -and $lockAlive2
          $res2 = ("T4-15b RESULT: {0}  재실행 치유 (exit={1}[0 기대] · cys신본={2} · cysd신본={3} · 실패파일 삭제={4} · 버전마커={5} · 프로세스생존={6})" -f ($(if($ok2){'PASS'}else{'FAIL'})), $ri2.ExitCode, $healedCys, $healedCysd, $noMark, $markerOk, $lockAlive2)
          Write-Host $res2
          if (-not $ok2) { Write-Host ("::error title=T4-15b::" + (Esc $res2)) }   # 위 T4-15a 와 같은 이유(로그 403)
          # 정리(이후 스텝 오염 방지): 잠금 해제 → 스탠드인 대피 잔해 제거
          try { $lock.Kill($true) } catch {}
          Start-Sleep 1
          Get-ChildItem (Join-Path $dir '*') -File -Include 'cys.prev*.exe','cysd.prev*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok2) { throw "T4-15b: 재실행 치유 실패 — 계약 안내문('run this installer again')이 거짓" }
          Write-Host "OK: T4-15 — 배타 핸들 거부(exit 4 + 4토큰 + 구본 무손상 + 무사망) 및 재실행 치유 실증"

      # ─────────────────────────────────────────────────────────────────────────
      # T5 피닉스(불사조 무손실 복원) Windows 패리티 스모크 (S1~S5 + 진짜 KeepAlive 실측).
      # 경로/파이프 매핑·supervisor(schtasks)·재시작 프리미티브(identify→taskkill→파이프해제→retrigger→epoch delta)
      # ·snapshot+독립 runbook(.ps1)·stub restore(M9 VERIFIED)·deploy --plan exit 계약 + ★케이스⑦ 진짜 KeepAlive
      # (RestartOnFailure: taskkill→스케줄러 자동 재기동→epoch delta·유발 없이 순수 관측)을 결정론·자기완결로 검증한다.
      # 스모크는 checkout 된 repo 경로에서 직접 실행(pack 임베드 비의존)하고 동봉 python3 + 설치된 cys/cysd 를 구동한다.
      # 실패 시 throw(=게이트) — T4 관용과 정합. mac unix 하네스(javis_phoenix_harness.py)는 무접촉.
      # ─────────────────────────────────────────────────────────────────────────
      - name: T5 피닉스 Windows 패리티 스모크 (무손실 복원 S1~S5 + KeepAlive)
        shell: pwsh
        timeout-minutes: 20   # ★백스톱: 케이스⑦ RestartOnFailure 실전 재기동 지연 ~4분(예산 420s)+①~⑥ ~3분+오버헤드 → ~11-12분·여유 상향(hang은 스모크 롤링 워치독이 잡음)
        env:
          PYTHONUTF8: '1'     # 한글 stdout cp1252 크래시 방지(RC-16 관례)
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter cysd.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'cysd.exe' } | Select-Object -First 1
          if (-not $inst) { throw "T5: 설치된 cysd.exe 미발견" }
          $dir = $inst.Directory.FullName
          $cys = Join-Path $dir 'cys.exe'
          $cysd = $inst.FullName
          $py = Join-Path $dir 'runtime\python\python3.exe'
          if (-not (Test-Path $py))  { throw "T5: 동봉 python3.exe 미발견: $py" }
          if (-not (Test-Path $cys)) { throw "T5: 설치된 cys.exe 미발견: $cys" }
          $smoke = Join-Path (Get-Location) 'cysjavis-pack\bin\javis_phoenix_win_smoke.py'
          if (-not (Test-Path $smoke)) { throw "T5: 스모크 파일 미발견(checkout 경로): $smoke" }
          Write-Host "cys=$cys"; Write-Host "cysd=$cysd"; Write-Host "py=$py"; Write-Host "smoke=$smoke"
          # 사전 정리(이전 스텝 잔류 데몬) — 스모크는 테스트 전용 파이프(cys-phxsmoke-*)를 쓰지만 결정성 위해 정돈.
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 1
          $env:PHOENIX_CYS = $cys
          $env:PHOENIX_CYSD = $cysd
          & $py $smoke
          $code = $LASTEXITCODE
          # ★케이스⑦ 정리: 실 cysd 스케줄러 태스크가 남으면 안 됨(스모크가 finally 로 uninstall 하나 방어적 재정리)
          & $cys daemon uninstall 2>$null
          Get-Process cys,cysd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "T5: 피닉스 Windows 패리티 스모크 실패 (exit=$code)" }
          Write-Host "OK: T5 피닉스 Windows 패리티 스모크 통과 (경로매핑·schtasks·재시작·snapshot/ps1·stub restore·deploy plan·★KeepAlive respawn·★⑧실경로 auto-restore[주입 없이 cysd 자체 decide_auto_restore]·★⑨Job Object 자식트리 동반사망[D3 P2-9])"
          # ★Actions pwsh 래퍼는 스크립트 말미에 exit $LASTEXITCODE 를 붙인다 — 위 방어적 uninstall(스모크 finally 가
          #   이미 제거해 rc=1)이 그 값을 오염시켜 '스모크 성공인데 스텝 exit 1'(run 28738140283 실증). 판정은 $code 로 끝 — 명시 exit 0.
          exit 0

      # ─────────────────────────────────────────────────────────────────────────
      # T6 형제 import 가드 회귀 (D1) — ★**이 레인에서만 진짜 조건으로 돈다**.
      # 배경: 2026-07-29 Windows 0.14.4 에서 `javis_event.py: No module named 'javis_scrub'` 실측.
      #   원인은 동봉 embeddable 파이썬(`python312._pth`)이 표준 경로 계산을 우회해 **스크립트 폴더를
      #   sys.path 에 넣지 않는** 것이고, 훅은 fail-open(exit 0)이라 이 실패가 증상 없이 산다.
      # 왜 여기여야 하나(리뷰어1 R2): 이 회귀 스위트는 ci-branch/release/pack-release 3레인에 등재돼
      #   있지만 전부 macOS/ubuntu 잡이라 **문제의 런타임에서는 0회 실행**된다. 그 레인의 ③ 은
      #   runpy 로 조건을 *모사*할 뿐이다. 여기서는 실제로 배송되는 그 인터프리터가 그 파일들을 돈다.
      # 판정 계약: 스위트 자신이 exit 0/1 을 낸다(0=전건 PASS). 실패 시 throw = 게이트.
      # ─────────────────────────────────────────────────────────────────────────
      # ⚠스텝 제목·주석에 스위트 파일명을 적지 마라 — 레인 대조 게이트는 주석을 지우고 이름을 긁으므로,
      #   제목에 남은 이름이 **실행 줄이 사라져도 초록을 유지시키는 유령 근거**가 된다(실측으로 확인).
      #   이 레인이 그 스위트를 돈다는 증거는 아래 `$suite` 경로 한 곳뿐이어야 한다.
      - name: T6 형제 import 가드 회귀 (동봉 embeddable python 실런타임)
        shell: pwsh
        timeout-minutes: 5
        env:
          PYTHONUTF8: '1'     # 한글 stdout cp1252 크래시 방지(RC-16 관례)
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter cysd.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'cysd.exe' } | Select-Object -First 1
          if (-not $inst) { throw "T6: 설치된 cysd.exe 미발견" }
          $dir = $inst.Directory.FullName
          $py  = Join-Path $dir 'runtime\python\python3.exe'
          $pth = Join-Path $dir 'runtime\python\python312._pth'
          if (-not (Test-Path $py))  { throw "T6: 동봉 python3.exe 미발견: $py" }
          # ★전제 확인: `._pth` 가 없으면 이 런타임은 embeddable 이 아니고, 그러면 이 스텝의 초록은
          #   '문제 조건에서 통과했다'는 증거가 되지 못한다(fail-closed).
          if (-not (Test-Path $pth)) { throw "T6: python312._pth 미발견 — embeddable 전제 붕괴: $pth" }
          Write-Host "py=$py"; Write-Host "pth=$pth"; Get-Content $pth

          # ── 음성 대조: 이 런타임이 정말 '스크립트 폴더를 sys.path 에 넣지 않는다'를 먼저 증명한다.
          #    ★판정은 **전용 종료코드**로 한다(리뷰어2 REVISE/MAJOR). 단순히 "exit≠0 이면 정상"으로
          #      보면 경로 오타·DLL 부재·인자 오류처럼 **형제 모듈과 무관한 실패까지 정상**으로 읽혀
          #      음성 대조가 무력화된다. 실패의 **이유**까지 프로브 안에서 확정한다:
          #        0  = 형제 import 성공 → 결함 전제 붕괴(throw)
          #        42 = probe_sib 를 못 찾음 → 기대한 그 조건(정상)
          #        그 외 = 프로브 자체가 깨짐(throw) — 조용한 통과 금지
          #    ⚠stderr 를 변수로 캡처하지 마라($ErrorActionPreference='Stop' + 2>&1 은 네이티브
          #      명령에서 NativeCommandError 를 던진다). 종료코드만 본다 — 그래서 파싱도 불필요하다.
          $probe = Join-Path $env:RUNNER_TEMP 'guard_probe'
          Remove-Item -Recurse -Force $probe -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Set-Content -Path (Join-Path $probe 'probe_sib.py') -Encoding utf8 -Value 'VALUE = 1'
          Set-Content -Path (Join-Path $probe 'probe_main.py') -Encoding utf8 -Value @(
            "import sys",
            "try:",
            "    import probe_sib",
            "except ModuleNotFoundError as e:",
            "    sys.exit(42 if getattr(e, 'name', '') == 'probe_sib' else 43)",
            "sys.exit(0)"
          )
          & $py (Join-Path $probe 'probe_main.py')
          $probeCode = $LASTEXITCODE
          Write-Host "음성 대조 exit=$probeCode (42 여야 정상 — probe_sib 를 못 찾아야 한다)"
          if ($probeCode -eq 0) {
            throw "T6 전제 붕괴: 동봉 런타임이 스크립트 폴더를 sys.path 에 넣었다 — 가드의 근거였던 조건이 사라졌다. ._pth 변경 여부를 확인하고 기획서(docs/plans/2026-07-29-win-two-defects-plan.md)를 갱신하라."
          }
          if ($probeCode -ne 42) {
            throw "T6 음성 대조 자체가 깨졌다 (exit=$probeCode) — 형제 모듈 부재가 아닌 다른 이유로 실패했다. 이 상태의 초록은 증거가 아니므로 중단한다(fail-closed)."
          }

          # ── 본 검증: 회귀 스위트를 그 인터프리터로 그대로 실행 ──
          $suite = Join-Path (Get-Location) 'cysjavis-pack\bin\tests\test_import_guard.py'
          if (-not (Test-Path $suite)) { throw "T6: 스위트 미발견(checkout 경로): $suite" }
          & $py $suite
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "T6: 형제 import 가드 회귀 실패 (exit=$code) — 배송 런타임에서 팩 스크립트의 형제 import 가 깨진다" }
          Write-Host "OK: T6 형제 import 가드 회귀 통과 (동봉 embeddable python312._pth 실런타임 · 음성 대조 확인)"
          exit 0
