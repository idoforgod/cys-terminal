# w44 procs: can an unelevated token read start times of system processes (wininit/csrss ...)? Tag [w44-procs].
name: w44 procs (start times, elevated vs standard user)
on:
  push:
    branches: ['diag/win11-update']
permissions:
  contents: write
jobs:
  procs:
    name: 'w44-procs (${{ matrix.os }})'
    if: ${{ contains(github.event.head_commit.message, '[w44-procs]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    env:
      DIAG_MATRIX_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: w44-procs
        shell: powershell
        continue-on-error: true
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\w44-procs.ps1"
          exit 0
      - name: publish-results
        if: always()
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job w44-procs --os ${{ matrix.os }} --out "%RUNNER_TEMP%\diag-out"
