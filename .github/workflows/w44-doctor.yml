# w44 doctor: cys.exe doctor of 0.14.44 (build artifact) vs public 0.14.43 under the same conditions. Tag [w44-doctor].
name: w44 doctor (cys doctor timeout)
on:
  push:
    branches: ['diag/win11-update']
permissions:
  contents: write
  actions: read
jobs:
  doctor:
    name: 'w44-doctor (${{ matrix.os }})'
    if: ${{ contains(github.event.head_commit.message, '[w44-doctor]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    env:
      DIAG_MATRIX_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: w44-doctor
        shell: powershell
        continue-on-error: true
        timeout-minutes: 100
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\diag\w44-doctor.ps1"
          exit 0
      - name: publish-results
        if: always()
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node diag\publish-results.mjs --job w44-doctor --os ${{ matrix.os }} --out "%RUNNER_TEMP%\diag-out"
