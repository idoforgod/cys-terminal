name: copy-drift-watch

# ── 사본 드리프트 일일 조기경보 (P0-1 · 2026-10-26 · 부서장 판정 A2) ──────────────
# ★무엇을 보는가: `main`(기본 가지) 사본과 **최신 공개 릴리스 태그** 사본이 같은지. 같은 비교를
#   `release.yml` 의 `copy-drift-gate` 가 태그 push 때 하드게이트로 한다 — 이 레인은 그보다
#   **먼저** 알려 주는 쪽이고, 둘은 ⛔로직을 복사하지 않는다(단일 출처 = `scripts/copy-drift-check.py`).
#   ★복사해 넣으면 고치려는 병을 고치는 중에 다시 만든다.
#
# ★왜 `on: push: branches: [main]` 이 아닌가(⛔A1 탈락 사유 · 실측):
#   드리프트는 **태그선이 움직일 때** 생긴다(`e5f49fbb` 2026-10-24 가 태그판에만 들어갔다).
#   그런데 `main` 은 **2026-08-14 이후 0 커밋**이다 ⇒ main push 로 발화하는 게이트는
#   ★감시 대상이 변할 때 발화하지 않는다 = **영원히 초록** = 조용한 실패.
#
# ★왜 PR 체크가 아니라 `gh issue create` 인가(실측):
#   `main` 에는 보호도 룰셋도 없다(`branches/main/protection` → HTTP 404 · `rulesets` → 0건)
#   ⇒ 필수 상태검사로 **막을 수단이 없다** ⇒ 체크로 두면 Actions 탭에서 빨간 X 로만 남아
#   아무도 보지 않을 수 있다. ⇒ 빨강을 **저장소 밖으로 내보낸다**(공개 저장소라 이슈가 보인다).
#
# ⚠이 레인은 **이빨이 없다** — 막는 것은 `release.yml` 의 하드게이트다. 이쪽은 알리는 쪽이다.
# ⚠`schedule` 은 **기본 가지의 사본으로만** 돈다 ⇒ 이 파일과 게이트 스크립트가 `main` 에 있어야
#   비로소 돈다. 그리고 저장소가 60일 무활동이면 GitHub 이 스케줄을 자동 중지한다.
# ⚠이슈는 **열기만** 한다 — 닫는 것은 사람이 한다(드리프트가 남아 있는데 자동으로 닫히면
#   그게 또 하나의 조용한 실패다).

on:
  schedule:
    - cron: '17 21 * * *'        # 매일 21:17 UTC = 06:17 KST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write                  # ★빨강을 밖으로 내보내는 데만 쓴다

concurrency:
  group: copy-drift-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ★관문 자체가 살아 있는지 먼저 본다(네트워크 불요 · 1초 미만).
      - name: Self-test the drift gate before trusting it
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/copy-drift-check.py \
            || { echo "::error::게이트 스크립트가 기본 가지에 없다 — 그것이 곧 드리프트다"; exit 1; }
          python3 scripts/copy-drift-check.py --self-test

      - name: 최신 공개 릴리스 태그 해소 (fail-closed)
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          # ⛔빈 값·null 을 「없음」으로 접지 않는다 — 재지 못한 것이다.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::최신 릴리스 태그를 재지 못했다(얻은 값: '${TAG}') — 측정 불능은 통과가 아니다"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "최신 공개 릴리스 태그 = $TAG"

      - name: 사본 드리프트 감시 (main ↔ 최신 릴리스 태그 · 내용주소 비교)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.latest.outputs.tag }}
        shell: bash
        run: |
          set -uo pipefail
          # ★이쪽은 태그라 로컬에 없다 ⇒ 같은 내용주소를 API 로 읽는다(--ref-source api).
          set +e
          python3 scripts/copy-drift-check.py \
            --repo "$GITHUB_REPOSITORY" --ref "$TAG" --ref-source api --baseline main \
            | tee /tmp/copy-drift.log
          RC="${PIPESTATUS[0]}"
          set -e
          # ⛔rc 를 보지 않고 출력만 읽지 않는다(이 저장소에서 실제로 0 을 지어낸 형태다).
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "게이트 종료코드 = $RC"
          exit 0

      - name: 빨강을 밖으로 — 열려 있는 같은 이슈가 없을 때만 1건 생성
        if: steps.check.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.latest.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="사본 드리프트: main 과 $TAG 의 발행 레인 파일이 다르다"
          MARKER="<!-- copy-drift-watch -->"
          # ★멱등 — 같은 표지가 든 열린 이슈가 있으면 더 만들지 않는다(하루 1건 스팸 방지).
          EXISTING="$(gh api "search/issues?q=repo:$GITHUB_REPOSITORY+is:issue+is:open+in:body+%22copy-drift-watch%22" \
                        --jq '.total_count')"
          echo "열려 있는 같은 이슈 = $EXISTING 건"
          if [ "$EXISTING" != "0" ]; then
            echo "이미 열려 있다 — 새로 만들지 않는다. 닫는 것은 사람이 한다."
            exit 0
          fi
          {
            echo "$MARKER"
            echo
            echo "\`copy-drift-watch\` 가 **main** 과 최신 공개 릴리스 태그 \`$TAG\` 의"
            echo "발행 레인 파일을 내용주소(blob sha)로 대조했고 **같지 않다**."
            echo
            echo '```'
            cat /tmp/copy-drift.log
            echo '```'
            echo
            echo "- 실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- 막는 것은 이 레인이 아니라 \`release.yml\` 의 \`copy-drift-gate\` 다 —"
            echo "  드리프트가 남아 있으면 **다음 태그에서 자산 생산이 멈춘다**."
            echo "- ⛔자동으로 닫지 않는다. 고친 뒤 사람이 닫아라."
          } > /tmp/issue-body.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file /tmp/issue-body.md

      - name: 종료코드 전파 (fail-closed)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RC="${{ steps.check.outputs.rc }}"
          [ "$RC" = "0" ] || { echo "::error::사본 드리프트 감시 실패(rc=$RC) — 이슈를 확인하라."; exit 1; }
          echo "✅ 드리프트 없음"
