# w44 unit lane: the Windows unit specimens that the product's own Windows lanes do NOT cover for 0.14.44 (design 5-4 items 8 and 9 and
# the pack specimens of the hook / the bridge script), run on the product commit under test. windows-latest = x64.
# Tag: [w44-ci] in the commit message. Output: results branch diag-results/<run>-<attempt>-w44-unit-windows-latest.
name: w44 unit (product 4544eb3f)

on:
  push:
    branches: ['diag/win11-update']

permissions:
  contents: write

jobs:
  unit:
    name: 'w44-unit (windows-latest, ${{ matrix.label }})'
    if: ${{ contains(github.event.head_commit.message, '[w44-ci]') || contains(github.event.head_commit.message, '[w44-ub]') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'v0.14.44-candidate'
            ref: 4544eb3f095987eec24bc31de63b4a4e123f36c3
          - label: 'baseline-v0.14.43'
            ref: 55d3d2d60d7fa9d044135976c236d6abb6088081
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: p
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: unit specimens (full logs kept)
        shell: bash
        working-directory: p
        run: |
          set +e
          OUT="${RUNNER_TEMP}/diag-out"
          mkdir -p "$OUT"
          SUM="$OUT/w44-unit-summary.txt"
          : > "$SUM"
          {
            echo "== runner =="; echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?} RUNNER_ARCH=${RUNNER_ARCH:-?}"
            rustc -Vv; cargo -V; python --version; bash --version | head -1; git --version
            echo "product: $(git log -1 --format='%H %s')"
          } > "$OUT/w44-unit-env.txt" 2>&1
          run_cargo() {
            # $1 = label, rest = cargo args before --, then -- args via ARGS_AFTER
            local label="$1"; shift
            local log="$OUT/w44-unit-$label.log"
            echo "### cargo test $*" > "$log"
            CYS_PACK_DIR="$(mktemp -d)" cargo test "$@" 2>&1 | tee -a "$log" | tail -n 5
            local rc="${PIPESTATUS[0]}"
            echo "$label rc=$rc :: cargo test $*" >> "$SUM"
            grep -E '^test result:|^running [0-9]+ tests' "$log" | tail -n 4 >> "$SUM"
          }
          # the test lists first (names + counts), then the runs
          CYS_PACK_DIR="$(mktemp -d)" cargo test --lib is_dept_socket -- --list > "$OUT/w44-unit-list-lib-is_dept_socket.txt" 2>&1
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cysd -- --list > "$OUT/w44-unit-list-cysd-all.txt" 2>&1
          run_cargo lib-is_dept_socket --lib is_dept_socket -- --test-threads=1 --nocapture
          run_cargo lib-bridge-probe --lib bridge_probe -- --test-threads=1 --nocapture
          run_cargo cysd-office_bridge --bin cysd office_bridge:: -- --test-threads=1 --nocapture
          run_cargo cysd-knobs --bin cysd knobs:: -- --test-threads=1 --nocapture
          run_cargo cysd-approval --bin cysd approval -- --test-threads=1 --nocapture
          run_cargo cys-approval --bin cys approval -- --test-threads=1 --nocapture
          # the same with a bigger test-thread stack: tells a stack-only abort from a logic failure
          RUST_MIN_STACK=33554432 run_cargo cys-approval-bigstack --bin cys approval -- --test-threads=1 --nocapture
          run_cargo lib-all-approval --lib approval -- --test-threads=1 --nocapture
          # pack specimens on Windows: the gate hook (shell) and the bridge script
          for pat in 'test_capgate_hook_shell.py' 'test_hud_bridge*.py' 'test_hud_detail_v11.py'; do
            log="$OUT/w44-unit-py-${pat%%.*}.log"
            python -m unittest discover -s cysjavis-pack/bin/tests -p "$pat" -v > "$log" 2>&1
            echo "py:$pat rc=$?" >> "$SUM"; tail -n 4 "$log" >> "$SUM"
          done
          cat "$SUM"
          exit 0

      - name: publish-results
        if: always()
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node d\diag\publish-results.mjs --job w44-unit-${{ matrix.label }} --os windows-latest --out "%RUNNER_TEMP%\diag-out"

      - name: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-w44-unit-${{ matrix.label }}
          path: ${{ runner.temp }}\diag-out
          if-no-files-found: warn
          retention-days: 14
