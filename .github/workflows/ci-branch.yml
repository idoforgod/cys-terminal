name: ci-branch

# 브랜치 푸시 기계검증. 태그·릴리스 트리거 없음(feat/** push 전용).
# 릴리스 게이트(release.yml)와 별개 — 이건 브랜치 개발 중 회귀를 조기에 잡는 가벼운 CI다.
#
# ⚠백포트 유래(0.14.2 레인 · 2026-07-29). 이 파일은 v0.13.18 레인의 `ci-branch.yml` 에서
#   **선언 기반 상태 아키텍처 관련 두 덩어리만** 옮겨 온 것이다:
#     ①팩 스위트 레인 대조(3레인 목록 드리프트 차단)  ②게이트 대장·파리티·유령집계 회귀 잡
#   원 레인의 나머지 스텝(bundle-prep·cargo check --workspace·능력 파리티 7종·C03 전핀·
#   bun UI 잡·Windows 잡)은 이 브랜치의 범위가 아니어서 **의도적으로 가져오지 않았다**.
#   그것들을 나중에 편입할 때는 아래 레인 대조 게이트의 ALLOWED 도 함께 갱신해야 한다.
# ★W8(2026-08-16 · v4-repair): 이 레인에 세 가지를 추가했다 —
#   ①신설 팩 스위트 3종(부서 이름검증·C03 상태기계·핀 패리티)을 3완전 레인 **동시** 등재
#     (대칭 = 정본 · ALLOWED 등재 불요 — 2026-08-12 부트체인 편입과 같은 형태)
#   ②CEO_TEMPLATE 재합성 드리프트 게이트(gen --check · release.yml 최종 차단선의 조기 경보)
#   ③`cargo test --bin cys` 리허설(A10 — 릴리스 레인 직행 금지·1사이클 green 후 승격).

on:
  push:
    # ★fix/** 편입(2026-09-04 · 부트 v2 D4 master 판정). 종전엔 feat/** 뿐이라 수리 레인
    #   (fix/0.14.30-*)의 커밋이 **어느 CI 레인에서도 돌지 않았다** — 이 레인 자신이 잡으라고
    #   만들어진 '브랜치 초록의 조기 경보'가 정작 수리 브랜치에 무발화였다는 뜻이다.
    #   릴리스 직전 수리가 태그 레인(20분)에서야 검증되는 것을 막는다. 태그·발행 트리거는
    #   여전히 없다(이 파일은 push 전용 경량 CI).
    branches: ['feat/**', 'fix/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # 잡1 — macOS: 레인 목록 대조 + 선언/유령집계 팩 스위트 회귀.
  macos-rust-pack:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ★팩 스위트 레인 대조(S31 · 2026-07-26 / **3레인 확장 W19 · 같은 날**). **이 스텝이 왜
      #   존재하는가**: 브랜치 레인(ci-branch.yml)·태그 레인(release.yml)·팩-only 레인
      #   (pack-release.yml)의 팩 테스트 목록이 갈리는 것을 **사람이 눈으로 대조하는 방식은 이미
      #   세 번 실패했다** —
      #     · C-1: 브랜치에만 있고 릴리스에 없음 → 태그에서 검증 공백
      #     · R4: 릴리스에만 있고 브랜치에 없음(test_todo_stamp) → 브랜치 초록이 거짓 신호,
      #           회귀가 20분짜리 태그 런에서야 발견
      #     · C-1 세 번째 문: 위 둘을 맞추고 "닫혔다"고 적었으나 **pack-release.yml 은 애초에 대조
      #           대상이 아니었다**. 그 레인이 pack.tar.gz 를 만들고 pack-manifest.json 을 minisign
      #           서명하는 실제 배송 경로인데, 배송되는 Python 파서가 파리티 0회로 봉인되고 있었다.
      #           (S26 = min_binary 하한을 release.yml 에만 고치고 pack-release.yml 을 방치한 사고와
      #            **같은 계급**. 이 리포가 반복해 당하는 형태는 언제나 '레인 하나를 빼먹음'이다.)
      #   세 방향 모두 "목록이 여러 파일에 손으로 복제돼 있다"는 같은 원인이다. 리뷰·주석으로는 못
      #   막고, **모든 레인 파일에서 이름 집합을 뽑아 전 쌍을 대조하는 기계**만이 막는다. 그 기계가
      #   이 스텝이다. 2레인 대조는 이 결함을 구조적으로 볼 수 없었다 — 세 번째 파일이 입력에
      #   없었기 때문이다.
      # 위치 근거: checkout 직후 = Rust/Bun 셋업(수 분) 앞. 비대칭은 1초 안에 알 수 있어야 한다.
      #
      # ⚠**정직한 한계 — 이 게이트가 못 보는 것**(과신 금지):
      #   1) 추출은 **주석을 제거한 뒤의 정규식 `test_[a-z0-9_]+`** 이다. 즉 **텍스트 존재**를 볼 뿐
      #      "그 스위트가 실제로 실행되는가"는 모른다. 이름이 실행되지 않는 자리(변수 기본값, 죽은
      #      분기, `[ -f ]` 존재검사만)에 적혀 있어도 '있음'으로 센다.
      #   2) **파일 단위 합집합** 비교다. 잡·OS 단위가 아니다 — 예컨대 ci-branch 의 Windows 잡에만
      #      있고 macOS 잡에 없는 스위트도 '있음'으로 통과한다(Windows 제외 목록은 의도된 설계라
      #      이 입도를 택했다). 잡별 대조가 필요해지면 이 스크립트를 확장해야 한다.
      #   3) **동적 생성·글롭은 못 편다**. `test_phoenix_*.py` 는 토큰 `test_phoenix_` 하나로 잡히고,
      #      셸 변수로 조립되는 이름은 아예 안 보인다.
      #   4) 주석 제거는 `#` 이후를 자르는 단순 방식이라, 문자열 안의 `#` 이 있으면 과다 절단된다
      #      (현재 세 파일에는 해당 사례 없음 — 생기면 이 게이트가 이름을 놓칠 수 있다).
      #   5) **이 스텝 자신은 스캔에서 제외된다**(SELF-BEGIN/END 표식). 아래 ALLOWED 의 이름들이
      #      ci-branch.yml 의 '코드'이기도 해서, 제외하지 않으면 게이트가 **자기 allowlist 를 읽고**
      #      그 이름을 "ci-branch 에 있음"으로 오판한다(실측 — 초안이 이 함정에 그대로 빠졌다).
      #      대가: 이 스텝 안에서만 언급되는 스위트는 어느 집합에도 안 잡힌다(의도된 맞교환).
      #   6) **완전 레인 목록은 아래 LANES 에 하드코딩된 3종이 전부다**(W19 추가). 팩 테스트를 돌리는
      #      네 번째 워크플로우가 생겨도 등재하기 전까지 그 레인은 대조 밖에 있다 —
      #      이번 결함(pack-release.yml 미편입)의 재발 경로가 정확히 이것이다. 새 워크플로우가
      #      `cysjavis-pack/bin/tests/` 를 실행하기 시작하면 **여기 먼저 등재하라**.
      #      ★2026-07-29 리뷰어1 R2 반영: windows-build.yml 이 정확히 그 사각이었다(팩 스위트를
      #      돌리는데 LANES 밖). 다만 그 레인은 **전 스위트를 돌리는 레인이 아니라** 동봉
      #      embeddable 런타임 전용 부분 레인이라, 동급 LANES 에 넣으면 나머지 스위트가 전부
      #      비대칭으로 잡혀 ALLOWED 가 근거 없는 목록으로 썩는다. 그래서 아래 SUBSET_LANES 라는
      #      **방향성 있는 약한 계약**으로 편입한다(⊆ 검사 + 필수 보유 검사). 완전 레인이 아닌
      #      워크플로우는 앞으로도 이쪽에 등재하라.
      #   요약: 이건 **복제된 목록의 드리프트 조기 경보**이지 커버리지 증명이 아니다.
      # LANE-GATE-SELF-BEGIN
      - name: 팩 스위트 레인 대조 (ci-branch ⇔ release ⇔ pack-release 드리프트 차단 + windows-build 부분 레인 계약)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys

          # 팩 테스트를 실행하는 **모든** 레인. 여기 없는 워크플로우는 대조 밖이다(한계 6).
          LANES = {
              "ci-branch":    ".github/workflows/ci-branch.yml",
              "release":      ".github/workflows/release.yml",
              "pack-release": ".github/workflows/pack-release.yml",
          }

          # 부분 레인 — 팩 스위트를 **일부만** 돌리는 워크플로우. 완전 레인과 목록을 맞출 의무는
          # 없지만 대조 밖에 두지도 않는다. 계약 두 줄:
          #   ⊆ : 여기서 돌리는 스위트는 완전 레인에도 있어야 한다(여기서만 도는 고아 스위트 차단).
          #   ⊇ : REQUIRED 는 반드시 보유해야 한다(그 레인에서만 성립하는 검증의 조용한 제거 차단).
          # 값 = (경로, 반드시 보유해야 할 스위트 집합, 그 레인이 유일하게 증명하는 것).
          SUBSET_LANES = {
              "windows-build": (
                  ".github/workflows/windows-build.yml",
                  {"test_import_guard"},
                  "동봉 embeddable 파이썬(python312._pth)에서의 실행. 3완전 레인은 전부 "
                  "macOS/ubuntu 잡이라 D1(형제 import 실패)의 **실제 런타임에서는 0회 실행**된다 — "
                  "그 레인의 재현은 runpy 모사다. 여기서 빠지면 D1 회귀는 다시 무증상으로 산다.",
              ),
          }

          # 레인별 "빠지면 무엇이 거짓말이 되는가" — 에러 메시지에 붙여 편입 방향을 지시한다.
          HINT = {
              "ci-branch":    "브랜치 초록이 거짓 신호가 된다(R4 계급)",
              "release":      "태그 레인에 검증 공백이 생긴다(C-1 계급)",
              "pack-release": "배송 팩이 검증 0회로 tar·서명·봉인된다(C-1 세 번째 문 계급)",
          }

          # 의도된 비대칭만 여기 등재한다. 값 = (**있어야 하는 레인 집합**, 이유).
          # **이유 없는 등재 금지** — 등재는 "왜 일부 레인에만 있어도 되는가"를 다음 사람에게 설명하는
          # 자리다. 새 비대칭을 만들려면 여기에 근거를 적어야 하고, 그 마찰이 이 게이트의 목적이다
          # (조용한 드리프트 → 명시적 결정으로 전환). ★"팩 레인이라 생략"은 이유가 아니다 —
          # 그 스위트가 팩 배송과 **왜** 무관한지, 무관하지 않다면 무엇이 막고 있는지를 적어라.
          ALLOWED = {
              "test_phoenix_": (
                  {"release"},
                  "release 전용(`test_phoenix_*.py` 글롭 · 실측 13종 · 2026-07-29). "
                  "**팩 배송과 무관해서가 아니다** — 대상 javis_phoenix.py 는 팩에 실려 나간다. "
                  "실제 이유는 하네스 의존이다: release.yml build 잡은 `cargo build --bin cys "
                  "--bin cysd` 로 실 데몬을 만들고 PHOENIX_HARNESS_CYSD 로 kill→재기동 host-level "
                  "e2e 를 돌린다. 팩-only 레인은 manifest emit 용 `cys` 만 빌드해 cysd 가 없고, "
                  "ci-branch 는 그 예산(수 분)을 안 쓴다. 13종 중 cysd 를 실제로 요구하는 것은 3종"
                  "(c6_reap·e2e_replacement·w2_untomb_fullcycle)뿐이라 나머지는 원리상 이식 "
                  "가능하다 — 즉 이것은 **잔여 격차**이지 정당한 무관함이 아니다. 팩 레인 예산이 "
                  "허용되면 밀폐 부분집합부터 편입하라. 글롭이라 토큰이 접두사로만 잡힌다.",
              ),
              "test_verify_win_crt": (
                  {"ci-branch", "release"},
                  "scripts/tests/ 스위트(팩 스위트 아님 · R1-repair 2026-08-29 편입 — 그 전에는 "
                  "0레인 실행이었다). 대상 scripts/verify_win_crt.py 는 배송 팩 tar 에 실리지 "
                  "않고, 소비 지점은 release.yml Windows 레그의 업로드 전 CRT 게이트뿐이다(실측 "
                  "grep: release.yml 단독). 이것은 **팩 배송과 실제로 무관한** 드문 경우다 — "
                  "pack-release 는 팩만 서명·배송하며 이 도구를 실행할 일도 실을 일도 없어, "
                  "편입하면 오히려 근거 없는 목록이 된다(이 게이트 자신의 규율). "
                  "ci-branch = 브랜치 조기 경보 · release = 소비 직전 도구 증명의 2레인 편입.",
              ),
          }
          # (2026-08-12 편입 완료: test_bootstrap_chain 을 3레인 전부에 배선 — 위계 폴백의 유일
          #  회귀 핀 세트가 CI 0회 실행이던 격차를 봉합. ALLOWED 예외도 함께 제거 — 대칭이 정본.)

          # 이 게이트 스텝 자신을 스캔에서 도려내는 표식(한계 5). 없으면 위 ALLOWED 의 이름들이
          # ci-branch.yml 의 코드로 읽혀 자기 자신을 근거로 "있음" 판정하는 자기참조 오판이 난다.
          SELF_BEGIN, SELF_END = "LANE-GATE-SELF-BEGIN", "LANE-GATE-SELF-END"

          def names(path):
              try:
                  raw = open(path, encoding="utf-8").read().splitlines()
              except OSError as e:
                  print(f"::error::레인 파일을 읽지 못함: {path} ({e})", file=sys.stderr)
                  sys.exit(1)
              found, skipping = set(), False
              for line in raw:
                  # 표식 판정은 **주석 제거 전에** 한다(표식 자체가 주석이라 지우면 안 보인다).
                  if SELF_BEGIN in line:
                      skipping = True
                      continue
                  if SELF_END in line:
                      skipping = False
                      continue
                  if skipping:
                      continue
                  line = re.sub(r"#.*$", "", line)      # 주석 제거(한계 4 참조)
                  found |= set(re.findall(r"\btest_[a-z0-9_]+", line))
              # 표식이 열린 채 끝났다면 파일 뒷부분이 통째로 스캔에서 빠진 것이다 — 그 상태의
              # "차이 없음"은 근거가 아니다(END 를 지우면 게이트가 조용히 눈을 감는 실패 경로).
              if skipping:
                  print(f"::error::{path}: {SELF_BEGIN} 이후 {SELF_END} 가 없다 — 파일 뒷부분이 "
                        f"스캔에서 누락된다. 표식을 복구하라(fail-closed).", file=sys.stderr)
                  sys.exit(1)
              # 측정 실패는 조용한 통과가 아니라 중단이다 — 0건이면 정규식·파일 구조가 바뀐 것이고,
              # 그 상태의 "차이 없음"은 게이트가 아니라 껍데기다.
              if not found:
                  print(f"::error::{path} 에서 팩 테스트 이름을 0건 추출 — 추출기 파손 의심. "
                        f"비교 불가로 중단한다(fail-closed).", file=sys.stderr)
                  sys.exit(1)
              return found

          ALL = set(LANES)
          sets = {lane: names(path) for lane, path in LANES.items()}
          union = set().union(*sets.values())
          # 각 이름이 실제로 존재하는 레인 집합. 이 집합이 ALL 이 아니면 **어느 한 쌍 이상이 비대칭**
          # 이라는 뜻이다(3레인 전 쌍 대조를 집합 하나로 환원 — 쌍을 빠뜨릴 여지를 없앤다).
          where = {n: frozenset(l for l in ALL if n in sets[l]) for n in union}

          print("[레인 대조] " + " · ".join(f"{l}={len(sets[l])}종" for l in sorted(ALL))
                + f" · 3레인 공통={len(set.intersection(*sets.values()))}종"
                + f" · 허용 비대칭={len(ALLOWED)}종")

          # 불필요해진 허용 항목은 실패가 아니라 경고 — 전 레인에 편입해 해소된 정상 상태이므로 막을
          # 이유가 없다. 다만 방치하면 allowlist 가 근거 없는 목록으로 썩으므로 눈에 띄게 남긴다.
          for n, (exp, why) in ALLOWED.items():
              here = where.get(n, frozenset())
              if here == ALL:
                  print(f"::warning::허용 비대칭 '{n}' 이 이제 전 레인에 있다 — "
                        f"ALLOWED 에서 제거하라(사유였던 것: {why})")
              elif not here and exp:
                  print(f"::warning::허용 비대칭 '{n}' 이 어느 레인에도 없다 — "
                        f"스위트가 삭제됐다면 ALLOWED 에서도 제거하라")

          drift, stale = [], []
          for n in sorted(union):
              here = where[n]
              if here == ALL:
                  continue                      # 전 레인 보유 = 대칭
              if n in ALLOWED:
                  exp, _why = ALLOWED[n]
                  if here == frozenset(exp):
                      continue                  # 등재된 형태와 실제가 일치 = 의도된 비대칭
                  stale.append((n, here, frozenset(exp)))   # 등재는 됐으나 형태가 달라짐
                  continue
              drift.append((n, here))

          # 이름이 등장하는 **스텝 자체가 조건부인지** 본다. 이 게이트는 텍스트만 읽으므로
          # `if: false` 로 스텝을 죽여도 이름은 그대로 남아 초록을 유지한다(리뷰어2 실증).
          # 필수 스위트는 무조건 실행돼야 하므로, 그 스텝에 step-level `if:` 가 있으면 실패시킨다.
          #
          # ★스텝 경계는 `- name:` 이 아니라 **`steps:` 블록의 리스트 항목**으로 잡는다.
          #   `name` 은 GitHub Actions 에서 **필수가 아니고** 키 순서도 자유다 — 초안은 `- name:` 을
          #   스텝 머리로 가정해 `- shell: pwsh` 로 시작하는 스텝과 `- if: false` 가 첫 줄인 스텝을
          #   놓쳤다(리뷰어2 2차 실증: 두 경우 모두 게이트가 exit 0 으로 오탐).
          # ★2026-07-30 R2 보강 — **파서가 모르는 구조를 조용히 통과시키지 않는다**. 위 수리 뒤에도
          #   4케이스 단위 실행(신구 대조)에서 두 구멍이 실측됐다:
          #     G1 **잡 수준 `if:`** — 스텝이 무조건이어도 **잡 전체**가 꺼지면 스위트는 0회 실행된다.
          #        스텝만 보던 판정은 이걸 조건 0건(초록)으로 통과시켰다. 이 게이트가 증명하려는
          #        명제는 "그 스텝에 if 가 없다"가 아니라 "**그 스위트가 무조건 돈다**"이므로,
          #        잡 수준 조건은 같은 명제를 무너뜨리는 동급 사건이다.
          #     G2 **`-` 단독 머리**(키가 다음 줄 · 합법 YAML)와 첫 머리와 **들여쓰기가 다른** 리스트
          #        항목 — 머리 정규식 `-(\s+)\S` 가 못 잡아 그 스텝이 **앞 스텝 범위로 병합**된다.
          #        병합은 지금 우연히 과탐 쪽으로 틀렸을 뿐, 조건의 **귀속이 틀린** 것은 그대로다.
          #        배치가 한 칸만 달라지면 반대 방향(미탐)으로 뒤집힌다.
          #   처방은 이 파일의 다른 게이트들과 같은 교리다 — **판정 불가는 통과가 아니라 중단**
          #   (`names()` 의 0건 추출 fail-closed 와 동형). 드리프트·계약 위반(exit 1)과 구분되게
          #   **전용 종료코드 3**을 쓴다: 전자는 "워크플로를 고쳐라", 후자는 "**이 파서를 고쳐라**"라
          #   수신자와 조치가 다르고, 섞이면 파서 파손이 워크플로 결함으로 오진된다.
          EXIT_STRUCT = 3       # 워크플로 구조 판별 실패 (≠1 계약 위반 · ≠0 통과)

          def _struct_fail(path, lineno, why):
              print(f"::error::{path}:{lineno}: 스텝 구조를 판별할 수 없다 — {why}. 이 게이트는 "
                    f"'필수 스위트가 무조건 실행되는가'를 텍스트로 증명하는데, 구조를 못 읽으면 그 "
                    f"증명이 성립하지 않는다. 조용한 통과 대신 중단한다"
                    f"(fail-closed · exit {EXIT_STRUCT} = 워크플로가 아니라 이 파서를 고치라는 신호).",
                    file=sys.stderr)
              sys.exit(EXIT_STRUCT)

          def _job_conditions(lines, steps_line, base):
              """`steps:` 를 품은 **잡 자체**의 `if:` 목록 (G1).

              잡 머리 = `steps:` 보다 얕은 첫 윗줄. 잡 수준 키 = 그 아래에서 들여쓰기가 정확히
              `base` 인 **비-리스트** 줄(더 깊은 건 중첩 키, `-` 로 시작하면 스텝 머리다).
              """
              head = head_ind = None
              for k in range(steps_line - 1, -1, -1):
                  s = lines[k]
                  if not s.strip() or s.lstrip().startswith("#"):
                      continue
                  ind = len(s) - len(s.lstrip())
                  if ind < base:
                      head, head_ind = k, ind
                      break
              if head is None:
                  return []
              out = []
              for k in range(head + 1, len(lines)):
                  s = lines[k]
                  if not s.strip() or s.lstrip().startswith("#"):
                      continue
                  ind = len(s) - len(s.lstrip())
                  if ind <= head_ind:
                      break                                  # 잡 종료
                  if ind != base or s.lstrip().startswith("-"):
                      continue
                  m = re.match(r"^\s{%d}if:\s*(.+)$" % base, s)
                  if m:
                      out.append("잡 수준 " + m.group(1).strip())
              return out

          def _step_ranges(lines, path):
              """[(시작줄, 끝줄, 스텝머리 들여쓰기, 키 들여쓰기, 잡수준조건)] — `steps:` 아래 리스트 항목만."""
              out, i, n = [], 0, len(lines)
              while i < n:
                  m = re.match(r"^(\s*)steps:\s*(#.*)?$", lines[i])
                  if not m:
                      i += 1
                      continue
                  base, j, step_indent, heads = len(m.group(1)), i + 1, None, []
                  job_conds = _job_conditions(lines, i, base)
                  while j < n:
                      line = lines[j]
                      if line.strip() and not line.lstrip().startswith("#"):
                          ind = len(line) - len(line.lstrip())
                          if ind <= base and not line.lstrip().startswith("-"):
                              break                      # steps: 블록 종료
                          hm = re.match(r"^(\s*)-(\s+)\S", line)
                          if hm:
                              ind2 = len(hm.group(1))
                              if step_indent is None:
                                  step_indent = ind2
                              if ind2 == step_indent:
                                  heads.append((j, ind2 + 1 + len(hm.group(2))))
                              elif ind2 < step_indent:
                                  _struct_fail(path, j + 1, "리스트 항목의 들여쓰기가 첫 스텝 머리"
                                               f"({step_indent}칸)보다 얕다({ind2}칸) — 어느 것이 "
                                               "스텝 경계인지 정할 수 없다")
                          elif re.match(r"^\s*-\s*$", line) and (step_indent is None
                                                                 or ind <= step_indent):
                              _struct_fail(path, j + 1, "`-` 단독 리스트 항목(키가 다음 줄) — "
                                           "스텝 머리를 못 잡아 이 스텝이 앞 스텝 범위로 병합되고 "
                                           "조건의 귀속이 틀어진다. 키를 `- ` 뒤 같은 줄에 두어라")
                      j += 1
                  for k, (h, key_indent) in enumerate(heads):
                      end = heads[k + 1][0] if k + 1 < len(heads) else j
                      out.append((h, end, step_indent, key_indent, job_conds))
                  i = j
              return out

          def step_conditions(path, token):
              lines = open(path, encoding="utf-8").read().splitlines()
              ranges = _step_ranges(lines, path)
              found = []
              for i, raw in enumerate(lines):
                  if token not in re.sub(r"#.*$", "", raw):
                      continue
                  for start, end, step_indent, key_indent, job_conds in ranges:
                      if not (start <= i < end):
                          continue
                      found.extend(job_conds)      # 잡이 꺼지면 스텝 조건이 무엇이든 안 돈다(G1)
                      for j in range(start, end):
                          # 머리 첫 줄의 `- if:` 와 본문의 `if:` 를 모두 본다(키 순서 자유)
                          m = re.match(r"^\s{%d}-\s+if:\s*(.+)$" % step_indent, lines[j]) or \
                              re.match(r"^\s{%d}if:\s*(.+)$" % key_indent, lines[j])
                          if m:
                              found.append(m.group(1).strip())
                      break
                  else:
                      # 스텝 경계를 못 잡았다 = 파서가 이 파일 구조를 모른다 → 조용한 통과 금지
                      _struct_fail(path, i + 1, f"'{token}' 이 등장하는 줄이 어느 스텝 범위에도 "
                                   "속하지 않는다(`steps:` 블록 미인식 · 플로우 스타일 등)")
              return found

          # ── 부분 레인 계약 검사 (⊆ · ⊇ · 무조건 실행) ──
          sub_err = []
          for lane, (path, required, why) in SUBSET_LANES.items():
              have = names(path)          # names() 는 0건 추출 시 자체적으로 fail-closed 한다
              for n in sorted(required - have):
                  sub_err.append(f"{lane}: 필수 스위트 '{n}' 이 {path} 에서 사라졌다 — {why}")
              for n in sorted(required & have):
                  for cond in step_conditions(path, n):
                      sub_err.append(f"{lane}: 필수 스위트 '{n}' 의 스텝이 조건부다(`if: {cond}`) — "
                                     f"이 게이트는 텍스트만 읽어 스텝이 실제로 도는지 모른다. "
                                     f"조건을 걷어내 무조건 실행되게 하거나, SUBSET_LANES 의 계약을 "
                                     f"바꿔라(그 경우 {why} 가 더 이상 보장되지 않는다는 뜻이다)")
              for n in sorted(have - union):
                  sub_err.append(f"{lane}: '{n}' 이 이 부분 레인에만 있다 — 완전 레인 "
                                 f"({', '.join(sorted(ALL))}) 에도 편입하거나, 여기서 빼라. "
                                 f"한 레인에서만 도는 스위트는 나머지 레인의 초록을 거짓으로 만든다")
              print(f"[부분 레인] {lane}={len(have)}종 · 필수 보유 {len(required & have)}/{len(required)}")

          if sub_err:
              print("::error::부분 레인 계약 위반 — 레인 대조 밖으로 새는 스위트가 있다.", file=sys.stderr)
              for m in sub_err:
                  print(f"::error::  {m}", file=sys.stderr)
              sys.exit(1)

          if drift or stale:
              print("::error::팩 테스트 스위트가 레인 사이에서 갈렸다 — 어느 한 레인의 초록이 "
                    "거짓 신호가 된다.", file=sys.stderr)
              for n, here in drift:
                  for miss in sorted(ALL - here):
                      print(f"::error::  {n}: {LANES[miss]} 에 없음(있는 레인: "
                            f"{', '.join(sorted(here))}) → 그 파일에 편입하라 · {HINT[miss]}",
                            file=sys.stderr)
              for n, here, exp in stale:
                  print(f"::error::  {n}: ALLOWED 등재 형태({', '.join(sorted(exp)) or '없음'})와 실제"
                        f"({', '.join(sorted(here)) or '없음'})가 다르다 — 비대칭의 모양이 바뀌었다. "
                        f"편입하거나 ALLOWED 의 레인 집합·이유를 갱신하라.", file=sys.stderr)
              print("::error::의도된 비대칭이라면 이 스텝의 ALLOWED 에 **레인 집합과 이유를 함께** "
                    "등재하라('팩 레인이라 생략'은 이유가 아니다).", file=sys.stderr)
              sys.exit(1)

          print("[레인 대조] 비대칭 0 — 3완전 레인 목록 일치(허용 항목 제외) · 부분 레인 계약 충족")
          PY
      # LANE-GATE-SELF-END

      # 2언어 파리티 하네스가 rustc 를 단독 호출한다(크레이트 의존 0 불변식의 기계 증명).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # rustc 단독 컴파일(파리티 덤퍼)엔 캐시가 불요하지만, 말미의 `cargo test --bin cys` 리허설
      # (W8)은 전체 의존 그래프를 빌드한다 — release.yml 관례(swatinem)와 동형으로 캐시를 건다.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ci-branch

      # 게이트 대장 회귀 65종(javis_report_gate + javis_gate_check). v0.13.17 까지 이 스위트는
      # CI 에도 릴리스 게이트 문서에도 편입돼 있지 않았다(실측) — 게이트 코어를 고치면서 자동
      # 검증이 전무했다는 뜻이라 여기서 편입한다. 파리티 목록과 동형으로 파일 존재도 게이트한다.
      #
      # ★flake 게이트(N=5): 같은 입력에 판정이 흔들리는 스위트는 초록도 빨강도 근거가 못 된다.
      #   실측 사고 — C71GateGuardBehavior 가 **수정 전 baseline 에서 6회 중 3회 실패**했고, 그
      #   위양성 때문에 멀쩡한 수정을 "테스트를 깼다"고 되돌릴 뻔했다. 5회 돌려 exit code 가
      #   하나라도 다르면 잡을 실패시킨다.
      # ⚠정직한 한계 — 이건 값싼 조기 경보이지 보증이 아니다. 1회 실패확률 p 인 flake 를 N 회
      #   반복이 잡을 확률은 1-(p^N+(1-p)^N) 이고, N=5 에서:
      #     p=0.50 → 94% | p=0.30 → 83% | p=0.10 → 41% | p=0.05 → 23% | p=0.01 → 5%
      #   즉 저확률 flake 는 그냥 통과한다. "N=5 통과 = 결정론"으로 읽지 말 것.
      # ⚠커버리지 공백 — C71GateGuardBehavior 3종은 `~/.cys/pack` 부재 시 self-skip 이라 CI
      #   러너(팩 미설치)에서는 **실행되지 않는다**. 즉 위 실측 flake 자체는 이 레인이 못 잡는다.
      #   여기서 지키는 건 나머지 62종의 재현성이고, C71 은 로컬 팩 환경 검증 소관이다.
      # 예산: 1회 약 2.6s → 5회 약 13s (측정치).
      - name: 게이트 대장 회귀(test_report_gate) + flake 게이트 N=5 (macOS)
        shell: bash
        run: |
          set -euo pipefail
          f="cysjavis-pack/bin/tests/test_report_gate.py"
          [ -f "$f" ] || { echo "게이트 대장 테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
          log="$(mktemp)"; first=""
          for i in 1 2 3 4 5; do
            rc=0
            CYS_PACK_DIR="$(mktemp -d)" python3 "$f" >"$log" 2>&1 || rc=$?
            echo "== report-gate(mac) run $i/5: exit=$rc · $(grep -E '^(Ran |OK|FAILED)' "$log" | tr '\n' ' ')"
            [ -n "$first" ] || first="$rc"
            if [ "$rc" != "$first" ]; then
              echo "FLAKE: 반복 실행 판정 불일치(run1 exit=$first, run$i exit=$rc) — 계측기 불안정" >&2
              cat "$log" >&2; exit 1
            fi
          done
          [ "$first" = "0" ] || { echo "test_report_gate 실패(exit=$first · 5회 일관)" >&2; cat "$log" >&2; exit 1; }

      # ★선언 파서 2언어 파리티(설계 P3-4 · 리스크 K1/R1). **이 잡이 왜 존재하는가**:
      #   설계 §5-4 가 "2언어 파서 drift 는 문서로 맞추면 반드시 어긋난다"고 못 박았고, 실제로
      #   구현 첫날 Python·Rust 가 3곳에서 갈렸다(ADR-4 C-1 레거시 마커 판정 / C-2 진단 표현 /
      #   C-3 레거시 선언 표현). 리뷰·문서·주석은 이 결합을 못 막는다 — **같은 입력을 양쪽에
      #   먹여 결과를 대조하는 기계**만이 막는다. 그 기계가 이 스텝이다.
      # 대조 표면 = verdict + 언어중립 diag_code + 선언 필드(owner·scope·status·legacy).
      #   ⚠한국어 진단 **문구는 계약이 아니다**(ADR-4 C-2). 문구를 계약에 넣으면 문구를 다듬는
      #   커밋마다 이 잡이 결함을 오보한다 — 픽스처 expected.json 에도 문구를 싣지 않는다.
      # 픽스처 부재·빈 디렉터리는 **hard fail**(조용한 skip 은 파리티 CI 를 껍데기로 만든다 —
      #   위 스텝들의 `[ -f "$f" ] || exit 1` 관례와 동형). 하네스 내부에서도 재차 검사한다.
      # Rust 측은 `scripts/todo_decl_dump.rs` 를 rustc 단독 컴파일해 돌린다(파서가 크레이트
      #   의존 0 이라는 불변식의 기계 증명 — 상세는 그 파일 헤더). 러너 PATH 에 rustc 가 있다.
      # 예산: 컴파일 포함 약 1s(로컬 측정 · 조합 1024건 기준).
      - name: 선언 파서 2언어 파리티 (골든 픽스처 + 조합 1024건 · macOS)
        shell: bash
        run: |
          set -euo pipefail
          d="cysjavis-pack/bin/tests/fixtures/todo-decl"
          h="cysjavis-pack/bin/tests/parity_todo_decl.py"
          [ -d "$d" ] || { echo "골든 픽스처 디렉터리 누락: $d (계약 SOT 부재 = 실패)" >&2; exit 1; }
          [ -f "$d/expected.json" ] || { echo "계약 대장 누락: $d/expected.json" >&2; exit 1; }
          # `ls "$d"/*.md`는 0건일 때 pipefail 로 **메시지 없이** 죽는다(실측) — 이유를 못 남기는
          # 실패는 다음 사람이 원인을 다시 파야 한다. find 는 0건에서도 정상 종료한다.
          n="$(find "$d" -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')"
          [ "$n" -ge 15 ] || { echo "픽스처 케이스 부족(${n}종 · 설계 P3-1 최소 15종)" >&2; exit 1; }
          [ -f "$h" ] || { echo "파리티 하네스 누락: $h (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_decl_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_decl_dump.rs" >&2; exit 1; }
          echo "== todo-decl parity(mac): 픽스처 ${n}종 + 조합 1024건 =="
          python3 "$h" --fuzz 1024 --list-mismatch 20
          # Python 측 골든 회귀(계약 대장 해석·A2 자해 회귀 핀)도 같은 레인에서 건다.
          CYS_PACK_DIR="$(mktemp -d)" python3 cysjavis-pack/bin/tests/test_todo_decl.py

      # ★유령 todo·선언 소비자 회귀(test_report_ghost) + HUD 브리지 스큐(test_hud_bridge_skew).
      #   **이 스텝이 왜 존재하는가**: 07-26 유령 집계 사고의 수정과 그 위에 얹은 선언 모델(C1)의
      #   핵심 행동이 전부 이 두 스위트에만 있는데 CI 에는 0회 등장이었다 — 게이트 대장·파리티는
      #   각각 다른 표면을 보므로 이 둘의 회귀를 대신 잡아주지 못한다. 구체적으로 여기서만 핀되는 것:
      #     · `orphan-scope`·미선언은 `nodes[]`에 **남는다**(빼면 게이트가 false QUIET→세션 주차)
      #     · 완료 파일이 미완 파일을 shadow 하지 않는다(정본 선출 정렬키의 미완 우선)
      #     · 집계 밖 미완이 하나라도 있으면 QUIET/park 금지(구조적 불변식)
      #     · 라벨은 선언 `owner` — role 라벨공간(하이픈) 조인 키가 어긋나지 않는다
      #     · 데몬 payload 의 `verdict` 선택 필드에 대한 HUD 브리지의 구/신 스큐 내성(ADR-2)
      #   `CYS_PACK_DIR` 을 빈 임시 디렉터리로 고정하는 이유는 위 게이트 대장 스텝과 같다 —
      #   러너의 실제 팩(부재)·홈 디렉터리에 판정이 의존하면 초록이 근거가 되지 못한다.
      #     · 스탬프 도구(test_todo_stamp 30종)의 선언 스탬프 왕복 — **R4 교정(2026-07-26)으로 편입**.
      #       이 스위트는 release.yml 에만 있어서 스탬프 회귀가 브랜치에서 초록이고 태그에서 20분 뒤에야
      #       터졌다(C-1 의 역방향 비대칭). 위 '팩 스위트 레인 대조' 스텝이 이 계급을 기계로 막는다.
      # 예산: 네 스위트 합쳐 약 1s(로컬 측정 · 61+11+30종 + 공유상수).
      - name: 유령 todo·선언 소비자 회귀 + HUD 브리지 스큐 + 스탬프 (macOS)
        shell: bash
        run: |
          set -euo pipefail
          # ★W8(2026-08-16): v4-repair 스위트 3종 편입 — 부서 이름검증(`launch --help` 실사고 회귀 핀)·
          #   preflight C03 두 축 상태기계·CONTENT_PINS↔디렉티브 패리티(P0 스큐 봉인). 전부 격리
          #   HOME/목 바이너리 하네스라 러너 자기완결(라이브 무접촉) — 3완전 레인 동시 등재(대칭).
          # ★repair-w3(2026-08-29 · v0.14.28): 수리 회귀 핀 2종 편입 — test_hud_bridge_backoff
          #   (W2 replay_gap 재스폰 스톰 지수 백오프 — ★R2 라운드2에서 _reader 배선 통합 2건 추가)
          #   · test_wakeup_liveness(★R2 라운드2 신설 — _target_alive 3값 판정+drain zombie 가드
          #     행동 정본. 종전 유일 가드였던 rust substring 핀은 M8 변이에 초록이라 행동을 못
          #     지킨다 — lib.rs 역할 경계 주석) · test_preflight_c11b_seal(W3c 번들 봉인
          #   심링크 이관). 대상 javis_hud_bridge.py·javis_preflight.py 는 배송 팩 내용물인데
          #   두 핀 모두 어느 CI 레인에서도 0회 실행이었다("안 도는 검체는 게이트가 아니다" —
          #   W-CI 2026-08-21 동형 격차의 재발). 3완전 레인 동시·대칭 등재(release 는 양 루프) ·
          #   격리 스크래치 하네스(라이브 무접촉) · 실측 각 ≤0.1s.
          # ★2R-6(2026-08-31 · 0.14.29 성찰): test_preflight_c62_c68_ledger 편입 — T5 의 C62
          #   conflicted/quarantined 신설 판정·at-rest 병기와 T3 의 C68 영속 kind 기한 제외
          #   산식이 파이썬 검체 0건(무측정 변경)이던 격차 봉합. 픽스처 원장·뮤테이션
          #   양방향(PASS↔WARN) 검증 · 3완전 레인 동시·대칭 등재(release 는 양 루프) ·
          #   격리 CYS_PACK_DIR 하네스(라이브 무접촉) · 실측 0.01s.
          for t in test_report_ghost test_hud_bridge_skew test_todo_shared_constants test_todo_stamp \
                   test_import_guard test_radio test_scrub test_bootstrap_chain test_snapshot \
                   test_dept_name_guard test_preflight_c03_states test_content_pins_parity \
                   test_role_bootstrap_hook test_seat_latch_negation \
                   test_hud_bridge_backoff test_preflight_c11b_seal test_wakeup_liveness \
                   test_preflight_c62_c68_ledger; do
            f="cysjavis-pack/bin/tests/$t.py"
            [ -f "$f" ] || { echo "테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
            echo "== $t (mac) =="
            CYS_PACK_DIR="$(mktemp -d)" python3 "$f"
          done
          # ★W-CI(2026-08-21): Wave 1 부트 결정론 회귀 핀 2종 편입 — "안 도는 검체는 게이트가
          #   아니다"(리뷰어 2기 독립 적발: 두 핀 모두 어느 CI 레인에서도 0회 실행이던 격차 봉합).
          #   ① test_role_bootstrap_hook(위 루프 말미 · 실측 약 45s): 훅 _notify_bg 백그라운드
          #      파이프 해제(exec fd 분리 + cys_timeout_run 유계·send 폴백)와 ≤0.3s 정렬 창,
          #      감지기 함수+훅 통합 발화/무시 행렬의 회귀 핀. 격리 HOME·목 cys 하네스라 러너
          #      자기완결(라이브 무접촉) · 소요의 대부분은 hang 주입 케이스의 유계 대기다
          #      (내부 subprocess timeout 20~30s 가 상한 — 무한 hang 불가).
          #   ② javis_detect --self-test(아래 · 실측 0.03s): 감지기 4축 억제(neg·pre·quote·
          #      quotative)와 무구두점 후속 의문=발화 판정을 corpus 로 핀. corpus 단일 원본
          #      (tests/fixtures/detect-corpus.json) 로딩 검증 포함 — fixture 가 있는데 불량이면
          #      폴백 없이 hard fail(조용한 축소 실행 금지).
          #   3완전 레인(ci-branch·release·pack-release) 동시·대칭 등재. test_role_bootstrap_hook
          #   은 위 '팩 스위트 레인 대조' 게이트가 레인 이탈을 기계로 잡는다. self-test 는 `test_`
          #   토큰이 아니라 그 게이트의 시야 밖이다 — 대칭 유지는 3레인 동시 수정 + 이 주석이 지킨다.
          g="cysjavis-pack/bin/javis_detect.py"
          [ -f "$g" ] || { echo "감지기 누락: $g (git add 누락 의심)" >&2; exit 1; }
          echo "== javis_detect --self-test (mac) =="
          CYS_PACK_DIR="$(mktemp -d)" python3 "$g" --self-test
          # ★W-CI2(2026-08-21): Wave 2 좌석 래치 회귀 핀 test_seat_latch_negation 편입(위 루프
          #   말미 · 실측 0.007s·19케이스 · 순수 픽스처·서브프로세스 0·라이브 무접촉) — 리뷰어
          #   2기 공통 지적: 이 핀이 어느 CI 레인에서도 0회 실행이었다. 봉인 대상은 awakened_at
          #   래치 부정의 3중 AND(ⓐseat=="empty" ∧ ⓑagent_alive **명시적 false 만** ∧ ⓒ좌석
          #   나이>readiness 예산 초과)와 ★agent_alive:null(Windows master — claim-role 관측
          #   등록이 #[cfg(unix)] 라 null 영구)에서의 래치 **유지** 단언 + python↔Rust 파리티
          #   소스 핀. 낙관적 falsy 역수리가 들어오면 Windows master 래치가 매 check 무효화 →
          #   결손 오판 → node-recover 가 살아있는 입력창에 주입 → 전 pane 사망(치명 앵커 ④)
          #   재발 — 그 회귀를 여기서 잡는다. 3완전 레인 동시·대칭 등재 · `test_` 토큰이라 위
          #   '팩 스위트 레인 대조' 게이트가 레인 이탈을 기계로 잡는다.

      # ★R1-repair(2026-08-29 · v0.14.28): W4-C 가 추가한 scripts/tests/test_verify_win_crt.py 가
      #   어느 CI 레인에서도 0회 실행이었다("안 도는 검체는 게이트가 아니다" — 라운드1 지적).
      #   대상 scripts/verify_win_crt.py 는 release.yml Windows 레그의 **업로드 전 CRT 게이트**가
      #   소비하는 도구다 — 도구가 깨진 채 그 판정을 믿는 회귀를 여기(브랜치 조기 경보)와
      #   release(소비 직전 증명)에서 잡는다. 밀폐 합성 PE 픽스처·tempfile 만 사용(러너 자기완결 ·
      #   실측 0.01s). 팩 스위트가 아니므로 pack-release 미편입 — 사유는 위 레인 대조 게이트의
      #   ALLOWED("test_verify_win_crt") 등재 참조(대상이 팩 tar 에 실리지 않는다).
      - name: verify_win_crt 게이트 도구 밀폐 스위트 (macOS)
        shell: bash
        run: |
          set -euo pipefail
          f="scripts/tests/test_verify_win_crt.py"
          [ -f "$f" ] || { echo "테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
          echo "== test_verify_win_crt (mac) =="
          python3 "$f"

      # ★todo **스캔 집합** 2언어 파리티(설계 §14 S18 · W14). 위 파서 파리티와 **다른 표면**이다:
      #   그쪽은 "같은 파일을 같게 판정하는가", 여기는 "**애초에 같은 파일을 보는가**"를 묻는다.
      #   실측 결함 — 소비자 C1(Python 보고기)·C2(Rust 데몬)의 배제 정책은 이미 같았는데 데몬이
      #   **정본 위치 `${CYS_PACK_DIR}/round`를 스캔 루트에 갖고 있지 않아**, 데몬에 배선한 선언
      #   판정·유령 배제·verdict/owner payload 가 정본 todo 에는 한 번도 적용되지 않았다.
      #   정책 리뷰로는 절대 안 잡힌다 — 같은 임시 트리를 양쪽에 먹여 집합을 대조해야 잡힌다.
      # Rust 측은 `scripts/todo_scan_dump.rs` 를 rustc 단독 컴파일해 돌린다(크레이트 의존 0 증명).
      # 예산: 컴파일 포함 약 1s(로컬 측정).
      - name: todo 스캔 집합 2언어 파리티 (C1·C2 동일 파일 집합 · macOS)
        shell: bash
        run: |
          set -euo pipefail
          h="cysjavis-pack/bin/tests/parity_todo_scan.py"
          [ -f "$h" ] || { echo "스캔 파리티 하네스 누락: $h (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_scan_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_scan_dump.rs" >&2; exit 1; }
          [ -f "src/todo_scan.rs" ] || { echo "스캔 단일 구현 누락: src/todo_scan.rs" >&2; exit 1; }
          python3 "$h"

      # ★W8: CEO_TEMPLATE 재합성 드리프트 게이트(스펙 v4 §D2 · gen --check). 재합성 결과가 커밋본과
      #   달라지는 순간(수동 편집·fragment 드리프트) 브랜치에서 즉시 빨간불을 켠다 — release.yml 의
      #   같은 게이트가 최종 차단선이고 여기는 조기 경보다. --check 계약(생성기 소유=D2 티켓):
      #   ①드리프트(재합성==커밋본) ②표지 핀 구·신 템플릿 공통 실존 ③템플릿 내 bash 스니펫 실행 스모크.
      #   존재-단언은 이 리포 관례(`[ -f ] || exit 1`) — 생성기 미랜딩 상태의 초록은 거짓말이다.
      - name: CEO_TEMPLATE 재합성 드리프트 게이트 (gen --check)
        shell: bash
        run: |
          set -euo pipefail
          g="scripts/gen_ceo_template.py"
          [ -f "$g" ] || { echo "재합성 생성기 누락: $g (D2 티켓 산출물 — git add 누락 의심)" >&2; exit 1; }
          python3 "$g" --check

      # ★W8(A10 · 스펙 v4 §D5 핀 활성화 순서): `cargo test --bin cys` **리허설 레인** — 릴리스 레인
      #   직행 금지. D5 env 핀의 1순위 배선은 lib 헬퍼(src/lib.rs inject_claude_alt_screen_default*)의
      #   기존 `cargo test --lib` 편승(release.yml phoenix 게이트)이고, --bin cys 전체(휴면 테스트
      #   112개 포함)는 이 스텝이 최소 1사이클 green 을 증명한 뒤에만 release.yml 로 승격한다(그 TODO
      #   는 release.yml phoenix 게이트 스텝에 있다). 환경 의존 실패가 나오면 release.yml 의
      #   `--skip hwmon::` 선례 패턴(가상 러너 하드웨어 의존 모듈 명시 스킵)을 그대로 적용하라.
      #   CYS_PACK_DIR 임시 격리는 이 파일 다른 스텝들과 같은 근거 — 러너 실팩·홈 의존 차단.
      # 예산: 콜드 수 분·캐시 히트 시 단축(위 Rust cache 스텝이 그 근거).
      - name: cargo test --bin cys (릴리스 승격 전 리허설 · macOS)
        shell: bash
        run: |
          set -euo pipefail
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cys -- --test-threads=1

      # ★T6(v2 §12 이월 · merge3 CI 편입): cargo test --lib 완전 레인(macOS). 병합 엔진
      #   (merge3 golden 15종)과 pack 판정·실행부 스위트가 **브랜치 push 마다** 도는 유일한
      #   완전 --lib 레인이다 — release.yml 은 태그 시점(Windows 레그는 필터 3종), 여기는 조기
      #   경보. 격리·직렬화 근거는 위 리허설 스텝과 동일(CYS_PACK_DIR mktemp = 러너 실팩·홈
      #   의존 차단 · --test-threads=1 = env 뮤텍스 스위트 직렬 실행).
      - name: cargo test --lib (팩 계약·병합 엔진 스위트 · macOS)
        shell: bash
        run: |
          set -euo pipefail
          CYS_PACK_DIR="$(mktemp -d)" cargo test --lib -- --test-threads=1

      # ★W-CI2(2026-08-21 · Wave 2): `cargo test -p cys-app --bins` — GUI env 대칭 핀 편입.
      #   전수 실측(cargo test grep): cys-app(src-tauri) 크레이트 테스트를 돌리는 CI 레인이
      #   **0곳**이었다 — release.yml 은 루트 크레이트만(--bin cysd·--lib·--bin cys ×2잡),
      #   windows-health 도 루트만, pack-release 는 cargo test 자체가 없다. 그래서 f524e92 의
      #   회귀 핀 gui_spawn_env_matches_pane_spawn_env(GUI 직스폰 env 키집합 ⊇ pane 공용 규약
      #   cys::spawn_env_pairs — cp949 Windows 부트 즉사·HOME 붕괴 재발 차단)를 포함한 bin
      #   테스트 43종 전부가 CI 밖이었다. 크레이트명 cys-app 은 src-tauri/Cargo.toml 실측값.
      #   위 리허설과 같은 A10 순서를 따라 릴리스 레인 직행은 하지 않는다 — 이 스텝 1사이클
      #   green 후 release.yml 승격 검토. pack-release(ubuntu) 편입은 부적격: tauri 스택이
      #   시스템 webkit 계 의존을 요구하고 그 레인은 manifest emit 용 `cys` 만 빌드한다.
      # ⚠스텁 스테이징 근거(실측 2026-08-21): tauri-build 2.6.2 는 bundle 자원(externalBin
      #   사이드카·resources·frontendDist)의 **실존만** 검사하고 이 잡은 번들·webview 를 만들지
      #   않는다. ui/dist·binaries·resources·runtime 은 전부 .gitignore 라 신선 체크아웃에 없고,
      #   없으면 빌드 스크립트가 "resource path … doesn't exist" 로 즉사한다(실측). bundle-prep
      #   전체 실행(UI bun 빌드+release 빌드)은 이 레인 범위 밖(파일 머리 주석)이라 빈 스텁으로
      #   존재 계약만 충족한다 — 스텁 환경 신선 체크아웃에서 43/43 통과 실측(자원 내용 무의존).
      #   touch 는 기존 파일을 절단하지 않아 실물 스테이징이 있는 로컬 재현과도 공존한다.
      # 예산: 콜드 시 tauri 의존 그래프 추가 빌드 수 분(위 Rust cache 가 흡수) · 웜 실측 1s 미만.
      - name: cargo test -p cys-app --bins (GUI env 대칭 핀 · macOS)
        shell: bash
        run: |
          set -euo pipefail
          # 핀 실존 단언(이 리포 관례) — cargo test 필터는 0매치도 초록이라 존재를 먼저 못박는다.
          grep -q "fn gui_spawn_env_matches_pane_spawn_env" src-tauri/src/main.rs \
            || { echo "GUI env 대칭 핀 부재: src-tauri/src/main.rs (f524e92 회귀·git add 누락 의심)" >&2; exit 1; }
          mkdir -p ui/dist src-tauri/binaries src-tauri/resources src-tauri/runtime
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          touch "src-tauri/binaries/cys-$triple" "src-tauri/binaries/cysd-$triple" \
                src-tauri/resources/pack.tar.gz src-tauri/resources/pack-manifest.json
          CYS_PACK_DIR="$(mktemp -d)" cargo test -p cys-app --bins -- --test-threads=1

  # ═══════════════════════════════════════════════════════════════════════════
  # 잡2 — 부트스트랩 건강성 러너 **전량**(macos-latest · 2026-08-24 M4)
  #
  # ★무엇이 결함이었나(이 잡이 메우는 구멍): 러너에는 검체가 140종 등재돼 있는데 **CI 에서
  #   도는 것은 19종뿐**이었다(`grep -rn run_bootstrap_health .github/` 히트는 windows-health.yml
  #   하나이고 그 잡은 `--only "$WIN_SPECIMENS"` = 19종). 즉 121종이 **어느 레인에서도 돌지
  #   않았다** — H-META-READ·H-META-PIN·H-EVID-1·H-FAKE-1/2/3·H-BOOT-SUP-1/2·H-CI-TAG-1·
  #   H-SECRET-1 전부 포함이다.
  #   ★자기모순의 정점: H-CI-TAG-1 은 "windows-health 트리거가 태그에서 도는가" 를 판정하는
  #     검체인데 **그 검체 자신이 CI 에서 안 돌았다.**
  #   이 저장소의 교리가 "안 도는 검체는 게이트가 아니다" 인데(windows-health.yml 머리말·
  #   `if:` 금지 주석) 캠페인이 그 병을 자기 산출물에서 재생산한 것이다. 배선 없이 태그하면
  #   이번에 고친 것들이 다음 커밋에 조용히 되돌아가도 아무도 모른다.
  #
  # ★왜 별도 잡인가(잡1 의 마지막 스텝이 아니라):
  #   ⓐ 잡1 의 앞 스텝이 하나라도 죽으면(`set -euo pipefail`) 뒤 스텝은 **실행되지 않는다**.
  #      건강성 전량이 거기 있으면 "다른 게 빨간 날에는 건강성을 아예 재지 않는" 레인이 된다
  #      — 정확히 이 잡이 없애려는 형태다. 별도 잡은 잡1 의 성패와 무관하게 돈다.
  #   ⓑ 러너 exit 를 **잡 판정으로 그대로** 쓸 수 있다(0=GREEN·1=RED·2=UNMEASURED).
  #   ⓒ 잡1 의 checkout 깊이를 건드리지 않는다(아래 fetch-depth 0 은 이 잡만의 요구다).
  #
  # ★fetch-depth: 0 이 **필수**인 이유: 다수 검체가 계측기 자기검증으로 `git show <기준커밋>:<파일>`
  #   을 돌려 "구 코드에서 탐지기가 FIRE 하는가" 를 확인한다(CALIBRATION_REF·PRE_W0_REF·
  #   D4A_REF·PRE_WA3_REF·PRE_U24_REF). 기본 shallow checkout 은 그 ref 를 해소하지 못해
  #   계측 대조가 `skip(no-git)` 로 **조용히 강등**된다 — 검체는 그대로 PASS 라 아무도 모른다.
  #   windows-health.yml 이 같은 이유로 이미 fetch-depth: 0 을 쓴다.
  #
  # ★예산(정직한 수치): 러너는 stdlib 전용·네트워크 0 이고 cargo·bun·node 를 부르지 않는다
  #   (실측: 러너 소스에 cargo 호출 0건 — 주석 언급뿐). **로컬 실측 381.6s**(macOS · 139 PASS /
  #   0 FAIL / 1 SKIP). 러너 하나만 도는 잡이라 툴체인 설치가 없고, 잡1 과 **병렬**로 돌아
  #   레인 전체 wall-clock 을 늘리지 않는다.
  # ⚠비용 경계 — 이 잡은 macos-latest 1대·6~8분이다. 여기에 Windows 러너(138MB 빌드)를
  #   덧붙이지 마라. 태그 레인의 Windows 실기는 windows-health.yml 소관이고, 그 트리거를
  #   넓히는 것은 H-CI-TAG-1 이 명시적으로 금지한다.
  boot-health-full:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ★계측기 자기검증(git show 기준커밋)의 전제 — 위 머리말 참조

      # 러너는 stdlib 전용이라 의존성 설치가 없다. 3.12 = windows-health 잡과 같은 마이너.
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ★러너 exit 를 잡 판정으로 **그대로** 쓴다. 코드 3값의 의미가 서로 다르므로 문안도 가른다:
      #   0=GREEN(다 재고 다 통과) · 1=RED(재서 틀렸다) · 2=UNMEASURED(재지 않았다).
      #   ★2 도 실패다 — '측정하지 않았다' 를 통과로 접는 것이 이 저장소가 반복해 낸 사고의 형태다.
      # ★1회만 돌린다(`--json` → 렌더). windows-health 처럼 두 번 돌리면 예산이 두 배가 되는데,
      #   `--json` 산출물에 검체별 status·reason 이 전부 들어 있어 사람 읽을 표를 여기서 만들 수 있다.
      - name: 부트스트랩 건강성 — 전 검체 (macos-latest)
        shell: bash
        run: |
          set -euo pipefail
          R="cysjavis-pack/bin/tests/run_bootstrap_health.py"
          [ -f "$R" ] || { echo "::error::건강성 러너 누락: $R (git add 누락 의심)"; exit 1; }
          echo "== 전 검체 실행(--only 없음 = 등재 전량) =="
          rc=0
          python3 "$R" --json > health-full.json || rc=$?
          python3 - "$rc" <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          try:
              d = json.load(open("health-full.json", encoding="utf-8"))
          except Exception as e:                      # noqa: BLE001 — 파싱 실패도 관측 실패다
              print("::error::건강성 결과 JSON 을 읽지 못했다(%s) — 러너가 중도 사망했을 수 있다. "
                    "이 상태의 '문제 없음' 은 근거가 아니다(fail-closed)." % e, file=sys.stderr)
              sys.exit(1)
          s = d["summary"]
          for r in d["specimens"]:
              print("  %-5s %-14s %-4s %s" % (r["status"].upper(), r["id"], r["wave"],
                                              (r.get("detail") or r.get("reason") or "")[:150]))
          print("[boot-health] verdict=%s pass=%s fail=%s skip=%s disabled=%s pending=%s total=%s %.1fs"
                % (s["verdict"], s["pass"], s["fail"], s["skip"], s["disabled"],
                   s["pending"], s["total"], s["elapsed_secs"]))
          if s["fail"]:
              for r in d["specimens"]:
                  if r["status"] == "fail":
                      print("::error title=%s::%s" % (r["id"], (r.get("reason") or "")[:600]))
          if s["off_switches_engaged"]:
              for e in s["off_switches_engaged"]:
                  print("::error::측정 축이 꺼져 있다 — [%s] %s=%s → %s"
                        % (e["kind"], e["env"], e["value"], e["scope"]))
          if rc == 0 and s["verdict"] == "GREEN":
              sys.exit(0)
          if rc == 1:
              print("::error::건강성 RED — 발효 검체 %d건 실패. **검체를 고쳐 초록으로 만들지 마라** "
                    "(러너 헤더 핀 이사 계약 ④: 첫 행동은 원인 규명이다)." % s["fail"], file=sys.stderr)
              sys.exit(1)
          if rc == 2:
              print("::error::건강성 UNMEASURED — 재지 않은 축이 있다. 이것은 통과가 아니다.",
                    file=sys.stderr)
              sys.exit(1)
          print("::error::러너 종료코드 %s 는 계약(0/1/2) 밖이다 — 판정 불가로 중단(fail-closed)." % rc,
                file=sys.stderr)
          sys.exit(1)
          PY

  # ═══════════════════════════════════════════════════════════════════════════
  # 잡3 — NSIS 훅 컴파일 하네스 + 컴파일 가드 negative control (R2 라운드2 편입)
  #
  # ★무엇이 결함이었나: scripts/tests/nsis-hook-compile/run.sh 는 어느 CI 레인에서도 0회
  #   실행이었고(grep 실측 0건), happy path 만 돌아 **가드 삭제를 못 봤다**(E1 변이 실측:
  #   블라인드-오라클 !error 4종을 지워도 exit 0). run.sh 에 negative control N1~N4 가
  #   들어갔고(무버전 PE/0.0.0.0/사이드카 부재 = 계약 토큰과 함께 실패해야 통과 · §5 토큰
  #   verbatim 핀), 이 잡이 그것을 브랜치 CI 에서 상시 실행한다.
  # ★별도 잡인 이유: 잡1 은 Rust/Bun 셋업이 무겁고 set -e 사슬이라, 앞 스텝이 붉으면 훅
  #   가드는 아예 재지 않게 된다. 이 잡은 brew nsis 하나만 설치하는 독립·병렬 잡이다.
  # ★팩 스위트가 아니므로 '팩 스위트 레인 대조' 게이트와 무관(test_ 토큰 아님 — run.sh).
  #   릴리스 레인은 실빌드가 훅을 컴파일하고 §5 토큰을 build log 에서 grep 한다(그 벨트의
  #   문구 드리프트를 N4 가 여기서 조기에 잡는다).
  nsis-hook-harness:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install makensis (brew)
        shell: bash
        run: |
          set -euo pipefail
          brew install nsis
          makensis -VERSION

      - name: NSIS 훅 컴파일 + 컴파일 가드 negative control (N1~N4)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/nsis-hook-compile/run.sh

      # W7 (2026-08-29): 훅 배치 상태기계의 전수 분기 모델. 증명 범위 = "미러 +
      # census 가드", 그 이상이 아니다: green 은 (a) 훅의 파이썬 미러가 모든 실패
      # 조합·중단에서 I1/I3/I4 를 지켰고(+심층 레인 커버리지 핀 34종), (b) 훅 실물이
      # 핀 시점에서 표류하지 않았다(매크로 집합·앵커·토큰 + 정규화 본문 해시 +
      # POSTINSTALL !insertmacro 시퀀스 — 어느 하나라도 표류하면 exit 2)까지를
      # 뜻한다. 훅 자체의 실행 증거가 아니다(실기 실행은 windows-build.yml T4 축).
      - name: NSIS 훅 배치 상태기계 모델 — 전수 분기 + 불변식 (W7)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/nsis-hook-model/model.py
