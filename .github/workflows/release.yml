name: release

# Candidate-only release workflow. Target jobs upload encrypted Actions
# artifacts; a single assembler may upload one collaborator-visible GitHub draft. This workflow has
# no path that makes a release public. Public promotion lives in
# release-publish.yml and is digest-bound behind the release-production gate.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  SRC_REPO: idoforgod/cys-terminal              # 공개 소스 repo = 공개 배포 원본 (updater 대상)
  BROWSER_RUST_TOOLCHAIN: '1.95.0'
  BROWSER_BUN_VERSION: '1.3.8'

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ★S27 교정(2026-07-26) — `src/` 모듈 선언 ↔ git 추적 파일 정합 사전 게이트.
      # **왜 첫 잡의 첫 스텝인가**: `src/lib.rs` 가 `pub mod X;` 를 선언했는데 `src/X.rs` 가 미추적이면
      # 태그 체크아웃에는 그 파일이 없고 **전 레그(macOS×2·Windows)가 컴파일 즉사**한다. 종전에는
      # 그 사실이 `cargo build` 까지 20분 걸려서야 드러났고, 실패 로그는 원인(=git add 누락)을
      # 가리키지 않았다. 실측 사례: v0.13.17 작업 브랜치에서 `src/lib.rs:16 pub mod todo_scan;` 이
      # 이미 있는데 `src/todo_scan.rs` 는 untracked 였다.
      # 팩 테스트에는 존재-단언 관례(`[ -f "$f" ] || exit 1`)가 있는데 `src/` 에만 없던 공백을 닫는다.
      # SOT 는 **git 인덱스**(`git ls-files`)다 — 작업 트리 존재는 일부러 근거로 쓰지 않는다.
      #   정확히 그 괴리(디스크엔 있고 인덱스엔 없음)가 이 게이트의 표적이기 때문이다.
      # ⚠정직한 한계 — 이건 컴파일러가 아니다. 다음은 못 잡거나 보지 않는다:
      #   ①인라인 `mod x { … }`(중괄호)는 파일을 요구하지 않으므로 대상 아님
      #   ②`#[path = "…"]` 로 경로를 덮어쓴 선언은 **해석하지 않고 skip** 하며 그 사실을 로그에 남긴다
      #   ③`cfg` 조건부 모듈도 무조건 파일을 요구한다(추적돼 있으면 통과하므로 위양성은 없다)
      #   ④src 밖(src-tauri/·browser-runtime/)은 이 게이트 범위가 아니다
      - name: src 모듈 선언 ↔ 추적 파일 정합 (미추적 즉사 사전 차단)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          out = subprocess.run(["git", "ls-files", "src"],
                               capture_output=True, text=True, check=True).stdout
          tracked = set(l.strip() for l in out.splitlines() if l.strip())
          rs = sorted(p for p in tracked if p.endswith(".rs"))
          if not rs:
              print("::error::git ls-files src 에 .rs 가 없다 — 인덱스 부재?", file=sys.stderr)
              sys.exit(1)

          # 열 0에서 시작하고 `;`로 끝나는 선언만 본다(인라인 `mod x { … }`는 파일 불요).
          DECL = re.compile(r'^(?:pub(?:\([^)]*\))?\s+)?mod\s+([A-Za-z_][A-Za-z0-9_]*)\s*;')
          missing, skipped = [], []
          for p in rs:
              with open(p, encoding="utf-8", errors="replace") as f:
                  lines = f.read().splitlines()
              base = os.path.basename(p)
              # lib.rs·main.rs·mod.rs 는 디렉터리 자신을 대표한다 → 형제 경로.
              # 그 외 `foo.rs` 의 자식 모듈은 `foo/` 아래에 산다(Rust 2018 경로 규칙).
              d = os.path.dirname(p) if base in ("lib.rs", "main.rs", "mod.rs") else p[:-3]
              for i, line in enumerate(lines):
                  m = DECL.match(line)
                  if not m:
                      continue
                  if i > 0 and lines[i - 1].lstrip().startswith("#[path"):
                      skipped.append("%s:%d %s (#[path] 재지정 — 미해석)" % (p, i + 1, m.group(1)))
                      continue
                  name = m.group(1)
                  cands = [os.path.join(d, name + ".rs"), os.path.join(d, name, "mod.rs")]
                  if any(c in tracked for c in cands):
                      continue
                  on_disk = [c for c in cands if os.path.exists(c)]
                  missing.append((p, i + 1, name, cands, on_disk))

          for s in skipped:
              print("  (skip) %s" % s)
          sys.stdout.flush()
          if missing:
              print("::error::선언된 모듈의 소스가 git 인덱스에 없다 — 이 상태로 태그하면 전 레그 컴파일 즉사:",
                    file=sys.stderr)
              for p, ln, name, cands, on_disk in missing:
                  why = ("작업 트리엔 있으나 **미추적**: %s → `git add %s`" % (on_disk[0], on_disk[0])
                         if on_disk else "작업 트리에도 없음(오타·삭제 잔재 의심)")
                  print("::error::  %s:%d `mod %s;` — %s" % (p, ln, name, why), file=sys.stderr)
                  print("::error::    기대 경로: %s" % " 또는 ".join(cands), file=sys.stderr)
              sys.exit(1)
          print("✅ src 모듈 선언 ↔ 추적 파일 정합: %d개 .rs 스캔, 미해결 0" % len(rs))
          PY

      - name: Release closure unit and static tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v
          shellcheck \
            scripts/build-macos-signed.sh \
            scripts/import-macos-signing-certificate.sh \
            scripts/make-update-manifest.sh \
            scripts/release-handoff.sh \
            scripts/runtime-stage-sign-macos.sh \
            scripts/verify-release-remote.sh
          # PowerShell owns the single-quoted program.
          # shellcheck disable=SC2016
          pwsh -NoProfile -Command '$failed=$false; Get-ChildItem scripts/*.ps1 | ForEach-Object { $tokens=$null; $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors); if($errors.Count -gt 0){$failed=$true; $errors | ForEach-Object { Write-Error $_.Message }} }; if($failed){exit 1}'

  build:
    needs: release-contracts
    strategy:
      fail-fast: false     # 한 타깃이 실패해도 나머지는 계속
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin    # Apple Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin     # Intel — arm64 러너에서 크로스 빌드(bundle-prep이 CYS_TARGET 사용)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc  # Windows x64 — NSIS 자기완결(PortableGit+Python 동봉).
                                            # createUpdaterArtifacts=true(tauri.windows.conf.json) + 서명키로
                                            # setup.exe는 Authenticode+RFC3161 뒤 updater 서명을 다시 생성한다.
    runs-on: ${{ matrix.platform }}
    # hang 상한 — 미지정 시 GitHub 기본은 360분(6시간)이다. 서명·공증 대기나 러너 stall이
    # 한 번 걸리면 릴리스 레인 전체가 6시간 묶이고 동시성 슬롯도 함께 잠긴다.
    # ★150 상향(v0.13.23): crt-static 도입이 rust-cache 를 전량 무효화해 첫 콜드 빌드가
    # 90분을 위협하고, 타임아웃 시 rust-cache 는 저장되지 않아 재실행도 동일 콜드가 되는
    # 실패 루프가 가능하다. 첫 green 후 캐시 재적재 상태를 보고 재평가할 것.
    timeout-minutes: 150

    # Explicit, auditable opt-out for the unsigned Windows distribution model
    # (unsigned exe + zip + Windows Defender guidance). Only ALLOW_UNSIGNED_WINDOWS=='1'
    # skips Authenticode; unset/other values keep the fail-closed default unchanged.
    env:
      ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confidential handoff key contract
        shell: bash
        env:
          RELEASE_HANDOFF_KEY: ${{ secrets.RELEASE_HANDOFF_KEY }}
        run: bash scripts/release-handoff.sh check

      # ★시크릿/개인정보 발행 hard-gate (빌드·임베드 전 최우선 — 셋업보다도 먼저 fail-fast).
      # git-추적 전 트리를 fail-closed로 스캔해 개인 홈경로·개인 프로필 디렉토리·개인 계정
      # 핸들·이메일·키토큰 누출을 바이너리 link/번들 전에 차단한다. 비0이면 워크플로우 실패
      # (발행 차단). Windows 매트릭스 레그도 Git Bash로 실행하도록 shell: bash 고정.
      - name: Secret/PII scan (pre-build hard-gate)
        shell: bash
        run: bash scripts/secret-scan.sh --all

      # 버전 SOT 6곳 일치 hard-gate — 드리프트인 채 발행 차단(v0.12.11에서 wxs 2곳 0.12.10 잔류
      # 실증·2026-07-05). 태그 push면 태그=소스 버전까지 단언, workflow_dispatch(브랜치)면 상호 일치만.
      - name: Version SOT check (drift hard-gate)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            sh scripts/version-check.sh "$GITHUB_REF_NAME"
          else
            sh scripts/version-check.sh
          fi

      # 프런트엔드 번들러(ui/build.sh가 bun 사용). beforeBuildCommand가 bun을 호출하므로 PATH 필수.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BROWSER_BUN_VERSION }}

      # UI 회귀 게이트 — 한글 IME 리듀서(ui/src/ime.ts) 프로필 A/B/C/Windows 시퀀스 테스트.
      # 실패=릴리스 차단. 배경: WKWebView 프로필별 자모 유출·이중전송 재발 방지(fix/ime-hybrid-profile).
      - name: UI 회귀 테스트 (bun test)
        shell: bash
        run: cd ui && bun test

      # browserd cast 순수 단위 게이트 — castRoute 파서·parseClientMsg 검증·mapInput 좌표 변환.
      # ★cast-integration.test.ts는 의도적으로 제외한다 — 실제 Chrome/Chromium 기동이 필요해 러너 환경에
      #   의존하고, 브라우저가 없으면 CI가 무관한 이유로 실패한다. 통합 테스트는 로컬 게이트에서 실행한다.
      - name: browserd 순수 단위 테스트 (bun test)
        shell: bash
        run: |
          set -euo pipefail
          cd cysjavis-pack/browserd
          # ★대상 파일 존재를 먼저 단언한다 — `bun test <f>`의 인자는 경로가 아니라 **필터**라, 지정 파일이
          #   체크아웃에 없어도 다른 필터가 하나라도 맞으면 exit 0으로 조용히 통과한다(실측: 존재+부재 혼합
          #   = exit 0). 신규 cast 파일이 untracked로 누락되면 게이트가 '초록 거짓말'이 되므로 여기서 막는다.
          # ★실행은 순수 단위만(통합은 Chromium 의존이라 제외) — 그러나 **존재 단언은 통합 파일까지**
          #   건다. 1,000줄 넘는 회귀 핀 본체가 untracked 로 남아 add 누락 시 무음 소실되기 때문이다
          #   (`bun test <f>` 의 인자는 경로가 아니라 필터라 파일이 없어도 조용히 통과한다).
          for f in tests/cast.test.ts tests/unit.test.ts tests/phase3-unit.test.ts \
                   tests/cast-integration.test.ts tests/phase3.test.ts; do
            [ -f "$f" ] || { echo "browserd 테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
          done
          bun install --frozen-lockfile
          bun test tests/cast.test.ts tests/unit.test.ts tests/phase3-unit.test.ts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.BROWSER_RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      # ★W6/E1 phoenix host-level 로직 게이트 (macOS 네이티브 arm64 레그 1회 · 스텝 정의 — 실 실행은 릴리스 시 확인).
      # 실 cysd 를 격리 상태 디렉터리에서 kill→재기동해 auto-restore 부활·STRICT 주입·no-target NOOP·cross-layer
      # 재시도·C2 sentinel·E3 GC·E2 스케줄 배선을 커밋 테스트로 실증(a07cc7f Not-tested 봉인).
      # ★codex W6 minor: 이 게이트는 **host-아키텍처 무관 로직**(phoenix python + Rust auto-restore 단위)을
      #   검증한다 — host debug(arm64) 바이너리로 충분하며 matrix.target 별 sidecar 는 뒤 build 스텝이 컴파일한다.
      #   따라서 두 macOS 레그 중복 실행을 피해 **네이티브 레그(aarch64)에서 1회만** 돈다(x86_64 레그는 크로스빌드
      #   sidecar 컴파일만 담당·동일 host arm64 재검증 무의미). target 별 실기 E2E 는 W5(Windows)·릴리스 스모크 소관.
      - name: phoenix host-level 로직 게이트 (macOS 네이티브)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          cargo build --bin cys --bin cysd
          export PHOENIX_HARNESS_CYSD="$PWD/target/debug/cysd"
          export PATH="$PWD/target/debug:$PATH"
          export PHOENIX_CYS="$PWD/target/debug/cys"
          # ★커밋된 phoenix 테스트 전건 실행(glob) — 하드코딩 리스트는 신규 웨이브 테스트(w2/w3/c6/as3 …)를 조용히
          #   누락시키는 위험이 있어 tests/ 디렉터리를 스캔한다(정직성: 게이트가 실제 커밋 테스트 전부를 돈다).
          for t in cysjavis-pack/bin/tests/test_phoenix_*.py; do
            echo "== phoenix test: $(basename "$t") =="
            CYS_PACK_DIR="$(mktemp -d)" python3 "$t"
          done
          # ── 능력 파리티 게이트(W4·DD-6) — 반쪽마스터·편성 회귀를 출고 전에 차단 ──
          # 파리티 7종을 명시 실행한다(어느 하나 비0이면 set -e 로 잡 실패=릴리스 차단). glob 이 아니라
          # 명시 목록인 이유: 이 7종은 '반드시 존재+통과'해야 하는 계약이라 파일 누락도 게이트가 잡아야 한다
          # (browserd 게이트의 존재-단언 관례와 동형 — untracked 누락 = 초록 거짓말 차단).
          # ★test_dept_teardown_atomicity 는 게이트 제외 — baseline v0.13.3 부터의 **선재 실패**(down) 블록
          #   소스-스캔 드리프트·우리 회귀 아님, git stash 로 baseline 동일 확인분). 업스트림(teardown 담당)
          #   수리 권고. 여기 포함하면 무관한 이유로 릴리스가 영구 차단된다.
          # ★C03 전핀 밀폐 게이트(리뷰어1 BLOCK 필수2) — 대표마커 3개가 아니라 CONTENT_PINS 전 핀
          #   대조로 텍스트 침식형 반쪽마스터를 차단(:167 에러메시지가 약속하는 C03 커버의 실물).
          echo "== C03 전핀 게이트 =="
          if ! CYS_PACK_DIR="$GITHUB_WORKSPACE/cysjavis-pack" \
               python3 cysjavis-pack/bin/javis_preflight.py --gate-c03; then
            echo "::error::C03 전핀 게이트 실패 — 텍스트 침식형 반쪽마스터. 릴리스 차단." >&2
            echo "  javis_preflight.py --emit-drift 로 소실/신규 핀 확인 후 디렉티브·CONTENT_PINS 동기화." >&2
            exit 1
          fi
          echo "== 능력 파리티 7종 게이트 =="
          for t in test_directive_compose test_cli_probe test_formation test_parity_paths \
                   test_heal test_budget test_banner_truth; do
            f="cysjavis-pack/bin/tests/$t.py"
            [ -f "$f" ] || { echo "파리티 테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
            echo "== parity test: $t =="
            if ! CYS_PACK_DIR="$(mktemp -d)" python3 "$f"; then
              echo "::error::능력 파리티 게이트 실패($t) — 반쪽마스터/편성 회귀. 릴리스 차단." >&2
              echo "핀 관련 실패(C03/directive_compose)면 디렉티브 수정 PR 이 CONTENT_PINS 를 동기화하지 않은 것: " >&2
              echo "  python3 cysjavis-pack/bin/javis_preflight.py --emit-drift 로 소실/신규 핀을 확인해 함께 고쳐라." >&2
              exit 1
            fi
          done
          # ── ★todo 선언·유령집계 게이트(C-1 교정 · 2026-07-26) ──
          # **왜 여기 있어야 하는가**: 이 게이트 3종은 `ci-branch.yml` 에만 있었고 그 워크플로는
          # `push: branches: ['feat/**']` 로만 기동한다 — **태그 push 로는 한 번도 돌지 않는다.**
          # 즉 결함이 사용자에게 도달하는 유일한 경로(태그)에는 보증이 0이었다. Rust 파서는
          # 아래 `cargo test --lib` 가 expected.json 대조로 묶는데 **실제 배송되는 Python 파서는
          # 파리티 검증 0회로 서명·봉인**되던 비대칭을 여기서 닫는다.
          # 존재-단언은 위 파리티 7종 관례와 동형이다(untracked 누락 = 초록 거짓말 차단).
          echo "== todo 선언 파서 2언어 파리티(골든 + 조합 1024건) =="
          d="cysjavis-pack/bin/tests/fixtures/todo-decl"
          h="cysjavis-pack/bin/tests/parity_todo_decl.py"
          [ -d "$d" ] || { echo "골든 픽스처 디렉터리 누락: $d (계약 SOT 부재 = 실패)" >&2; exit 1; }
          [ -f "$d/expected.json" ] || { echo "계약 대장 누락: $d/expected.json (git add 누락 의심)" >&2; exit 1; }
          # `ls "$d"/*.md` 는 0건일 때 pipefail 로 메시지 없이 죽는다 — find 는 0건에서도 정상 종료.
          n="$(find "$d" -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')"
          [ "$n" -ge 15 ] || { echo "픽스처 케이스 부족(${n}종 · 설계 P3-1 최소 15종)" >&2; exit 1; }
          [ -f "$h" ] || { echo "파리티 하네스 누락: $h (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_decl_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_decl_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_decl.rs" ] || { echo "Rust 파서 누락: src/todo_decl.rs (git add 누락 의심)" >&2; exit 1; }
          # 하네스가 rustc 를 단독 호출한다(크레이트 의존 0 불변식의 기계 증명). 이 레그는 앞의
          # `Setup Rust` 스텝이 툴체인을 깔았으므로 PATH 에 rustc 가 있다 — 없으면 하네스가 hard fail 한다.
          if ! python3 "$h" --fuzz 1024 --list-mismatch 20; then
            echo "::error::선언 파서 2언어 파리티 실패 — Python 정본과 Rust 구현이 갈렸다. 릴리스 차단." >&2
            exit 1
          fi
          # 선언·스탬프·유령집계 소비자 회귀 6종. 여기서만 핀되는 행동:
          #   · orphan-scope·미선언이 nodes[] 에 남는다(빼면 false QUIET → 세션 주차)
          #   · 완료 파일이 미완 파일을 shadow 하지 않는다 · 집계 밖 미완 존재 시 QUIET/park 금지
          #   · 라벨은 선언 owner(role 라벨공간 하이픈 조인 파탄 차단)
          #   · 데몬 payload verdict 선택 필드에 대한 HUD 브리지 구/신 스큐 내성(ADR-2)
          #   · 게이트 대장 회귀 65종(javis_report_gate + javis_gate_check)
          # CYS_PACK_DIR 을 빈 임시 디렉터리로 고정하는 이유는 위 게이트들과 같다 — 러너의 실제
          # 팩·홈 디렉터리에 판정이 의존하면 초록이 근거가 되지 못한다.
          echo "== todo 선언·유령집계 소비자 회귀 6종 =="
          for t in test_todo_decl test_todo_stamp test_report_ghost test_hud_bridge_skew \
                   test_report_gate test_todo_shared_constants; do
            f="cysjavis-pack/bin/tests/$t.py"
            [ -f "$f" ] || { echo "선언·유령집계 테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
            echo "== declared-state test: $t =="
            if ! CYS_PACK_DIR="$(mktemp -d)" python3 "$f"; then
              echo "::error::선언·유령집계 게이트 실패($t) — 진행률 집계 회귀. 릴리스 차단." >&2
              exit 1
            fi
          done
          # ★todo **스캔 집합** 파리티(S18) — 위 파서 파리티와 **다른 표면**이다. 그쪽은 "같은 파일을
          # 같게 판정하는가", 여기는 "**애초에 같은 파일을 보는가**"를 묻는다. 실측 결함: 배제 정책은
          # 이미 같았는데 데몬이 정본 위치 `${CYS_PACK_DIR}/round`를 스캔 루트에 갖고 있지 않아, 데몬에
          # 배선한 선언 판정·유령 배제·verdict/owner payload 가 정본 todo 에는 한 번도 적용되지 않았다.
          echo "== todo 스캔 집합 2언어 파리티(C1·C2 동일 파일 집합) =="
          hs="cysjavis-pack/bin/tests/parity_todo_scan.py"
          [ -f "$hs" ] || { echo "스캔 파리티 하네스 누락: $hs (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_scan_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_scan_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_scan.rs" ] || { echo "스캔 단일 구현 누락: src/todo_scan.rs (git add 누락 의심)" >&2; exit 1; }
          if ! python3 "$hs"; then
            echo "::error::todo 스캔 집합 파리티 실패 — C1(보고기)과 C2(데몬)가 다른 파일을 본다. 릴리스 차단." >&2
            exit 1
          fi
          # ── v0.13.17 큐 역압 L2 팩 배선 게이트(C7) ──
          # javis_push 이중 채널 보고 · dead-letter 전사 · wakeup drain 의 소프트캡 종결(fast-fail
          # 비오염) · orchestra 티켓 보고채널 스냅샷. 전부 밀폐 unittest(데몬·cys 미호출)라 러너에서
          # 결정론이며, 파리티 게이트와 동형으로 파일 존재도 단언한다(untracked 누락 = 초록 거짓말 차단).
          # ★T9 혼잡 드릴(javis_queue_drill.py)은 여기 비편입 — 격리 cysd 기동이 필요해 러너에서 불안정할
          #   수 있다. 로컬·릴리스 런북 체크리스트(수동 게이트)에서 돌린다.
          echo "== 큐 역압 팩 4종 게이트 =="
          for t in test_javis_push test_deadletter test_wakeup_drain test_orchestra_ticket_snapshot; do
            f="cysjavis-pack/bin/tests/$t.py"
            [ -f "$f" ] || { echo "큐 역압 테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
            echo "== queue-backpressure test: $t =="
            if ! CYS_PACK_DIR="$(mktemp -d)" python3 "$f"; then
              echo "::error::큐 역압 팩 게이트 실패($t) — 응답 폭주 방어 배선 회귀. 릴리스 차단." >&2
              echo "  보고채널 스냅샷 실패면 티켓 문안과 javis_orchestra 무결성 assertion 을 원자 동기하라." >&2
              exit 1
            fi
          done
          # Rust auto-restore 단위(재시도 seam·env 주입·B1·B3) + pack 소유권(B2).
          # ★--skip hwmon:: — hwmon 테스트는 실 GPU 전제(gpu.cores>0 단언)라 가상 러너에서 환경 FAIL
          #   (v0.12.21 release run 28792111282 실증 — phoenix 게이트와 무관한 host 하드웨어 의존).
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cysd -- --test-threads=1 --skip hwmon::
          CYS_PACK_DIR="$(mktemp -d)" cargo test --lib -- --test-threads=1
          # ★WS-7: `--bin cys` 레인 — doctor 진단(고아 소켓·시작 락 fail-closed)·버전 게이트·resume
          #   게이트 테스트가 CI에서 **한 번도 실행된 적이 없다**(위 두 줄은 cysd 바이너리와 lib만 돈다).
          #   doctor --fix는 라이브 소켓·락 파일을 만지는 파괴적 경로라 회귀 무방비가 특히 위험하다.
          #   --test-threads=1: doctor 테스트가 프로세스 전역 env(CYS_DOCTOR_*)를 교대한다.
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cys -- --test-threads=1

      # src-tauri(cys-app) 단위 게이트 — 위 phoenix 스텝의 `cargo test --bin cysd|--lib`는 둘 다 루트
      # crate(cys-terminal)라 src-tauri crate 테스트(browserd state 파싱 등 Tauri command 단위)가 CI에서
      # 한 번도 돌지 않았다. host-아키텍처 무관 순수 로직이라 phoenix 게이트와 동일하게 네이티브 레그 1회만 돈다.
      # ★ui/dist 선행 빌드 필수 — generate_context!(tauri-codegen)가 frontendDist 부재 시 컴파일 패닉
      #   ("The `frontendDist` configuration is set to ... but this path doesn't exist"). ui/dist는 .gitignore
      #   대상이라 체크아웃엔 없고, 평소엔 뒤 build 스텝의 beforeBuildCommand(bundle-prep)가 만든다.
      - name: src-tauri 단위 테스트 (cargo test -p cys-app · macOS 네이티브)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          # ★cys-app 컴파일은 tauri build script 를 통과해야 하고, 그 스크립트는 tauri.conf.json 의
          #   bundle 자원 **실재**를 전부 요구한다(v0.13.0 CI 실패의 실제 원인 — 사이드카만이 아니었다).
          #   클린 체크아웃 실측 필수 목록: ①ui/dist(frontendDist·generate_context!) ②binaries/cys-<triple>
          #   ③binaries/cysd-<triple> ④resources/pack.tar.gz ⑤resources/pack-manifest.json ⑥runtime/.
          #   ①~⑤는 bundle-prep.sh(= beforeBuildCommand 와 **같은 스크립트**)가 실제 내용으로 만든다.
          #   여기서 개별 복사로 흉내내면 tauri.conf.json 이 바뀔 때 조용히 어긋나므로 표준 스크립트를
          #   그대로 부른다(드리프트 0). 뒤 release 빌드가 같은 산출물을 재사용해 순비용도 거의 0.
          #   ⑥runtime/ 만 뒤 '동봉 런타임 준비' 스텝 소관이라, 존재 검사만 충족하도록 빈 디렉터리를
          #   미리 만든다(내용은 그 스텝이 채운다). CYS_TARGET 미설정 = 호스트 트리플(이 레그와 일치).
          mkdir -p src-tauri/runtime
          # tauri build.rs 리소스 존재 검증 통과용 placeholder — 실 스테이징(후속 스텝)이 원자적으로 대체
          mkdir -p src-tauri/resources/browser-runtime
          bash scripts/bundle-prep.sh
          CYS_PACK_DIR="$(mktemp -d)" cargo test -p cys-app

      # Windows 자기완결 런타임 동봉 (windows-build.yml과 동일 절차 — PortableGit + Python embeddable).
      # tauri.windows.conf.json bundle.resources("runtime/")가 이 트리를 NSIS에 싣는다.
      - name: 동봉 런타임 준비 (PortableGit + Python embeddable — Windows 전용)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          RT="src-tauri/runtime"
          rm -rf "$RT"; mkdir -p "$RT"
          echo "== PortableGit 2.55.0 (bash + coreutils + git) =="
          curl -fL -o pg.7z.exe "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.1/PortableGit-2.55.0-64-bit.7z.exe"
          7z x pg.7z.exe -o"$RT/git" -y >/dev/null
          rm -rf "$RT/git/mingw64/share/doc" "$RT/git/usr/share/doc" \
                 "$RT/git/mingw64/share/man" "$RT/git/usr/share/man" 2>/dev/null || true
          echo "== Python 3.12.10 embeddable (stdlib + _sqlite3 + ssl) =="
          curl -fL -o py.zip "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          7z x py.zip -o"$RT/python" -y >/dev/null
          cp "$RT/python/python.exe" "$RT/python/python3.exe"
          printf 'python312.zip\n.\nimport site\n' > "$RT/python/python312._pth"
          # ── pip 부트스트랩 (embeddable은 pip 미포함 → 'No module named pip' 방지) ──
          curl -fL -o "$RT/python/get-pip.py" "https://bootstrap.pypa.io/get-pip.py"
          "$RT/python/python.exe" "$RT/python/get-pip.py" --no-warn-script-location
          rm -f "$RT/python/get-pip.py"
          # ── uv/uvx 동봉 (serena·nlm-mcp-cli가 uvx 전제 → C20/C43 FAIL 방지). runtime/python은 cysd가 PATH 주입. ──
          curl -fL -o uv.zip "https://github.com/astral-sh/uv/releases/download/0.11.26/uv-x86_64-pc-windows-msvc.zip"
          7z x uv.zip -o"$RT/python" -y >/dev/null
          ls -la "$RT/python/uv.exe" "$RT/python/uvx.exe"
          # ── node + npm/npx 동봉 (mac 0.7.0 파리티 — 순정 Windows엔 node 부재. runtime/node는 cysd가 PATH 주입) ──
          echo "== Node.js 22.17.1 (npm/npx — win-x64, mac과 동일 핀) =="
          curl -fL -o node.zip "https://nodejs.org/dist/v22.17.1/node-v22.17.1-win-x64.zip"
          7z x node.zip -o"$RT" -y >/dev/null
          mv "$RT/node-v22.17.1-win-x64" "$RT/node"
          ls -la "$RT/node/node.exe" "$RT/node/npm.cmd"
          mkdir -p "$RT/LICENSES"
          printf 'Bundled runtimes and their licenses:\n- Git for Windows (git): GPLv2 (https://github.com/git-for-windows/git)\n- MSYS2 bash + GNU coreutils: GPLv3\n- CPython (embeddable): PSF License (https://www.python.org)\n- pip (get-pip bootstrap): MIT\n- uv (astral-sh): Apache-2.0 OR MIT (https://github.com/astral-sh/uv)\n- Node.js (+npm/npx): MIT (https://nodejs.org)\nWritten offer for corresponding source: contact the distributor.\n' > "$RT/LICENSES/BUNDLED-RUNTIMES.txt"
          ls -la "$RT/git/usr/bin/bash.exe" "$RT/git/cmd/git.exe" "$RT/python/python3.exe"

      # macOS 자기완결 런타임 동봉 (RC-20/T6b — 순정 맥=개발도구 없는 소비자. python3·git은 CLT-shim이라
      # 실행 시 개발도구 프롬프트 → 동봉 필수). tauri.conf.json bundle.resources("runtime/")가 이 트리를
      # Contents/Resources/runtime 으로 싣고, runtime_bin_dirs(RC-18)가 PATH 해소한다. per-arch(matrix.target).
      # ★공증: 동봉 Mach-O는 ad-hoc(python·uv)/Node서명이라 로컬 build-macos-signed.sh가 inside-out 재서명.
      - name: 동봉 런타임 준비 (Python·git·uv·node — macOS 전용, per-arch)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: bash scripts/prep-mac-runtime.sh "${{ matrix.target }}"

      # Browser Runtime은 release tag의 source object와 고정 도구체인으로 supervisor/engine을
      # 빌드하고, Playwright가 고정한 Chromium archive를 정적 source manifest의 byte/SHA pin으로
      # 검증한 뒤에만 Tauri resource tree에 원자적으로 stage한다. metadata prepare/minisign은 뒤의
      # 플랫폼 build script가 이 stage의 실제 executable/tree hashes를 다시 계산해 서명한다.
      - name: Stage verified Browser Runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$BROWSER_BUN_VERSION" || {
            echo "Browser Runtime Bun toolchain drift" >&2; exit 1;
          }
          case "$(rustc --version)" in
            "rustc $BROWSER_RUST_TOOLCHAIN "*) ;;
            *) echo "Browser Runtime Rust toolchain drift" >&2; exit 1 ;;
          esac

          BUILD_ROOT="$RUNNER_TEMP/browser-runtime-build"
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          cargo build --locked --release --target "${{ matrix.target }}" -p cys-browserd

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              BUN_TARGET=bun-darwin-arm64
              EXE_SUFFIX=
              ;;
            x86_64-apple-darwin)
              BUN_TARGET=bun-darwin-x64
              EXE_SUFFIX=
              ;;
            x86_64-pc-windows-msvc)
              BUN_TARGET=bun-windows-x64
              EXE_SUFFIX=.exe
              ;;
            *) echo "unsupported Browser Runtime target" >&2; exit 1 ;;
          esac
          SUPERVISOR="$PWD/target/${{ matrix.target }}/release/cys-browserd${EXE_SUFFIX}"
          ENGINE="$BUILD_ROOT/cys-browser-engine${EXE_SUFFIX}"
          BUN_COMPILER="$BUILD_ROOT/bun-compiler${EXE_SUFFIX}"
          BUN_COMPILER_URL="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["targets"][sys.argv[2]]["bun_compiler_archive_url"])' \
            release/browser-runtime-sources.json "${{ matrix.target }}")"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            -o "$BUILD_ROOT/bun-compiler.zip" "$BUN_COMPILER_URL"
          python3 scripts/runtime-stage-toolchain.py \
            --source-manifest release/browser-runtime-sources.json \
            --target "${{ matrix.target }}" \
            --archive "$BUILD_ROOT/bun-compiler.zip" \
            --output "$BUN_COMPILER"
          (
            cd cysjavis-pack/browserd
            bun install --frozen-lockfile
            bun build --compile --target="$BUN_TARGET" \
              --compile-executable-path="$BUN_COMPILER" \
              --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
              --external chromium-bidi --external electron \
              --outfile "$ENGINE" server.ts
          )

          CHROMIUM_URL="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["targets"][sys.argv[2]]["chromium_archive_url"])' \
            release/browser-runtime-sources.json "${{ matrix.target }}")"
          LICENSE_URL="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["chromium"]["license_url"])' \
            release/browser-runtime-sources.json)"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            -o "$BUILD_ROOT/chromium.zip" "$CHROMIUM_URL"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            -o "$BUILD_ROOT/Chromium-LICENSE" "$LICENSE_URL"

          python3 scripts/runtime-stage.py \
            --source-manifest release/browser-runtime-sources.json \
            --target "${{ matrix.target }}" \
            --supervisor "$SUPERVISOR" \
            --engine "$ENGINE" \
            --chromium-archive "$BUILD_ROOT/chromium.zip" \
            --chromium-license "$BUILD_ROOT/Chromium-LICENSE" \
            --playwright-root cysjavis-pack/browserd/node_modules/playwright-core \
            --source-revision "$GITHUB_SHA" \
            --output src-tauri/resources/browser-runtime

      - name: Install Browser Runtime minisign verifier (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # brew는 0.12를 붓는다(로그 실증). Windows는 0.12 고정 — 무암호 키 KDF 호환.
          brew install minisign
          minisign -v

      # choco의 minisign은 구버전이라 무암호(-W) 비밀키의 KDF를 못 읽어 -S 서명이 exit 2
      # "Unsupported key derivation function"로 실패한다(-V 검증은 통과). 공식 jedisct1 0.12
      # win64 zip을 다이제스트 고정으로 설치해 macOS(brew 0.12)와 동일한 키 KDF 호환을 보장한다.
      - name: Install Browser Runtime minisign verifier (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip'
          $expected = '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479'
          $zip = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $expected) { throw "minisign archive digest mismatch: expected $expected got $actual" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Join-Path $dest 'minisign-win64\x86_64\minisign.exe'
          if (-not (Test-Path $exe)) { throw "minisign.exe not found at $exe" }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $exe -Parent)
          & $exe -v
          if ($LASTEXITCODE -ne 0) { throw 'minisign verification failed' }

      - name: Materialize Browser Runtime release trust inputs (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          CYS_BROWSER_RUNTIME_SECRET_KEY_B64: ${{ secrets.CYS_BROWSER_RUNTIME_SECRET_KEY_B64 }}
          CYS_BROWSER_RUNTIME_PUBLIC_KEY_B64: ${{ secrets.CYS_BROWSER_RUNTIME_PUBLIC_KEY_B64 }}
          CYS_BROWSER_RUNTIME_KEY_ID_INPUT: ${{ secrets.CYS_BROWSER_RUNTIME_KEY_ID }}
          CYS_BROWSER_RUNTIME_POLICY_EPOCH_INPUT: ${{ secrets.CYS_BROWSER_RUNTIME_POLICY_EPOCH }}
          CYS_BROWSER_RUNTIME_EXPIRES_AT_INPUT: ${{ secrets.CYS_BROWSER_RUNTIME_EXPIRES_AT }}
        run: |
          set -euo pipefail
          : "${CYS_BROWSER_RUNTIME_SECRET_KEY_B64:?Browser Runtime secret key is missing}"
          : "${CYS_BROWSER_RUNTIME_PUBLIC_KEY_B64:?Browser Runtime public key is missing}"
          : "${CYS_BROWSER_RUNTIME_KEY_ID_INPUT:?Browser Runtime key id is missing}"
          : "${CYS_BROWSER_RUNTIME_POLICY_EPOCH_INPUT:?Browser Runtime policy epoch is missing}"
          : "${CYS_BROWSER_RUNTIME_EXPIRES_AT_INPUT:?Browser Runtime expiry is missing}"
          export CYS_BROWSER_RUNTIME_SECRET_KEY="$RUNNER_TEMP/browser-runtime-release.key"
          export CYS_BROWSER_RUNTIME_PUBLIC_KEY="$RUNNER_TEMP/browser-runtime-release.pub"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for source, destination in (
              ("CYS_BROWSER_RUNTIME_SECRET_KEY_B64", "CYS_BROWSER_RUNTIME_SECRET_KEY"),
              ("CYS_BROWSER_RUNTIME_PUBLIC_KEY_B64", "CYS_BROWSER_RUNTIME_PUBLIC_KEY"),
          ):
              Path(os.environ[destination]).write_bytes(base64.b64decode(os.environ[source], validate=True))
          PY
          chmod 600 "$CYS_BROWSER_RUNTIME_SECRET_KEY" "$CYS_BROWSER_RUNTIME_PUBLIC_KEY"
          {
            echo "CYS_BROWSER_RUNTIME_SECRET_KEY=$CYS_BROWSER_RUNTIME_SECRET_KEY"
            echo "CYS_BROWSER_RUNTIME_PUBLIC_KEY=$CYS_BROWSER_RUNTIME_PUBLIC_KEY"
            echo "CYS_BROWSER_RUNTIME_KEY_ID=$CYS_BROWSER_RUNTIME_KEY_ID_INPUT"
            echo "CYS_BROWSER_RUNTIME_POLICY_EPOCH=$CYS_BROWSER_RUNTIME_POLICY_EPOCH_INPUT"
            echo "CYS_BROWSER_RUNTIME_EXPIRES_AT=$CYS_BROWSER_RUNTIME_EXPIRES_AT_INPUT"
          } >> "$GITHUB_ENV"

      - name: Materialize Browser Runtime release trust inputs (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          CYS_BROWSER_RUNTIME_SECRET_KEY_B64: ${{ secrets.CYS_BROWSER_RUNTIME_SECRET_KEY_B64 }}
          CYS_BROWSER_RUNTIME_PUBLIC_KEY_B64: ${{ secrets.CYS_BROWSER_RUNTIME_PUBLIC_KEY_B64 }}
          CYS_BROWSER_RUNTIME_KEY_ID_INPUT: ${{ secrets.CYS_BROWSER_RUNTIME_KEY_ID }}
          CYS_BROWSER_RUNTIME_POLICY_EPOCH_INPUT: ${{ secrets.CYS_BROWSER_RUNTIME_POLICY_EPOCH }}
          CYS_BROWSER_RUNTIME_EXPIRES_AT_INPUT: ${{ secrets.CYS_BROWSER_RUNTIME_EXPIRES_AT }}
        run: |
          foreach ($name in @(
            'CYS_BROWSER_RUNTIME_SECRET_KEY_B64',
            'CYS_BROWSER_RUNTIME_PUBLIC_KEY_B64',
            'CYS_BROWSER_RUNTIME_KEY_ID_INPUT',
            'CYS_BROWSER_RUNTIME_POLICY_EPOCH_INPUT',
            'CYS_BROWSER_RUNTIME_EXPIRES_AT_INPUT'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Browser Runtime release input missing: $name"
            }
          }
          $secretPath = Join-Path $env:RUNNER_TEMP 'browser-runtime-release.key'
          $publicPath = Join-Path $env:RUNNER_TEMP 'browser-runtime-release.pub'
          [IO.File]::WriteAllBytes($secretPath, [Convert]::FromBase64String($env:CYS_BROWSER_RUNTIME_SECRET_KEY_B64))
          [IO.File]::WriteAllBytes($publicPath, [Convert]::FromBase64String($env:CYS_BROWSER_RUNTIME_PUBLIC_KEY_B64))
          @(
            "CYS_BROWSER_RUNTIME_SECRET_KEY=$secretPath",
            "CYS_BROWSER_RUNTIME_PUBLIC_KEY=$publicPath",
            "CYS_BROWSER_RUNTIME_KEY_ID=$env:CYS_BROWSER_RUNTIME_KEY_ID_INPUT",
            "CYS_BROWSER_RUNTIME_POLICY_EPOCH=$env:CYS_BROWSER_RUNTIME_POLICY_EPOCH_INPUT",
            "CYS_BROWSER_RUNTIME_EXPIRES_AT=$env:CYS_BROWSER_RUNTIME_EXPIRES_AT_INPUT"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: macOS credential contract (fail closed)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/release-credentials-check.py macos

      - name: Import Developer ID into ephemeral keychain
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/import-macos-signing-certificate.sh

      - name: Build, notarize, staple and normalize macOS candidate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build-macos-signed.sh "${{ matrix.target }}"
          mkdir -p release-candidate
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              cp "dist-mac/cys-${VERSION}-macos-arm64.dmg" \
                "release-candidate/cys_${VERSION}_aarch64.dmg"
              cp "dist-update/cys_${VERSION}_aarch64.app.tar.gz"* release-candidate/
              ;;
            x86_64-apple-darwin)
              cp "dist-mac/cys-${VERSION}-macos-x64.dmg" \
                "release-candidate/cys_${VERSION}_x64.dmg"
              cp "dist-update/cys_${VERSION}_x64.app.tar.gz"* release-candidate/
              ;;
            *) exit 2 ;;
          esac

      - name: Windows credential contract (fail closed)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python scripts/release-credentials-check.py windows

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.ALLOW_UNSIGNED_WINDOWS != '1'
        id: windows_certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER }}
        run: ./scripts/windows-authenticode.ps1 -Mode Import

      - name: Build Authenticode + RFC3161 Windows candidate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.windows_certificate.outputs.thumbprint }}
          WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PYTHONUTF8: '1'
        run: ./scripts/build-windows-signed.ps1

      # ★Windows CRT 발행 차단 게이트 — 서명 완료된 최종 출하 바이트(release-candidate)에서
      # ①VCRUNTIME 임포트 스윕(PE 파싱 — 정책 3바이너리 엄격 + app-local 규칙)과
      # ②3카테고리 수리 마커 6종(구베이스 빌드 차단)을 fail-closed 검증한다.
      # CI 러너에는 VC 재배포가 프리인스톨돼 있어 이 결함은 런타임 재현이 불가능하므로
      # 임포트 테이블 정적 검사가 유일한 결정론 게이트다. 서명/미서명(ALLOW_UNSIGNED_WINDOWS)
      # 양 모드 모두 실행한다(임포트 테이블은 서명과 무관).
      - name: Windows CRT gate (VCRUNTIME import sweep + 3-category fix markers)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          PYTHONUTF8: '1'          # Windows 콘솔 cp1252 에서 한국어 판정 출력 UnicodeEncodeError 방지(리포 관례)
          PYTHONIOENCODING: 'utf-8'
        run: |
          set -euo pipefail
          PY=python; command -v python3 >/dev/null 2>&1 && PY=python3
          SETUP=(release-candidate/cys_*_x64-setup.exe)
          [ ${#SETUP[@]} -eq 1 ] && [ -f "${SETUP[0]}" ] || { echo "setup.exe 후보 이상(글롭 미해소 포함): ${SETUP[*]}" >&2; exit 1; }
          "$PY" scripts/verify_win_crt.py --setup "${SETUP[0]}"

      - name: Remove ephemeral signing material
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Authenticode cert removal only runs when a cert was imported (signed mode).
          # Browser Runtime minisign key cleanup always runs — it exists in both modes.
          if ($env:ALLOW_UNSIGNED_WINDOWS -ne '1') {
            ./scripts/windows-authenticode.ps1 -Mode Remove -Thumbprint '${{ steps.windows_certificate.outputs.thumbprint }}'
          }
          foreach ($path in @($env:CYS_BROWSER_RUNTIME_SECRET_KEY, $env:CYS_BROWSER_RUNTIME_PUBLIC_KEY)) {
            if ($path -and (Test-Path -LiteralPath $path)) { Remove-Item -LiteralPath $path -Force }
          }

      - name: Remove ephemeral macOS keychain
        if: always() && matrix.platform == 'macos-latest'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/cys-release-signing.keychain-db" 2>/dev/null || true
          rm -f "${CYS_BROWSER_RUNTIME_SECRET_KEY:-$RUNNER_TEMP/browser-runtime-release.key}" \
            "${CYS_BROWSER_RUNTIME_PUBLIC_KEY:-$RUNNER_TEMP/browser-runtime-release.pub}"

      - name: Encrypt signed target handoff
        shell: bash
        env:
          RELEASE_HANDOFF_KEY: ${{ secrets.RELEASE_HANDOFF_KEY }}
        run: >-
          bash scripts/release-handoff.sh pack release-candidate
          "release-${{ matrix.target }}.tgz.enc"

      - name: Upload encrypted signed target handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release-${{ matrix.target }}.tgz.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # ── 무중단 팩 채널 아티팩트 (DESIGN-noshutdown-pack-update §2-①/§5/§7) ──
  # 기존 build/서명/updater 잡과 독립·가산. cys 바이너리를 네이티브로 빌드(팩 콘텐츠는 플랫폼 무관)해
  # 권위 manifest를 emit → cysjavis-pack/ 트리에서 결정론 tar 생성 → embed-vs-standalone 동일성 게이트
  # → pack-manifest.json을 minisign 서명(서명 대상=manifest, tar 아님) → 비공개 릴리스에 업로드.
  # relocate가 이 자산까지 공개 repo로 옮긴다(dist/* 일괄).
  pack-artifacts:
    needs: build
    runs-on: ubuntu-latest
    env:
      KEY_ID: '39E60A702949D6C3'    # 임베드 키링(cysjavis-pack/trusted-keys.json) key_id — manifest.key_id
      EXPIRES_DAYS: '90'            # 서명 신선도 유효창(§6-5 트레이드오프 — Replay 차단 vs 재발행 부담)
      # ★무중단 팩 채널 안전 하한(2026-07-12 오너 확정). seed-once 상태 보호(memory/·SESSION_STATE
      # 불가침)는 0.12.48+ 바이너리 코드다 — 공란이면 ≤0.12.47 구버전 pack-update가 사용자 상태를
      # vendor 골격으로 클로버한다(2026-07 실사고 계열). 새 팩이 더 새로운 바이너리 RPC에 의존할 때만 상향.
      # ★0.13.6 상향(능력 파리티 T3·T6): 이 릴리스 팩은 boot.formation.* feed 이벤트를 방출하는데
      #   배너 소멸 수신 핸들러(onDaemonEvent formation 인터셉트·bootbanner.ts)는 0.13.6 앱 빌드에만 있다.
      #   신팩+구앱(≤0.13.3)이면 배너가 소멸 신호를 못 받아 불멸 잔존(스큐). 게이트가 구앱에 신팩 설치를 막아 차단.
      #   security-floor.txt는 오너 승인 SOT라 무접촉(정책 래칫 변경 아님 — 앱+팩 동시 레인 권위 필드만 상향).
      # ★0.13.18 상향(S26 · 2026-07-26 실측 근거). 이 릴리스 팩의 `javis_orchestra.py`가 선언 생성 실패
      #   경로에서 **`cys todo-path --emit-decl` 실행을 지시**한다. 그 플래그는 이 릴리스에서 새로 생긴다:
      #     · `git show v0.13.17:src/bin/cys.rs | grep -c emit_decl` → 0
      #     · `git show v0.13.17:cysjavis-pack/bin/javis_orchestra.py | grep -c emit-decl` → 0
      #     · 작업 트리 `src/bin/cys.rs` → 4 (clap `#[arg(long)] emit_decl: bool`)
      #   즉 ≤0.13.17 바이너리 사용자가 이 팩을 받으면 지시대로 실행했을 때 unknown-flag 로 죽고,
      #   선언 없는 todo 가 남아 집계가 `unclaimed` 로 떨어진다. docs/RELEASE.md:154 불변 규칙
      #   ("새 팩이 더 새로운 바이너리 기능에 의존하면 그 버전으로 상향")의 직접 적용이다.
      #   ⚠이 값은 **이 태그의 버전과 같아야** 의미가 있다 — 범프가 0.13.18 이 아니면 여기도 함께 고쳐라.
      PACK_MIN_BINARY: '0.13.18'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confidential handoff key contract
        env:
          RELEASE_HANDOFF_KEY: ${{ secrets.RELEASE_HANDOFF_KEY }}
        run: bash scripts/release-handoff.sh check

      # ★시크릿/개인정보 발행 hard-gate (팩 바이너리 빌드·임베드 전 최우선). 아래 scan-pack-secrets.sh는
      # cysjavis-pack 트리만·개인 계정 핸들 허용이라, 여기서 whole-repo 엄격 스캔(secret-scan.sh --all:
      # 개인 홈경로·개인 프로필 디렉토리·개인 핸들·이메일·키토큰)을 fail-closed로 선행해 누출을 이중 차단한다.
      - name: Secret/PII scan (pre-build hard-gate)
        shell: bash
        run: bash scripts/secret-scan.sh --all

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: pack-artifacts

      # ★콘텐츠 스캔 발행 hard-gate (지점①/2 — 바이너리 빌드 전). git-추적 cysjavis-pack 전 트리가
      # build.rs로 cys 바이너리에 자동 임베드되므로, gitignore가 못 잡는 콘텐츠 누출(개인 홈경로·
      # 이메일·키토큰)을 바이너리 link 전에 fail-closed로 차단한다. 비0이면 잡 실패(발행 차단).
      - name: Scan pack content (pre-build hard-gate)
        run: bash scripts/scan-pack-secrets.sh

      # ★★배송 팩 계약 게이트(C-1 교정 · 2026-07-26) — **이 잡이 pack.tar.gz 를 실제로 만든다.**
      # 위 build 잡(macOS aarch64)에도 같은 게이트를 걸었지만, 그건 앱 바이너리 레그다. 사용자에게
      # 배달되는 **Python 파서 본체**는 이 잡이 tar 로 묶어 minisign 서명한다. 서명 **전에** 검증하지
      # 않으면 "파리티 0회로 봉인된 파서"가 그대로 나간다 — 설계 대장이 ✅ 라고 적은 보증이 배송
      # 시점에 부재한 상태다. 그 이음매를 여기서 닫는다.
      # 위치: 시크릿 스캔 직후 · `cargo clean`/`Build cys`/tar 생성/서명 **전부보다 앞**(fail-fast).
      # 러너: ubuntu-latest. 앞의 `Setup Rust`(stable)가 rustc 를 PATH 에 올려두므로 2언어 파리티를
      #   **여기서도 온전히** 돌린다(파이썬 단독 축소본 아님). 하네스는 rustc 부재 시 hard fail 하므로
      #   조용한 축소는 발생하지 않는다.
      # 존재-단언은 이 리포 관례(`[ -f "$f" ] || exit 1`)를 그대로 따른다 — untracked 누락으로 게이트가
      #   조용히 skip 되면 초록이 거짓말이 된다.
      - name: 배송 팩 계약 게이트 (선언 파서 2언어 파리티 + 유령집계 회귀)
        shell: bash
        run: |
          set -euo pipefail
          d="cysjavis-pack/bin/tests/fixtures/todo-decl"
          h="cysjavis-pack/bin/tests/parity_todo_decl.py"
          [ -d "$d" ] || { echo "골든 픽스처 디렉터리 누락: $d (계약 SOT 부재 = 실패)" >&2; exit 1; }
          [ -f "$d/expected.json" ] || { echo "계약 대장 누락: $d/expected.json (git add 누락 의심)" >&2; exit 1; }
          n="$(find "$d" -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')"
          [ "$n" -ge 15 ] || { echo "픽스처 케이스 부족(${n}종 · 설계 P3-1 최소 15종)" >&2; exit 1; }
          [ -f "$h" ] || { echo "파리티 하네스 누락: $h (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_decl_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_decl_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_decl.rs" ] || { echo "Rust 파서 누락: src/todo_decl.rs (git add 누락 의심)" >&2; exit 1; }
          command -v rustc >/dev/null || { echo "rustc 부재 — 2언어 파리티 불가(축소 실행 금지)" >&2; exit 1; }
          echo "== [pack] todo 선언 파서 2언어 파리티(골든 ${n}종 + 조합 1024건) =="
          if ! python3 "$h" --fuzz 1024 --list-mismatch 20; then
            echo "::error::[pack] 선언 파서 2언어 파리티 실패 — 배송될 Python 파서가 Rust 와 갈렸다. 서명 전 차단." >&2
            exit 1
          fi
          echo "== [pack] todo 선언·유령집계 소비자 회귀 6종 =="
          for t in test_todo_decl test_todo_stamp test_report_ghost test_hud_bridge_skew \
                   test_report_gate test_todo_shared_constants; do
            f="cysjavis-pack/bin/tests/$t.py"
            [ -f "$f" ] || { echo "선언·유령집계 테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
            echo "== [pack] declared-state test: $t =="
            if ! CYS_PACK_DIR="$(mktemp -d)" python3 "$f"; then
              echo "::error::[pack] 선언·유령집계 게이트 실패($t) — 배송 팩 회귀. 서명 전 차단." >&2
              exit 1
            fi
          done
          # ★todo 스캔 집합 파리티(S18) — 파서 파리티와 다른 표면("같은 파일을 보는가").
          echo "== [pack] todo 스캔 집합 2언어 파리티(C1·C2 동일 파일 집합) =="
          hs="cysjavis-pack/bin/tests/parity_todo_scan.py"
          [ -f "$hs" ] || { echo "스캔 파리티 하네스 누락: $hs (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_scan_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_scan_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_scan.rs" ] || { echo "스캔 단일 구현 누락: src/todo_scan.rs (git add 누락 의심)" >&2; exit 1; }
          if ! python3 "$hs"; then
            echo "::error::[pack] todo 스캔 집합 파리티 실패 — C1(보고기)과 C2(데몬)가 다른 파일을 본다. 서명 전 차단." >&2
            exit 1
          fi

      # ★cargo clean 선행 — rust-cache가 복원한 스테일 OUT_DIR/pack_all.rs(이전 cysjavis-pack 트리로
      # 생성된 임베드 테이블)가 재사용돼 manifest SOT를 오염시키는 회귀를 차단한다. 캐시 복원 직후에
      # target을 비워 build.rs 코드젠을 강제 재실행시킨다(스테일 생성표 무효화).
      - name: cargo clean (스테일 생성표 무효화)
        run: cargo clean

      # cys 바이너리(순수 Rust·Tauri 불요)를 러너에서 빌드 → pack-manifest emit에 사용.
      - name: Build cys
        run: cargo build --release --bin cys

      # 권위 manifest(임베드 PACK+PACK_SKILLS에서 파생)를 단일 SOT로 캡처. signed_at=지금,
      # expires_at=now+EXPIRES_DAYS, key_id=임베드 키링. min_binary_version=PACK_MIN_BINARY
      # (구 정책 '미지정=제약 없음'은 seed-once 이전 바이너리의 상태 클로버 경로라 폐기 — env 주석 참조).
      - name: Emit authoritative pack-manifest.json
        run: |
          set -euo pipefail
          SIGNED_AT="$(date -u +%s)"
          EXPIRES_AT="$(( SIGNED_AT + EXPIRES_DAYS * 86400 ))"
          ./target/release/cys pack-manifest \
            --key-id "$KEY_ID" \
            --signed-at "$SIGNED_AT" \
            --expires-at "$EXPIRES_AT" \
            --min-binary-version "$PACK_MIN_BINARY" \
            > pack-manifest.json
          echo "── pack-manifest.json (head) ──"; head -c 600 pack-manifest.json; echo

      # ★역방향 커버리지 게이트(디스크 고아 차단). 동일성 게이트(forward: manifest⊆disk)의 역방향 —
      # git-추적 cysjavis-pack/ 트리에서 build.rs가 임베드했어야 할 파일이 manifest에 누락(디스크 고아)
      # 됐는지 검출한다. ★SOT = `cys pack-manifest` 출력(임베드 권위 테이블) — 제외규칙을 python으로
      # 재구현해 임베드 집합을 독립 재유도하지 않는다. python은 (tracked − manifest) 잔차만 분류한다:
      # 잔차의 각 항목이 build.rs:41-44가 배제하는 알려진 카테고리(경로 컴포넌트가 '.'로 시작·tests·
      # __pycache__)면 정당한 제외, 아니면 디스크 고아 → exit 1. build.rs 제외규칙이 바뀌어 새 카테고리가
      # 생기면 잔차가 미설명으로 남아 게이트가 시끄럽게 실패(silent drift 차단).
      - name: Reverse coverage gate (disk orphan detection)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys

          man = json.load(open("pack-manifest.json"))
          embedded = set(man["files"])          # SOT: build.rs가 실제 임베드한 파일(권위 테이블)
          if not embedded:
              print("::error::manifest.files 비어있음 — 역커버리지 불가", file=sys.stderr); sys.exit(1)

          out = subprocess.run(
              ["git", "ls-files", "cysjavis-pack"],
              capture_output=True, text=True, check=True,
          ).stdout
          tracked = set()
          for line in out.splitlines():
              line = line.strip()
              if line.startswith("cysjavis-pack/"):
                  tracked.add(line[len("cysjavis-pack/"):])
          if not tracked:
              print("::error::git ls-files cysjavis-pack 비어있음 — 인덱스 부재?", file=sys.stderr); sys.exit(1)

          # build.rs:41-44 제외 카테고리(잔차 분류용 allowlist — 임베드 집합 재유도 아님).
          def is_excluded(rel):
              return any(c.startswith(".") or c == "tests" or c == "__pycache__"
                         for c in rel.split("/"))

          gap = tracked - embedded               # 추적되었으나 manifest에 없는 파일
          orphans = sorted(g for g in gap if not is_excluded(g))
          if orphans:
              print("::error::디스크 고아(git-추적이나 임베드 누락 — build.rs가 실었어야 함):", file=sys.stderr)
              for o in orphans:
                  print(f"::error::  {o}", file=sys.stderr)
              sys.exit(1)
          print(f"[역커버리지] tracked={len(tracked)} embedded={len(embedded)} "
                f"gap={len(gap)}(전부 제외규칙으로 설명) orphan=0 — 통과")
          PY

      # ★embed-vs-standalone 동일성 게이트 + 결정론 pack.tar.gz 생성(§5-1).
      # ① manifest.files(임베드 권위) ⇔ cysjavis-pack/ 온디스크 트리 sha256 전수 일치(드리프트 차단).
      # ② 정확히 manifest.files 집합만으로 결정론 tar(정렬·고정 mtime/uid) 생성.
      # ③ tar 재추출 sha256 == manifest.files 전수 일치(tar ⇔ manifest ⇔ embed 3자 폐포).
      # 하나라도 불일치 = exit 1 = 빌드 FAIL.
      - name: Identity gate + build pack.tar.gz
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys, tempfile

          ROOT = "cysjavis-pack"
          man = json.load(open("pack-manifest.json"))
          files = man["files"]
          if not files:
              print("::error::manifest.files 비어있음", file=sys.stderr); sys.exit(1)

          def sha256_file(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 16), b""):
                      h.update(chunk)
              return h.hexdigest()

          # ① embed 권위 vs 온디스크 cysjavis-pack/ 트리 전수 일치.
          for rel, want in files.items():
              src = os.path.join(ROOT, rel)
              if not os.path.isfile(src):
                  print(f"::error::manifest 등재 파일이 트리에 없음: {rel}", file=sys.stderr); sys.exit(1)
              got = sha256_file(src)
              if got != want:
                  print(f"::error::동일성 게이트 불일치 {rel}: embed {want} != tree {got}", file=sys.stderr)
                  sys.exit(1)
          print(f"[gate①] embed-vs-tree {len(files)}개 파일 sha256 전수 일치")

          # ② 정확히 manifest.files 집합만으로 결정론 tar 생성(GNU tar -T 파일목록).
          with open("pack-files.txt", "w") as f:
              for rel in sorted(files):
                  f.write(rel + "\n")
          subprocess.run([
              "tar", "--sort=name", "--owner=0", "--group=0", "--numeric-owner",
              "--mtime=UTC 2020-01-01", "-czf", "pack.tar.gz",
              "-C", ROOT, "-T", "pack-files.txt",
          ], check=True)
          print("[gate②] 결정론 pack.tar.gz 생성")

          # ③ tar 재추출 sha256 == manifest.files (집합·해시 양방향 일치).
          with tempfile.TemporaryDirectory() as td:
              subprocess.run(["tar", "-xzf", "pack.tar.gz", "-C", td], check=True)
              extracted = {}
              for dirpath, _, names in os.walk(td):
                  for n in names:
                      ap = os.path.join(dirpath, n)
                      rel = os.path.relpath(ap, td).replace(os.sep, "/")
                      extracted[rel] = sha256_file(ap)
              if set(extracted) != set(files):
                  miss = set(files) - set(extracted)
                  extra = set(extracted) - set(files)
                  print(f"::error::tar⇔manifest 집합 불일치 missing={sorted(miss)} extra={sorted(extra)}", file=sys.stderr)
                  sys.exit(1)
              for rel, want in files.items():
                  if extracted[rel] != want:
                      print(f"::error::tar sha256 불일치 {rel}: {extracted[rel]} != {want}", file=sys.stderr)
                      sys.exit(1)
          print(f"[gate③] tar⇔manifest⇔embed 3자 폐포 {len(files)}개 일치 — 동일성 게이트 통과")

          # ④ tar.gz digest를 서명 대상 manifest에 주입(WP-6 R-SIG-1) — ★서명 前 필수.
          #    프로덕션 검증기(pack_update_from_dir)가 전개 前 이 digest와 tarball sha256을 대조해
          #    미검증 tarball의 pre-auth traversal-write를 차단한다. digest는 서명 안에 들어가므로
          #    forge 불가·replay만 가능(packsig DIGEST_REQUIRED_EPOCH가 시간창으로 봉인).
          man["digest"] = sha256_file("pack.tar.gz")
          with open("pack-manifest.json", "w") as mf:
              json.dump(man, mf, ensure_ascii=False, indent=2)
              mf.write("\n")
          print(f"[gate④] tar.gz digest 주입 → manifest.digest={man['digest'][:16]}…")
          PY

      # ★콘텐츠 스캔 발행 hard-gate (지점②/2 — pack.tar.gz 생성 후 발행 전). 결정론 tar로 묶은 직후·
      # 서명·업로드 전에 한 번 더 fail-closed로 콘텐츠 누출을 차단한다(빌드 전 지점①과 이중 게이트 —
      # 빌드~tar 사이 어떤 변형도 발행 전 재검). 비0이면 잡 실패(발행 차단).
      - name: Scan pack content (pre-publish hard-gate)
        run: bash scripts/scan-pack-secrets.sh

      # pack-manifest.json을 minisign 서명(★서명 대상=manifest 단 하나·기존 TAURI_SIGNING_PRIVATE_KEY
      # 재사용). tauri signer는 base64 래핑 .sig를 내므로 base64 디코드해 표준 minisign 텍스트
      # (.minisig)로 변환한다 — packsig::verify(minisign_verify::Signature::decode)가 표준 형식을 기대.
      - name: Sign pack-manifest.json (minisign)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY 미설정 — 팩 서명 불가"; exit 1; }
          bunx @tauri-apps/cli@2 signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "" \
            pack-manifest.json
          # tauri .sig(전체 base64) → 표준 minisign 텍스트(.minisig).
          base64 --decode pack-manifest.json.sig > pack-manifest.json.minisig
          echo "── pack-manifest.json.minisig (head) ──"; head -2 pack-manifest.json.minisig

      # ★실서명→실검증 폐포 게이트(릴리스 전 결정론 검증). 방금 PRODUCTION 서명기
      # (bunx @tauri-apps/cli signer → base64 --decode → .minisig)가 낸 실제 아티팩트를
      # PRODUCTION 검증기(cys pack-update → packsig::verify_minisign → minisign_verify)에
      # --dry-run으로 통과시킨다 — 서명+신선도+파일sha256+역방향 커버리지를 적용 없이 검증.
      # packsig 단위테스트는 minisign 크레이트로만 서명하므로 tauri-signer+base64 경로(release.yml이
      # 실제로 배포하는 형식)는 여기서만 행사된다. 형식 불일치 시 정상 팩이 전수 거부(DoS)되는데,
      # 이 단계가 그 가정을 프로덕션 배포 전 비0 종료로 차단한다. dist 자산 업로드 전에 배치.
      - name: Verify signed pack end-to-end (real signer → real verifier)
        run: |
          set -euo pipefail
          ./target/release/cys pack-update --from . --dry-run
          echo "✅ 실서명 아티팩트가 실검증기를 통과(서명+신선도+파일+커버리지) — 폐포 확인"

      - name: Encrypt signed pack handoff
        env:
          RELEASE_HANDOFF_KEY: ${{ secrets.RELEASE_HANDOFF_KEY }}
        run: |
          set -euo pipefail
          mkdir release-pack-candidate
          cp pack.tar.gz pack-manifest.json pack-manifest.json.minisig release-pack-candidate/
          bash scripts/release-handoff.sh pack release-pack-candidate release-pack.tgz.enc

      - name: Upload encrypted signed pack handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-pack
          path: release-pack.tgz.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble-draft:
    needs: [build, pack-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confidential handoff key contract
        env:
          RELEASE_HANDOFF_KEY: ${{ secrets.RELEASE_HANDOFF_KEY }}
        run: bash scripts/release-handoff.sh check

      - name: Download all target handoffs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: candidate-input

      - name: Decrypt the four exact target handoffs
        shell: bash
        env:
          RELEASE_HANDOFF_KEY: ${{ secrets.RELEASE_HANDOFF_KEY }}
        run: |
          set -euo pipefail
          mapfile -d '' HANDOFFS < <(find candidate-input -type f -name '*.tgz.enc' -print0 | sort -z)
          [ "${#HANDOFFS[@]}" -eq 4 ] || {
            echo "expected four encrypted target handoffs, got ${#HANDOFFS[@]}" >&2
            exit 1
          }
          mkdir candidate-plain
          INDEX=0
          for HANDOFF in "${HANDOFFS[@]}"; do
            bash scripts/release-handoff.sh unpack \
              "$HANDOFF" "candidate-plain/handoff-$INDEX"
            INDEX=$((INDEX + 1))
          done

      - name: Assemble and verify exact release set
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUB_DATE="$(git show -s --format=%cI "$GITHUB_REF_NAME")"
          # 방어적 AppleDouble 제거(belt&suspenders): 상류 handoff tar 가 COPYFILE_DISABLE 로 이미
          # 차단하지만, 어떤 경로로든 '._*' 사이드카가 유입되면 release-assemble 의 정확-집합 검증이
          # extra 로 거부한다. 릴리스 자산이 아니므로 assemble 전에 결정론적으로 제거한다.
          find candidate-plain -type f -name '._*' -delete
          python3 scripts/release-assemble.py \
            --version "$VERSION" \
            --input candidate-plain \
            --output reviewed-candidate/release-out \
            --site-output reviewed-candidate/release-site \
            --repository "$SRC_REPO" \
            --pub-date "$PUB_DATE"
          python3 scripts/release-verify.py \
            --version "$VERSION" --release-dir reviewed-candidate/release-out
          shasum -a 256 reviewed-candidate/release-out/SHA256SUMS.txt \
            > reviewed-candidate/release-bundle.sha256

      - name: Encrypt reviewed candidate and homepage snapshot
        env:
          RELEASE_HANDOFF_KEY: ${{ secrets.RELEASE_HANDOFF_KEY }}
        run: >-
          bash scripts/release-handoff.sh pack reviewed-candidate
          "assembled-${GITHUB_REF_NAME}.tgz.enc"

      - name: Retain encrypted reviewed candidate and homepage snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assembled-${{ github.ref_name }}
          path: assembled-${{ github.ref_name }}.tgz.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create one non-public GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R "$SRC_REPO" >/dev/null 2>&1; then
            echo "release already exists; refusing to clobber an existing draft or public release" >&2
            exit 1
          fi
          BUNDLE_SHA="$(awk '{print $1}' reviewed-candidate/release-bundle.sha256)"
          gh release create "$GITHUB_REF_NAME" -R "$SRC_REPO" \
            --verify-tag --draft \
            --title "cys $GITHUB_REF_NAME" \
            --notes "Candidate only. SHA256SUMS digest: $BUNDLE_SHA"
          if ! gh release upload "$GITHUB_REF_NAME" -R "$SRC_REPO" \
            reviewed-candidate/release-out/*; then
            echo "candidate upload failed; deleting the incomplete draft" >&2
            gh release delete "$GITHUB_REF_NAME" -R "$SRC_REPO" --yes
            exit 1
          fi
