name: release

# 릴리스 통합(Phase 2 완결·2026-07-03) — 공개 소스 repo의 릴리스가 곧 공개 배포다.
#   build         : tag(vX.Y.Z) push → 앱 빌드·서명 → 이 repo에 public 릴리스 발행(updater 대상)
#   pack-artifacts: 팩 서명 자산 업로드 + latest 마킹 결정론 강제
#   (P0 이력: 과거 '--draft=수동 Publish 누락 위험'으로 자동 발행을 썼으나, v0.14.0(2026-07-28)부터
#    draft 생성까지만 CI — 공개 발행·latest 마킹은 오너 승인 후 별도 집행이 정책이다. 되돌리지 마라.
#    구 배포 repo cys-terminal-releases는 Archive — 마지막 미러가 구 설치본 이주 경로로 영구 생존.)
# 사용: 버전 8곳(수동 6 + Cargo.lock 2패키지) 범프(scripts/version-check.sh) 후  git tag vX.Y.Z && git push origin vX.Y.Z
#       (수동 실행도 가능 — Actions 탭 Run workflow)
# 활성 조건(시크릿):  TAURI_SIGNING_PRIVATE_KEY

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write          # 비공개 repo에 릴리스 생성·자산 업로드(+ relocate 단계 다운로드)에 필요

env:
  SRC_REPO: idoforgod/cys-terminal              # 공개 소스 repo = 공개 배포 원본 (updater 대상)
  # ★Tauri CLI 버전 고정 — 단일 SOT (W5-1 · 2026-08-29). NSIS 설치기 템플릿(installer.nsi)은 CLI
  #   버전에 결박되고, 훅(src-tauri/nsis-hooks.nsh)은 2.11.4 템플릿의 include 순서·define 계약
  #   (NSIS-CONTRACT.md §7)에 대해 컴파일 검증됐다. 종전 floating `@2` 는 오늘 2.11.4 로 해소돼
  #   이 고정은 동작 무변경이며, 목적은 미래의 무음 템플릿 교체(=오라클·배치 기계의 전제 붕괴) 차단.
  #   ★2.11.4(=0.14.27 을 빌드한 버전) 미만으로 낮추지 마라 — `$UpdateMode` 없는 구 템플릿 회귀
  #     = 인앱 업데이트가 '제거 후 설치'로 강등(무음 재앙 · IMPL-SPEC §W5-1).
  #   전파 지점: 이 파일의 build(Windows 직접 빌드)·pack-artifacts(signer sign) +
  #   scripts/build-macos-signed.sh(로컬 동치 기본값 — CI 는 이 env 가 덮는다). 값 변경은 세 곳 동시.
  TAURI_CLI_VERSION: '2.11.4'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 잡0 — windows-health 결박(설계 D-6 "릴리스 게이트 결박" · 2026-08-24 M4-3)
  #
  # ★무엇이 결함이었나: windows-health.yml 은 U-26 ① 로 태그(`v*`)에서 **돌게** 됐지만,
  #   그 파일 머리말이 스스로 적어 놓았듯 "이 잡은 release.yml 을 막지 않는다". GitHub Actions
  #   에는 워크플로 간 `needs` 가 없어서, 같은 태그 SHA 의 체크가 **나란히 빨갛게 뜰 뿐**
  #   릴리스 자산 생산은 그대로 진행됐다. 즉 Windows 부트스트랩 계약이 깨진 채로도 배포 자산이
  #   완성됐고, 발행을 막는 것은 오직 "사람이 적색을 봤기를 바라는 것" 뿐이었다.
  #
  # ★어떻게 막는가(차단이 실재하는 경로): 이 잡이 실패하면 `pack-artifacts` 가 돌지 않는다
  #   → 드래프트 릴리스에 `pack.tar.gz` · `pack-manifest.json` · `pack-manifest.json.minisig`
  #   **3종이 올라가지 않는다** → 공개 발행 레인(release-publish.yml)이 부르는
  #   `scripts/release-verify.py` 의 `REQUIRED_ASSETS` 에 그 셋이 등재돼 있어 검증이 실패한다
  #   (`release-verify.py:99-107`). 발행은 그 레인 하나뿐이므로 **공개 발행이 실제로 차단된다.**
  #   ⚠`build` 잡에는 걸지 않는다 — 걸면 20분짜리 빌드가 windows-health 완주 뒤로 직렬화된다.
  #     이 잡은 build 와 **병렬**로 폴링하므로 정상 경로의 추가 지연이 사실상 0 이다.
  #
  # ★fail-closed: 런이 없거나·미완주거나·성공이 아니면 전부 실패다. "재지 않았다" 를 통과로
  #   접는 것이 이 저장소가 반복해 낸 사고의 형태다(러너 '미측정 축 계약'과 같은 교리).
  #   수동 실행(workflow_dispatch)은 태그 push 가 아니라 windows-health 런이 자동 생성되지
  #   않는다 — 그 경우 **그 커밋으로 windows-health 를 먼저 돌리라고 지목하고 죽는다**
  #   (자동 dispatch 를 하지 않는 이유: `actions: write` 권한 확대는 별도 승인 사안이다).
  #
  # ★예산: ubuntu-latest 1대에서 API 폴링만 한다(빌드 0·체크아웃 0). 태그당 1회.
  windows-health-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read           # ★워크플로 런 조회에 필요(워크플로 기본 permissions 는 contents 뿐)
    steps:
      - name: windows-health 결과 결박 (같은 커밋 SHA · fail-closed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          WF="windows-health.yml"
          DEADLINE=$(( $(date +%s) + 2700 ))      # 45분 — Windows 콜드 cargo 빌드를 덮는 상한
          echo "대상: $GITHUB_REPOSITORY · workflow=$WF · head_sha=$SHA · event=$EVENT"
          while :; do
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?head_sha=$SHA&per_page=30" \
                      --jq '[.workflow_runs[] | {id, status, conclusion, url: .html_url}]')"
            N="$(jq 'length' <<<"$RUNS")"
            DONE="$(jq '[.[] | select(.status == "completed")]' <<<"$RUNS")"
            NDONE="$(jq 'length' <<<"$DONE")"
            if [ "$NDONE" -gt 0 ]; then
              BAD="$(jq '[.[] | select(.conclusion != "success")]' <<<"$DONE")"
              if [ "$(jq 'length' <<<"$BAD")" -gt 0 ]; then
                echo "::error::windows-health 가 이 커밋에서 성공하지 않았다 — 릴리스 자산 생산을 중단한다."
                jq -r '.[] | "  - conclusion=\(.conclusion) \(.url)"' <<<"$BAD"
                exit 1
              fi
              echo "✅ windows-health 성공 확인($NDONE 런) — pack-artifacts 진행 허용"
              jq -r '.[] | "  - \(.url)"' <<<"$DONE"
              exit 0
            fi
            if [ "$N" -eq 0 ] && [ "$EVENT" != "push" ]; then
              echo "::error::이 커밋($SHA)에 windows-health 런이 없다. 수동 릴리스 경로에서는 자동 생성되지"
              echo "::error::않는다 — 먼저 'gh workflow run windows-health.yml --ref <이 커밋의 ref>' 로 돌려라."
              echo "::error::(측정하지 않은 것을 통과로 접지 않는다 — fail-closed.)"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::windows-health 결과를 45분 안에 얻지 못했다(발견 런 $N · 완주 0)."
              echo "::error::측정 불능은 통과가 아니다 — 릴리스 자산 생산을 중단한다(fail-closed)."
              exit 1
            fi
            echo "  … 대기(발견 $N · 완주 $NDONE) — 30s 후 재조회"
            sleep 30
          done

  build:
    strategy:
      fail-fast: false     # 한 타깃이 실패해도 나머지는 계속
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin    # Apple Silicon
          - platform: macos-latest
            target: x86_64-apple-darwin     # Intel — arm64 러너에서 크로스 빌드(bundle-prep이 CYS_TARGET 사용)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc  # Windows x64 — NSIS 자기완결(PortableGit+Python 동봉).
                                            # createUpdaterArtifacts=true(tauri.windows.conf.json) + 서명키로
                                            # setup.exe(.sig) 생성 → tauri-action이 latest.json에 windows-x86_64 병합.
                                            # Authenticode 미서명(인증서 미보유) — SmartScreen 경고는 감수.
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ★S27 교정(2026-07-26) — `src/` 모듈 선언 ↔ git 추적 파일 정합 사전 게이트.
      # **왜 첫 잡의 첫 스텝인가**: `src/lib.rs` 가 `pub mod X;` 를 선언했는데 `src/X.rs` 가 미추적이면
      # 태그 체크아웃에는 그 파일이 없고 **전 레그(macOS×2·Windows)가 컴파일 즉사**한다. 종전에는
      # 그 사실이 `cargo build` 까지 20분 걸려서야 드러났고, 실패 로그는 원인(=git add 누락)을
      # 가리키지 않았다. 실측 사례: v0.13.17 작업 브랜치에서 `src/lib.rs:16 pub mod todo_scan;` 이
      # 이미 있는데 `src/todo_scan.rs` 는 untracked 였다.
      # 팩 테스트에는 존재-단언 관례(`[ -f "$f" ] || exit 1`)가 있는데 `src/` 에만 없던 공백을 닫는다.
      # SOT 는 **git 인덱스**(`git ls-files`)다 — 작업 트리 존재는 일부러 근거로 쓰지 않는다.
      #   정확히 그 괴리(디스크엔 있고 인덱스엔 없음)가 이 게이트의 표적이기 때문이다.
      # ⚠정직한 한계 — 이건 컴파일러가 아니다. 다음은 못 잡거나 보지 않는다:
      #   ①인라인 `mod x { … }`(중괄호)는 파일을 요구하지 않으므로 대상 아님
      #   ②`#[path = "…"]` 로 경로를 덮어쓴 선언은 **해석하지 않고 skip** 하며 그 사실을 로그에 남긴다
      #   ③`cfg` 조건부 모듈도 무조건 파일을 요구한다(추적돼 있으면 통과하므로 위양성은 없다)
      #   ④src 밖(src-tauri/·browser-runtime/)은 이 게이트 범위가 아니다
      # ⚠백포트 적응(0.14.2 레인) — 원 릴리스 레인은 ubuntu 전용 `release-contracts` 선행 잡의 첫 스텝에
      #   이 게이트를 뒀다. 이 레인에는 그 잡이 없어 **첫 잡(build)의 checkout 직후**로 옮겼고, 레그는
      #   **macOS 네이티브(aarch64) 1회로 고정**한다. 이유는 정직하게: Windows 레그의 Git Bash 에는
      #   `python3` 이름이 없고(이 파일 다른 스텝도 `PY=python; command -v python3 … && PY=python3` 로 회피),
      #   `os.path.join` 이 백슬래시 경로를 만들어 `git ls-files`(슬래시)와 대조가 깨져 **위양성**이 난다.
      #   POSIX 레그 1회로도 목적(=미추적 모듈을 컴파일 전에 이름으로 지목)은 온전히 달성된다.
      - name: src 모듈 선언 ↔ 추적 파일 정합 (미추적 즉사 사전 차단)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          out = subprocess.run(["git", "ls-files", "src"],
                               capture_output=True, text=True, check=True).stdout
          tracked = set(l.strip() for l in out.splitlines() if l.strip())
          rs = sorted(p for p in tracked if p.endswith(".rs"))
          if not rs:
              print("::error::git ls-files src 에 .rs 가 없다 — 인덱스 부재?", file=sys.stderr)
              sys.exit(1)

          # 열 0에서 시작하고 `;`로 끝나는 선언만 본다(인라인 `mod x { … }`는 파일 불요).
          DECL = re.compile(r'^(?:pub(?:\([^)]*\))?\s+)?mod\s+([A-Za-z_][A-Za-z0-9_]*)\s*;')
          missing, skipped = [], []
          for p in rs:
              with open(p, encoding="utf-8", errors="replace") as f:
                  lines = f.read().splitlines()
              base = os.path.basename(p)
              # lib.rs·main.rs·mod.rs 는 디렉터리 자신을 대표한다 → 형제 경로.
              # 그 외 `foo.rs` 의 자식 모듈은 `foo/` 아래에 산다(Rust 2018 경로 규칙).
              d = os.path.dirname(p) if base in ("lib.rs", "main.rs", "mod.rs") else p[:-3]
              for i, line in enumerate(lines):
                  m = DECL.match(line)
                  if not m:
                      continue
                  if i > 0 and lines[i - 1].lstrip().startswith("#[path"):
                      skipped.append("%s:%d %s (#[path] 재지정 — 미해석)" % (p, i + 1, m.group(1)))
                      continue
                  name = m.group(1)
                  cands = [os.path.join(d, name + ".rs"), os.path.join(d, name, "mod.rs")]
                  if any(c in tracked for c in cands):
                      continue
                  on_disk = [c for c in cands if os.path.exists(c)]
                  missing.append((p, i + 1, name, cands, on_disk))

          for s in skipped:
              print("  (skip) %s" % s)
          sys.stdout.flush()
          if missing:
              print("::error::선언된 모듈의 소스가 git 인덱스에 없다 — 이 상태로 태그하면 전 레그 컴파일 즉사:",
                    file=sys.stderr)
              for p, ln, name, cands, on_disk in missing:
                  why = ("작업 트리엔 있으나 **미추적**: %s → `git add %s`" % (on_disk[0], on_disk[0])
                         if on_disk else "작업 트리에도 없음(오타·삭제 잔재 의심)")
                  print("::error::  %s:%d `mod %s;` — %s" % (p, ln, name, why), file=sys.stderr)
                  print("::error::    기대 경로: %s" % " 또는 ".join(cands), file=sys.stderr)
              sys.exit(1)
          print("✅ src 모듈 선언 ↔ 추적 파일 정합: %d개 .rs 스캔, 미해결 0" % len(rs))
          PY

      # ★시크릿/개인정보 발행 hard-gate (빌드·임베드 전 최우선 — 셋업보다도 먼저 fail-fast).
      # git-추적 전 트리를 fail-closed로 스캔해 개인 홈경로·개인 프로필 디렉토리·개인 계정
      # 핸들·이메일·키토큰 누출을 바이너리 link/번들 전에 차단한다. 비0이면 워크플로우 실패
      # (발행 차단). Windows 매트릭스 레그도 Git Bash로 실행하도록 shell: bash 고정.
      - name: Secret/PII scan (pre-build hard-gate)
        shell: bash
        run: bash scripts/secret-scan.sh --all

      # 버전 SOT 8곳(수동 6 + Cargo.lock 2패키지) 일치 hard-gate — 드리프트인 채 발행 차단
      # (v0.12.11에서 wxs 2곳 0.12.10 잔류
      # 실증·2026-07-05). 태그 push면 태그=소스 버전까지 단언, workflow_dispatch(브랜치)면 상호 일치만.
      - name: Version SOT check (drift hard-gate)
        shell: bash
        run: |
          # ★음성 대조 선행(2026-09-04 W-C R2 ②): 아래 version-check.sh 를 발행 차단 근거로
          #   신뢰하기 **직전에**, 그 게이트가 8곳 중 하나만 누락돼도 실제로 죽는지 증명한다.
          #   통과만 보이는 게이트는 '언제나 초록인 검사'와 구별되지 않는다. 하네스는 임시
          #   디렉터리 사본만 변조하므로 작업 트리를 건드리지 않는다(stdlib 전용·네트워크 0).
          python3 scripts/tests/test_version_sot_mutation.py
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            sh scripts/version-check.sh "$GITHUB_REF_NAME"
          else
            sh scripts/version-check.sh
          fi

      # ★T6(v2 §12 이월): 인터림 트리 태그 거부 게이트 — kept-drift/merge3 부분 랜딩 회귀 방지.
      #   0.14.29 T2~T4 는 변형(enum)을 먼저 넣고 원장 kind·병합 엔진을 뒤에 배선하는 순서로
      #   랜딩했다 — 그 중간 형상(KeepDrift 변형만 있고 원장 kind "kept-drift" 부재 · Merge3
      #   변형만 있고 merge3:: 배선 부재)이 미래의 부분 revert·cherry-pick 으로 재현된 채 태그로
      #   봉인되는 것을 grep 게이트로 거부한다. 태그 레인 한정 — 브랜치 개발의 중간 형상은 막지
      #   않는다(cargo test 에 넣지 않는 이유이기도 하다). 현 트리는 양쪽 통과(실측: KeepDrift
      #   13건 ∧ "kept-drift" 9건 · FileAction::Merge3 3곳 ∧ crate::merge3:: 배선 실재).
      - name: Interim-tree tag gate (kept-drift/merge3 partial-landing hard-gate)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if grep -q "KeepDrift" src/pack.rs && ! grep -q '"kept-drift"' src/pack.rs; then
              echo '::error::인터림 트리 — KeepDrift 변형은 있는데 원장 kind "kept-drift" 가 없다(부분 랜딩). 태그 거부.'
              exit 1
            fi
            if grep -q "FileAction::Merge3" src/pack.rs && ! grep -q "merge3::" src/pack.rs; then
              echo '::error::인터림 트리 — Merge3 변형은 있는데 merge3:: 엔진 배선이 없다(부분 랜딩). 태그 거부.'
              exit 1
            fi
          fi

      # 프런트엔드 번들러(ui/build.sh가 bun 사용). beforeBuildCommand가 bun을 호출하므로 PATH 필수.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # UI 회귀 게이트 — 한글 IME 리듀서(ui/src/ime.ts) 프로필 A/B/C/Windows 시퀀스 테스트.
      # 실패=릴리스 차단. 배경: WKWebView 프로필별 자모 유출·이중전송 재발 방지(fix/ime-hybrid-profile).
      - name: UI 회귀 테스트 (bun test)
        shell: bash
        run: cd ui && bun test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      # ★W6/E1 phoenix host-level 로직 게이트 (macOS 네이티브 arm64 레그 1회 · 스텝 정의 — 실 실행은 릴리스 시 확인).
      # 실 cysd 를 격리 상태 디렉터리에서 kill→재기동해 auto-restore 부활·STRICT 주입·no-target NOOP·cross-layer
      # 재시도·C2 sentinel·E3 GC·E2 스케줄 배선을 커밋 테스트로 실증(a07cc7f Not-tested 봉인).
      # ★codex W6 minor: 이 게이트는 **host-아키텍처 무관 로직**(phoenix python + Rust auto-restore 단위)을
      #   검증한다 — host debug(arm64) 바이너리로 충분하며 matrix.target 별 sidecar 는 뒤 build 스텝이 컴파일한다.
      #   따라서 두 macOS 레그 중복 실행을 피해 **네이티브 레그(aarch64)에서 1회만** 돈다(x86_64 레그는 크로스빌드
      #   sidecar 컴파일만 담당·동일 host arm64 재검증 무의미). target 별 실기 E2E 는 W5(Windows)·릴리스 스모크 소관.
      - name: phoenix host-level 로직 게이트 (macOS 네이티브)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          cargo build --bin cys --bin cysd
          export PHOENIX_HARNESS_CYSD="$PWD/target/debug/cysd"
          export PATH="$PWD/target/debug:$PATH"
          export PHOENIX_CYS="$PWD/target/debug/cys"
          # ★커밋된 phoenix 테스트 전건 실행(glob) — 하드코딩 리스트는 신규 웨이브 테스트(w2/w3/c6/as3 …)를 조용히
          #   누락시키는 위험이 있어 tests/ 디렉터리를 스캔한다(정직성: 게이트가 실제 커밋 테스트 전부를 돈다).
          for t in cysjavis-pack/bin/tests/test_phoenix_*.py; do
            echo "== phoenix test: $(basename "$t") =="
            CYS_PACK_DIR="$(mktemp -d)" python3 "$t"
          done
          # Rust auto-restore 단위(재시도 seam·env 주입·B1·B3) + pack 소유권(B2).
          # ★--skip hwmon:: — hwmon 테스트는 실 GPU 전제(gpu.cores>0 단언)라 가상 러너에서 환경 FAIL
          #   (v0.12.21 release run 28792111282 실증 — phoenix 게이트와 무관한 host 하드웨어 의존).
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cysd -- --test-threads=1 --skip hwmon::
          CYS_PACK_DIR="$(mktemp -d)" cargo test --lib -- --test-threads=1
          # ★A10 승격(2026-08-16): ci-branch 리허설 1사이클 green 실증(feat/v4-repair 18dc9a6 run
          #   success — 115 passed/0 failed) 후 릴리스 레인 편입. 환경 의존 실패 발견 시 위
          #   --skip hwmon:: 선례 패턴으로 격리하라(테스트 삭제 금지).
          CYS_PACK_DIR="$(mktemp -d)" cargo test --bin cys -- --test-threads=1

      # ── ★todo 선언·유령집계 게이트(C-1 교정 · 2026-07-26) ──
      # **왜 여기 있어야 하는가**: 이 게이트 3종은 `ci-branch.yml` 에만 있었고 그 워크플로는
      # `push: branches: ['feat/**']` 로만 기동한다 — **태그 push 로는 한 번도 돌지 않는다.**
      # 즉 결함이 사용자에게 도달하는 유일한 경로(태그)에는 보증이 0이었다. Rust 파서는
      # 위 `cargo test --lib` 가 expected.json 대조로 묶는데 **실제 배송되는 Python 파서는
      # 파리티 검증 0회로 서명·봉인**되던 비대칭을 여기서 닫는다.
      # 존재-단언은 이 리포의 관례(`[ -f "$f" ] || exit 1`)와 동형이다(untracked 누락 = 초록 거짓말 차단).
      # ⚠백포트 적응(0.14.2 레인) — 원 레인은 ubuntu `release-contracts` 잡의 "Release closure unit and
      #   static tests" 스텝 말미에 이 블록을 뒀다. 이 레인에는 그 잡·스텝이 없어, 같은 역할(팩 python
      #   스위트 + rust 단위를 태그 경로에서 실행)을 맡는 **바로 위 phoenix 게이트 직후의 독립 스텝**으로
      #   옮겼고 레그는 macOS 네이티브 1회로 고정한다(rustc·python3 는 앞 스텝이 이미 PATH 에 올렸다).
      - name: todo 선언·유령집계 계약 게이트 (2언어 파리티 + 소비자 회귀)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          echo "== todo 선언 파서 2언어 파리티(골든 + 조합 1024건) =="
          d="cysjavis-pack/bin/tests/fixtures/todo-decl"
          h="cysjavis-pack/bin/tests/parity_todo_decl.py"
          [ -d "$d" ] || { echo "골든 픽스처 디렉터리 누락: $d (계약 SOT 부재 = 실패)" >&2; exit 1; }
          [ -f "$d/expected.json" ] || { echo "계약 대장 누락: $d/expected.json (git add 누락 의심)" >&2; exit 1; }
          # `ls "$d"/*.md` 는 0건일 때 pipefail 로 메시지 없이 죽는다 — find 는 0건에서도 정상 종료.
          n="$(find "$d" -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')"
          [ "$n" -ge 15 ] || { echo "픽스처 케이스 부족(${n}종 · 설계 P3-1 최소 15종)" >&2; exit 1; }
          [ -f "$h" ] || { echo "파리티 하네스 누락: $h (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_decl_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_decl_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_decl.rs" ] || { echo "Rust 파서 누락: src/todo_decl.rs (git add 누락 의심)" >&2; exit 1; }
          # 하네스가 rustc 를 단독 호출한다(크레이트 의존 0 불변식의 기계 증명). 이 레그는 앞의
          # `Setup Rust` 스텝이 툴체인을 깔았으므로 PATH 에 rustc 가 있다 — 없으면 하네스가 hard fail 한다.
          if ! python3 "$h" --fuzz 1024 --list-mismatch 20; then
            echo "::error::선언 파서 2언어 파리티 실패 — Python 정본과 Rust 구현이 갈렸다. 릴리스 차단." >&2
            exit 1
          fi
          # 선언·스탬프·유령집계 소비자 회귀 7종(+D1 import 가드 잠금). 여기서만 핀되는 행동:
          #   · orphan-scope·미선언이 nodes[] 에 남는다(빼면 false QUIET → 세션 주차)
          #   · 완료 파일이 미완 파일을 shadow 하지 않는다 · 집계 밖 미완 존재 시 QUIET/park 금지
          #   · 라벨은 선언 owner(role 라벨공간 하이픈 조인 파탄 차단)
          #   · 데몬 payload verdict 선택 필드에 대한 HUD 브리지 구/신 스큐 내성(ADR-2)
          #   · 게이트 대장 회귀 65종(javis_report_gate + javis_gate_check)
          # CYS_PACK_DIR 을 빈 임시 디렉터리로 고정하는 이유는 위 게이트들과 같다 — 러너의 실제
          # 팩·홈 디렉터리에 판정이 의존하면 초록이 근거가 되지 못한다.
          echo "== todo 선언·유령집계 소비자 회귀 7종(+import 가드)+부트체인 =="
          # ★test_bootstrap_chain 등재(2026-08-12 R3 확정): 위계 폴백(부서 자동 생성)의 유일한
          #   회귀 핀 세트가 종전엔 CI 어느 레인에서도 돌지 않았다 — 배송 팩이 검증 0회로 서명됐다.
          # ★W8(2026-08-16): v4-repair 스위트 3종 편입 — 부서 이름검증(`launch --help` 실사고 회귀 핀)·
          #   preflight C03 두 축 상태기계·CONTENT_PINS↔디렉티브 패리티(P0 스큐 봉인 — 신선 설치
          #   C03 FAIL 온보딩 오염의 재발 차단). 격리 HOME/목 바이너리 하네스(라이브 무접촉).
          # ★repair-w3(2026-08-29 · v0.14.28): 수리 회귀 핀 2종 편입 — test_hud_bridge_backoff
          #   (W2 replay_gap 재스폰 스톰 지수 백오프 — ★R2 라운드2에서 _reader 배선 통합 2건 추가)
          #   · test_wakeup_liveness(★R2 라운드2 신설 — _target_alive 3값 판정+drain zombie 가드
          #     행동 정본. 종전 유일 가드였던 rust substring 핀은 M8 변이에 초록이라 행동을 못
          #     지킨다 — lib.rs 역할 경계 주석) · test_preflight_c11b_seal(W3c 번들 봉인
          #   심링크 이관). 대상 javis_hud_bridge.py·javis_preflight.py 는 배송 팩 내용물인데
          #   두 핀 모두 어느 CI 레인에서도 0회 실행이었다("안 도는 검체는 게이트가 아니다" —
          #   W-CI 2026-08-21 동형 격차의 재발). 3완전 레인 동시·대칭 등재(release 는 양 루프) ·
          #   격리 스크래치 하네스(라이브 무접촉) · 실측 각 ≤0.1s.
          # ★2R-6(2026-08-31 · 0.14.29 성찰): test_preflight_c62_c68_ledger 편입 — T5 의 C62
          #   conflicted/quarantined 신설 판정·at-rest 병기와 T3 의 C68 영속 kind 기한 제외
          #   산식이 파이썬 검체 0건(무측정 변경)이던 격차 봉합. 픽스처 원장·뮤테이션
          #   양방향(PASS↔WARN) 검증 · 3완전 레인 동시·대칭 등재(release 는 양 루프) ·
          #   격리 CYS_PACK_DIR 하네스(라이브 무접촉) · 실측 0.01s.
          for t in test_todo_decl test_todo_stamp test_report_ghost test_hud_bridge_skew \
                   test_report_gate test_todo_shared_constants test_import_guard test_radio test_scrub \
                   test_bootstrap_chain test_snapshot \
                   test_dept_name_guard test_preflight_c03_states test_content_pins_parity \
                   test_hud_bridge_backoff test_preflight_c11b_seal test_wakeup_liveness \
                   test_preflight_c62_c68_ledger; do
            f="cysjavis-pack/bin/tests/$t.py"
            [ -f "$f" ] || { echo "선언·유령집계 테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
            echo "== declared-state test: $t =="
            if ! CYS_PACK_DIR="$(mktemp -d)" python3 "$f"; then
              echo "::error::선언·유령집계 게이트 실패($t) — 진행률 집계 회귀. 릴리스 차단." >&2
              exit 1
            fi
          done
          # ★todo **스캔 집합** 파리티(S18) — 위 파서 파리티와 **다른 표면**이다. 그쪽은 "같은 파일을
          # 같게 판정하는가", 여기는 "**애초에 같은 파일을 보는가**"를 묻는다. 실측 결함: 배제 정책은
          # 이미 같았는데 데몬이 정본 위치 `${CYS_PACK_DIR}/round`를 스캔 루트에 갖고 있지 않아, 데몬에
          # 배선한 선언 판정·유령 배제·verdict/owner payload 가 정본 todo 에는 한 번도 적용되지 않았다.
          echo "== todo 스캔 집합 2언어 파리티(C1·C2 동일 파일 집합) =="
          hs="cysjavis-pack/bin/tests/parity_todo_scan.py"
          [ -f "$hs" ] || { echo "스캔 파리티 하네스 누락: $hs (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_scan_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_scan_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_scan.rs" ] || { echo "스캔 단일 구현 누락: src/todo_scan.rs (git add 누락 의심)" >&2; exit 1; }
          if ! python3 "$hs"; then
            echo "::error::todo 스캔 집합 파리티 실패 — C1(보고기)과 C2(데몬)가 다른 파일을 본다. 릴리스 차단." >&2
            exit 1
          fi

      # ★W8: CEO_TEMPLATE 재합성 드리프트 게이트(스펙 v4 §D2 · gen --check) — **릴리스 차단**.
      #   재합성(생성기) 결과가 커밋본과 1바이트라도 다르면 태그 레인이 멈춘다 — 수동 편집·fragment
      #   드리프트가 팩으로 서명·봉인되는 경로 차단(드리프트 게이트가 fan-out 문안까지 바이트 봉인하는
      #   구조라, 게이트 없는 재합성은 A3×A7 계열 사고의 재발 문이다). --check 계약(생성기 소유=D2
      #   티켓): ①드리프트(재합성==커밋본) ②표지 핀 구·신 템플릿 공통 실존 ③bash 스니펫 실행 스모크.
      #   ci-branch.yml 의 같은 게이트가 조기 경보, 여기가 최종 차단선. 레그는 macOS 네이티브 1회
      #   (게이트 대상 = 리포 커밋본 텍스트라 OS 무관 — 위 계약 게이트와 같은 레그 고정 근거).
      - name: CEO_TEMPLATE 재합성 드리프트 게이트 (gen --check · 릴리스 차단)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          g="scripts/gen_ceo_template.py"
          [ -f "$g" ] || { echo "::error::재합성 생성기 누락: $g (D2 티켓 산출물 — git add 누락 의심)" >&2; exit 1; }
          python3 "$g" --check

      # Windows 자기완결 런타임 동봉 (windows-build.yml과 동일 절차 — PortableGit + Python embeddable).
      # tauri.windows.conf.json bundle.resources("runtime/")가 이 트리를 NSIS에 싣는다.
      - name: 동봉 런타임 준비 (PortableGit + Python embeddable — Windows 전용)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          RT="src-tauri/runtime"
          rm -rf "$RT"; mkdir -p "$RT"
          echo "== PortableGit 2.55.0 (bash + coreutils + git) =="
          curl -fL -o pg.7z.exe "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.1/PortableGit-2.55.0-64-bit.7z.exe"
          7z x pg.7z.exe -o"$RT/git" -y >/dev/null
          rm -rf "$RT/git/mingw64/share/doc" "$RT/git/usr/share/doc" \
                 "$RT/git/mingw64/share/man" "$RT/git/usr/share/man" 2>/dev/null || true
          echo "== Python 3.12.10 embeddable (stdlib + _sqlite3 + ssl) =="
          curl -fL -o py.zip "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          7z x py.zip -o"$RT/python" -y >/dev/null
          cp "$RT/python/python.exe" "$RT/python/python3.exe"
          # embeddable ._pth: 아래 3줄이 sys.path 를 확정한다(표준 경로 계산 우회).
          # ⚠`.` 은 **이 ._pth 파일이 있는 디렉터리(= 번들 python 루트)** 를 뜻한다 — 스크립트 폴더가 아니다.
          #   따라서 팩 bin/ 형제 모듈 import 는 이 줄로 해결되지 않는다(2026-07-29 Windows 실측:
          #   `ModuleNotFoundError: No module named 'javis_scrub'`). 해결 주체는 각 스크립트의 sys.path
          #   가드다(cysjavis-pack/bin/*.py · 회귀 잠금 tests/test_import_guard.py).
          # ★내용 3줄 동결 — `import site` 를 빼면 pip·site-packages 가 죽어 앱 내 CLI 설치가 붕괴한다.
          printf 'python312.zip\n.\nimport site\n' > "$RT/python/python312._pth"
          # ── pip 부트스트랩 (embeddable은 pip 미포함 → 'No module named pip' 방지) ──
          curl -fL -o "$RT/python/get-pip.py" "https://bootstrap.pypa.io/get-pip.py"
          "$RT/python/python.exe" "$RT/python/get-pip.py" --no-warn-script-location
          rm -f "$RT/python/get-pip.py"
          # ── uv/uvx 동봉 (serena·nlm-mcp-cli가 uvx 전제 → C20/C43 FAIL 방지). runtime/python은 cysd가 PATH 주입. ──
          curl -fL -o uv.zip "https://github.com/astral-sh/uv/releases/download/0.11.26/uv-x86_64-pc-windows-msvc.zip"
          7z x uv.zip -o"$RT/python" -y >/dev/null
          ls -la "$RT/python/uv.exe" "$RT/python/uvx.exe"
          # ── node + npm/npx 동봉 (mac 0.7.0 파리티 — 순정 Windows엔 node 부재. runtime/node는 cysd가 PATH 주입) ──
          echo "== Node.js 22.17.1 (npm/npx — win-x64, mac과 동일 핀) =="
          curl -fL -o node.zip "https://nodejs.org/dist/v22.17.1/node-v22.17.1-win-x64.zip"
          7z x node.zip -o"$RT" -y >/dev/null
          mv "$RT/node-v22.17.1-win-x64" "$RT/node"
          ls -la "$RT/node/node.exe" "$RT/node/npm.cmd"
          mkdir -p "$RT/LICENSES"
          printf 'Bundled runtimes and their licenses:\n- Git for Windows (git): GPLv2 (https://github.com/git-for-windows/git)\n- MSYS2 bash + GNU coreutils: GPLv3\n- CPython (embeddable): PSF License (https://www.python.org)\n- pip (get-pip bootstrap): MIT\n- uv (astral-sh): Apache-2.0 OR MIT (https://github.com/astral-sh/uv)\n- Node.js (+npm/npx): MIT (https://nodejs.org)\nWritten offer for corresponding source: contact the distributor.\n' > "$RT/LICENSES/BUNDLED-RUNTIMES.txt"
          ls -la "$RT/git/usr/bin/bash.exe" "$RT/git/cmd/git.exe" "$RT/python/python3.exe"
          # ★훅 bash 하드 단언 (2026-08-01 · 윈도우 감사 T3-3 · windows-build.yml 과 동일 게이트).
          # Claude Code 는 훅을 PortableGit 런처 bash(`runtime\git\bin\bash.exe`)로 띄운다 —
          # MSYS 실 바이너리 `usr\bin\bash.exe` 와 다른 파일이고, 데몬 셸 탐지도 `runtime/git/bin` 을
          # 본진으로 명시한다(src/bin/cysd/schedule.rs:805-810). 여기가 **실제 배포 산출물을 만드는**
          # 게이트이므로 이 경로가 빠진 채로 릴리스가 나가면 윈도우 훅이 통째로 죽는다.
          if [ ! -f "$RT/git/bin/bash.exe" ]; then
            echo "FATAL: runtime/git/bin/bash.exe 부재 — Claude Code 훅 실행 경로가 사라졌다."
            ls -la "$RT/git" || true
            exit 1
          fi
          ls -la "$RT/git/bin/bash.exe"

      # macOS 자기완결 런타임 동봉 (RC-20/T6b — 순정 맥=개발도구 없는 소비자. python3·git은 CLT-shim이라
      # 실행 시 개발도구 프롬프트 → 동봉 필수). tauri.conf.json bundle.resources("runtime/")가 이 트리를
      # Contents/Resources/runtime 으로 싣고, runtime_bin_dirs(RC-18)가 PATH 해소한다. per-arch(matrix.target).
      # ★공증: 동봉 Mach-O는 ad-hoc(python·uv)/Node서명이라 로컬 build-macos-signed.sh가 inside-out 재서명.
      - name: 동봉 런타임 준비 (Python·git·uv·node — macOS 전용, per-arch)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          bash scripts/prep-mac-runtime.sh "${{ matrix.target }}"
          # .prep-target 마커 — build-macos-signed.sh가 같은 타깃 재준비를 건너뛰게 한다(중복 방지)
          printf '%s' "${{ matrix.target }}" > src-tauri/runtime/.prep-target

      # ★v0.14.0 (2026-07-28): 인증서(Q43YA2NMF9) 취득 후 첫 서명 릴리스 — 종전 '미서명 slim 빌드' 스텝을
      #   build-macos-signed.sh(서명+공증+staple+dedup+DMG+업데이터 재서명 완결형) 호출로 교체한다.
      #   스크립트가 dedup·UDZO DMG·app.tar.gz 재서명을 전부 품으므로 종전 스텝의 ①~④와 기능 동일 + 서명·공증.
      - name: Import Developer ID into ephemeral keychain (macOS 전용)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/import-macos-signing-certificate.sh

      - name: Build, notarize, staple + 산출물 정규화 (macOS 전용)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          TRIPLE="${{ matrix.target }}"
          VERSION="$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][0-9.]*)".*/\1/')"
          case "$TRIPLE" in
            aarch64-apple-darwin) ARCH=aarch64 ;;
            x86_64-apple-darwin)  ARCH=x64 ;;
            *) echo "unexpected target: $TRIPLE"; exit 1 ;;
          esac
          # ★스테일 사이드카 차단 v2(run 30364472849 실증 — `cargo clean -p` 는 --target 없이
          #   호스트 타깃 디렉토리만 청소해 크로스(target/<triple>/) 산출물이 생존한다).
          #   자사 크레이트의 지문·산출물을 네이티브/크로스 양 경로에서 외과 제거 — 의존성 캐시 유지.
          for TD in "target/release" "target/$TRIPLE/release"; do
            rm -rf "$TD/.fingerprint"/cys-* "$TD"/cys "$TD"/cysd "$TD"/cys-app* "$TD"/deps/cys* 2>/dev/null || true
          done
          bash scripts/build-macos-signed.sh "$TRIPLE"
          # ★경로 정규화 — 스크립트는 네이티브(호스트=타깃) 빌드에서 target/release/bundle 을 쓰지만,
          #   아래 tauri-action(tauriScript=true·args --target)은 target/<triple>/release/bundle 에서 수집한다.
          #   러너=arm64 → aarch64 레그가 네이티브라 이 불일치가 실재한다(비대칭 실패 방지 — 기획 §8-3).
          HOST_TRIPLE="$([ "$(uname -m)" = "arm64" ] && echo aarch64-apple-darwin || echo x86_64-apple-darwin)"
          if [ "$TRIPLE" = "$HOST_TRIPLE" ]; then SRC="target/release/bundle"; else SRC="target/$TRIPLE/release/bundle"; fi
          DST="target/$TRIPLE/release/bundle"
          if [ "$SRC" != "$DST" ]; then
            mkdir -p "$DST/dmg" "$DST/macos"
            cp -a "$SRC/dmg/cys_${VERSION}_${ARCH}.dmg" "$DST/dmg/"
            cp -a "$SRC/macos/cys.app.tar.gz" "$SRC/macos/cys.app.tar.gz.sig" "$DST/macos/"
          fi
          # 수집 대상 실재 단언 (무음 금지 — 없으면 tauri-action이 빈손으로 '성공'한다)
          test -f "$DST/dmg/cys_${VERSION}_${ARCH}.dmg" || { echo "::error::DMG 미생성: $DST/dmg/cys_${VERSION}_${ARCH}.dmg"; exit 1; }
          test -f "$DST/macos/cys.app.tar.gz"           || { echo "::error::업데이터 tar 미생성"; exit 1; }
          test -f "$DST/macos/cys.app.tar.gz.sig"       || { echo "::error::업데이터 서명 미생성"; exit 1; }
          # ★수리 세대 마커 단언(macOS 레그 — Windows CRT 게이트와 대칭): 스테일 사이드카가
          #   서명·공증을 통과해 출하되는 경로를 바이트 검사로 차단한다.
          CYSD_BIN="$SRC/macos/cys.app/Contents/MacOS/cysd"
          python3 - "$CYSD_BIN" <<'PYEOF'
          import sys
          data = open(sys.argv[1], "rb").read()
          marker = b"cys-fix-w2-gen-0.14.4"
          if marker not in data:
              print(f"::error::수리 세대 마커 부재({sys.argv[1]}) — 스테일 사이드카 의심. cargo clean 후 재빌드 필요")
              sys.exit(1)
          print(f"marker OK: {data.count(marker)}회")
          PYEOF
          echo "✓ macOS 서명·공증 산출물 준비: $DST/dmg/cys_${VERSION}_${ARCH}.dmg + $DST/macos/cys.app.tar.gz(.sig)"

      # ★macOS 격리 속성 + Gatekeeper 실평가 게이트 — 업로드 **전** (2026-08-13 신설).
      #   위 스텝이 서명·공증·staple 을 끝냈다. 그러나 그 산출물이 **실사용자 환경**에서 열리는지는
      #   아직 측정되지 않았다: 사용자는 브라우저로 받고, 그때 파일에 `com.apple.quarantine` 이 붙으며,
      #   첫 실행에서 Gatekeeper 가 **전체 재검증**을 돈다. quarantine 이 없으면 그 재검증 경로 자체가
      #   돌지 않아, 봉인이 깨진 앱도 조용히 통과한다(2026-08-01 실사고 "손상되었기 때문에 열 수
      #   없습니다" — 공증·staple 은 정상이었고 동봉 python 의 .pyc 쓰기가 봉인을 깼다. 당시 검증은
      #   curl 사본=quarantine 없음만 봐서 사고 경로를 한 번도 재현하지 못했다).
      #   이 스텝은 그 경로를 CI 에서 기계로 재현한다 — 사본에 quarantine 부착 → ⑦ DMG 봉투 평가
      #   (xcrun stapler validate + spctl --assess --type open --context context:primary-signature ·
      #   W-C 신설 2026-09-03: 종전 ①~⑥ 은 DMG **안의 앱**만 봤고, 사용자가 격리 DMG 를 여는 순간
      #   평가되는 DMG 자신의 서명·공증 티켓은 무검증이었다) → 마운트 → ditto 설치
      #   모사 → codesign --verify --deep --strict + stapler validate + spctl --assess.
      # **왜 여기(업로드 앞)인가**: Windows CRT 게이트와 동형. tauri-action(수집·업로드) 뒤에 두면
      #   draft 정책이 뒤집히는 순간 공개된 산출물을 사후 실패시키는 구조 의존이 된다. 앞에 세워
      #   어떤 발행 정책에서도 게이트가 업로드 자체를 선행 차단하게 한다.
      # 매트릭스가 아키텍처별(aarch64·x64)이므로 각 레그가 자기 DMG 를 본다 = **DMG 2종 모두 커버**.
      # 러너 정책이 `spctl --status = assessments disabled`(=degraded) 면 게이트가 **판정 불가
      #   exit 2 로 폐쇄**된다(F2 수리 2026-08-20 — 측정 불능≠통과 · rc=0 은 full 실평가에서만).
      #   진단 전용 강등 플래그(게이트 스크립트 --help 참조)는 발행 경로 사용 금지 — 이 파일이
      #   그 플래그 문자열 자체를 싣지 않음은 test_release_postprocess_gate.py 의 핀이 지키므로
      #   여기 주석에도 문자열을 쓰지 않는다. v0.14.19 실측
      #   (run 32039644404) 두 레그 모두 full 모드였으므로 이 폐쇄의 릴리스 경로 회귀는 0이다.
      - name: macOS Gatekeeper 게이트 (quarantine 부착 + spctl 실평가 · 업로드 전)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # 글롭 미해소를 실패로 잡는다(Windows CRT 게이트 스텝과 동일 관례) — 무음 통과 금지.
          DMGS=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          [ "${#DMGS[@]}" -ge 1 ] && [ -f "${DMGS[0]}" ] || { echo "::error::DMG 후보 이상(글롭 미해소 포함): ${DMGS[*]}" >&2; exit 1; }
          for d in "${DMGS[@]}"; do
            echo "=== Gatekeeper 게이트 대상: $d ==="
            # exit 0=PASS · 1=FAIL(발행 금지) · 2=판정 불가(도구 부재·마운트 실패·degraded 폐쇄 → 통과 아님)
            # ── GATE_MODE·spctl 모드 증적 승격(GITHUB_STEP_SUMMARY · F1 검증 공백 수리) ──
            #   강등(degraded = spctl 실평가 미수행)은 로그 배너만으로는 라운드 감사에서 묻힌다 —
            #   게이트 스크립트가 stdout 마지막 줄에 내는 기계 요약(GATE_MODE=full|degraded)과
            #   spctl 상태 줄을 요약 페이지에 박아, "실평가 없는 초록"이 증적 층에서도 보이게 한다.
            #   FAIL 실행도 증적은 먼저 남긴다(tee 캡처 → 요약 승격 → rc 그대로 종료 · pipefail 이
            #   게이트 rc 를 보존한다). 산출물($d)은 읽기만 한다(원본 무변경 계약 유지).
            # ★주의(태그 트리 함정): 릴리스는 태그 시점의 트리로 돈다 — 이 스텝 수정은 이 커밋을
            #   담은 **다음 태그부터** 유효하다. 지난 태그 재실행에는 소급되지 않는다.
            GLOG="$(mktemp)"; rc=0
            bash scripts/release-gate-gatekeeper.sh "$d" 2>&1 | tee "$GLOG" || rc=$?
            {
              echo "### macOS Gatekeeper 게이트 — $(basename "$d") (${{ matrix.target }})"
              grep -E '^GATE_MODE=' "$GLOG" | tail -1 || echo 'GATE_MODE=(미출력 — 태그 트리의 게이트 스크립트가 구판)'
              grep -E '^spctl: ' "$GLOG" | tail -1 || true
              grep -E '^(PASS|FAIL) ⑦' "$GLOG" || echo '⑦ DMG 축 (미출력 — 태그 트리의 게이트 스크립트가 구판)'
              echo "- exit=$rc (0=PASS · 1=FAIL · 2=판정 불가·degraded 폐쇄 포함)"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || exit "$rc"
          done

      # ★Windows 직접 빌드 + CRT 발행 차단 게이트 — 업로드 **전** (R2 agy 구조 권고 수용 · 2026-07-28).
      #   종전(R1)엔 tauri-action(빌드+업로드 일체)이 먼저라 게이트가 업로드 뒤였다 — draft 정책이
      #   유지되는 한 안전하지만, 정책 회귀(releaseDraft 반전) 시 공개된 산출물을 사후 실패시키는
      #   구조 의존이었다. macOS 패턴과 동형으로 직접 빌드→게이트→(tauri-action은 수집만)로 전환해
      #   게이트가 어떤 정책에서도 업로드 자체를 선행 차단하게 한다.
      # ★P1-4b(완전 초기화 감사 확정 2026-08-16): factory-reset 의 Windows 계약
      #   (%LOCALAPPDATA%\cys 가 **설치 디렉토리이자 상태 디렉토리** · schtasks 비활성 실측 ·
      #   boot_id 허용오차 · 디렉토리 심링크 제거 · 훅 문자열 `bash "C:/…"`)은 지금까지
      #   **feat/** 브랜치 레인에서만 돌았다. 태그(릴리스) 경로에 검증이 0이면, 브랜치를 거치지
      #   않은 핫픽스 태그가 Windows 회귀를 그대로 싣는다 — 이 파일 자신이 규탄한 "태그 경로
      #   보증 0" 구조의 재생산이다. 대상을 factory_reset:: 로 좁혀 예산을 지킨다.
      # ★D5 게이트(v0.14 품질 라인) 편입 — 적대검증 2R major 수리.
      #   `cys::d5_gate_for_os` 는 Windows 를 사정권에 넣되 **옵트인일 때만** 참이다
      #   (2026-08-17 강등 — 근거·승격 절차는 `src/lib.rs` 의 그 함수 doc). 그 매핑을 Windows
      #   호스트에서 실행하는 레인이 0건이었다(전체 `cargo test --lib`·`--bin cys` 는 이 파일
      #   위쪽 스텝의 `if: matrix.target == 'aarch64-apple-darwin'` 로 macOS 전용).
      #   mac 초록은 Windows 파이프라인을 전혀 증명하지 않는다.
      #   ★강등이 이 스텝의 감시력을 키웠다: 러너에는 옵트인 스위치가 없어 게이트가 **거짓**이므로,
      #   래퍼(`inject_claude_alt_screen_default`)의 게이트 인자를 `true` 로 하드코딩하는 변이가
      #   여기서 빨개진다. 강등 전에는 mac·Windows 두 레인 모두 게이트가 참이라 그 변이가 어느
      #   레인에서도 죽지 않았다(그 한계는 당시 핀 주석에 정직하게 적혀 있던 것이다).
      #   비용은 0 에 가깝다 — lib 은 바로 위 factory_reset 스텝에서 이미 컴파일돼 있고,
      #   D5 핀은 순수 문자열 매핑이라 실행이 밀리초다.
      #   ⚠필터를 지우지 마라. 지우면 이 레인은 다시 '돌지 않는 초록'이 된다.
      - name: cargo test --lib factory_reset + D5 + merge3 (Windows 계약 · 태그 레인)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          CYS_PACK_DIR="$(mktemp -d)" cargo test --lib factory_reset:: -- --test-threads=1
          CYS_PACK_DIR="$(mktemp -d)" cargo test --lib claude_alt_screen -- --test-threads=1
          CYS_PACK_DIR="$(mktemp -d)" cargo test --lib merge3:: -- --test-threads=1

      - name: Windows 직접 빌드 + CRT gate (VCRUNTIME import sweep + 0.14.1 fix markers · 업로드 전)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          CYS_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          PYTHONUTF8: '1'          # Windows 콘솔 cp1252 에서 한국어 판정 출력 UnicodeEncodeError 방지(0623a0f 백포트)
          PYTHONIOENCODING: 'utf-8'
        run: |
          set -euo pipefail
          # ★스테일 사이드카 차단 v2(macOS 스텝과 대칭 — cargo clean -p 는 크로스 경로 미청소)
          for TD in "target/release" "target/${{ matrix.target }}/release"; do
            rm -rf "$TD/.fingerprint"/cys-* "$TD"/cys.exe "$TD"/cysd.exe "$TD"/cys-app* "$TD"/deps/cys* 2>/dev/null || true
          done
          # ① NSIS 빌드(beforeBuildCommand=bundle-prep 포함) — 종전 tauri-action 기본 러너와 동일 CLI 경로
          #   ★W5-1: CLI 는 워크플로 env TAURI_CLI_VERSION 으로 고정(템플릿 동결 — 파일 머리 env 주석).
          #   ★W5-2: --verbose + tee 로 makensis 출력을 로그 파일로 가시화하고, 훅의 컴파일 가드
          #     문자열(NSIS-CONTRACT.md §5 '컴파일 실패 문자열' 3종 — 훅이 !error 로 빌드를 끊는다)을
          #     로그에서 재검한다. !error 는 makensis 를 이미 hard-fail 시키고 pipefail 이 그 종료코드를
          #     보존한다(1차 게이트) — grep 은 래퍼가 종료코드를 삼키는 회귀·가드의 경고 강등 회귀까지
          #     로그 층에서 잡는 2차 벨트다. 토큰은 계약 문서의 문자열 그대로(창작 금지).
          bun x "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --target "${{ matrix.target }}" --verbose 2>&1 | tee nsis-build.log
          if grep -E 'refusing to build a blind oracle|sidecar source not found at compile time|version resource regression' nsis-build.log; then
            echo "::error::NSIS 훅 빌드 가드 발화(위 매치 라인) — 오라클 전제가 깨진 설치기는 출하 금지(NSIS-CONTRACT.md §5)" >&2
            exit 1
          fi
          echo "✓ NSIS 빌드 로그 가드 통과: 훅 컴파일 가드 문자열 0건 (nsis-build.log $(wc -l <nsis-build.log | tr -d ' ')줄)"
          # ② CRT 게이트 — 업로드 전 최종 바이트 검증
          PY=python; command -v python3 >/dev/null 2>&1 && PY=python3
          # ★R1-repair(2026-08-29): 게이트 **도구 자체**의 밀폐 스위트를 소비 직전에 돌린다 —
          #   scripts/tests/test_verify_win_crt.py 는 W4-C 편입 후 어느 CI 레인에서도 0회
          #   실행이었다("안 도는 검체는 게이트가 아니다"). 합성 PE 픽스처·tempfile 만 사용(러너
          #   자기완결·플랫폼 무관) · ci-branch 와 같은 커밋 동시 편입 · pack-release 미편입
          #   사유는 ci-branch '팩 스위트 레인 대조' ALLOWED 등재 참조(팩 내용물이 아니다).
          "$PY" scripts/tests/test_verify_win_crt.py
          SETUP=(target/${{ matrix.target }}/release/bundle/nsis/cys_*_x64-setup.exe)
          [ ${#SETUP[@]} -eq 1 ] && [ -f "${SETUP[0]}" ] || { echo "setup.exe 후보 이상(글롭 미해소 포함): ${SETUP[*]}" >&2; exit 1; }
          "$PY" scripts/verify_win_crt.py --setup "${SETUP[0]}"
          # ③ 음성 대조(R1 codex medium 수용): 공개 v0.14.0(구베이스·VCRUNTIME 감염 실물)에 같은
          #   게이트를 돌려 ①임포트 스윕 true-positive(exit 1)와 ②마커 3종 전부 부재(0/3)를
          #   결정론으로 증명한다 — "신버전 존재·구버전 부재" 양방향 판별력의 CI 증거.
          curl -fsSL -o /tmp/cys-neg-base.exe \
            https://github.com/idoforgod/cys-terminal/releases/download/v0.14.0/cys_0.14.0_x64-setup.exe
          set +e
          NEG_OUT="$("$PY" scripts/verify_win_crt.py --setup /tmp/cys-neg-base.exe 2>&1)"; NEG_RC=$?
          set -e
          echo "$NEG_OUT" | tail -5
          [ "$NEG_RC" -eq 1 ] || { echo "::error::음성 대조 실패 — v0.14.0 은 exit 1(CRT 위반)이어야 한다. got $NEG_RC" >&2; exit 1; }
          echo "$NEG_OUT" | grep -q "markers: 0/" || { echo "::error::음성 대조 실패 — v0.14.0 마커는 0/N 이어야 한다" >&2; exit 1; }
          echo "✓ 음성 대조 통과: v0.14.0 = CRT 위반 검출 + 마커 0/3 (게이트 판별력 실증)"

      # ★Windows VERSIONINFO 상시 게이트 (W5-3 · 2026-08-29 — 업로드 전 · 실패 = 빌드 실패, 경고 아님).
      #   왜 영구 게이트인가(훅 워커 실측): ①POSIX makensis 3.12 의 !getdllversion 은 리소스 없는 PE 에
      #   에러 대신 **빈 값**을 정의할 수 있고 ②크로스 빌드된 사이드카는 VERSIONINFO 가 아예 없다
      #   (winresource 는 cfg(windows) 호스트 게이트 — build.rs). 어느 쪽이든 새 신선도 오라클
      #   (nsis-hooks.nsh: 설치된 정식의 GetDLLVersion == 컴파일 상수)이 **현장 전 설치를 거부**하는
      #   전 기계 exit 4 가 된다. 훅의 컴파일 가드(!error 3종)가 1차지만, 이 스텝은 훅과 독립으로
      #   "세 산출물 모두 수치 VERSIONINFO == 릴리스 버전"을 단언하는 2차 오라클이다(레인 변경·
      #   가드 회귀에도 생존). 수치 = VS_FIXEDFILEINFO(File{Major,Minor,Build,Private}Part) —
      #   GetDLLVersion/!getdllversion 이 읽는 바로 그 DWORD 다(문자열 FileVersion 이 아니다).
      - name: Windows VERSIONINFO 게이트 (cys·cysd·cys-app 수치 버전 == 릴리스 버전)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $v) { throw 'tauri.conf.json version 파싱 실패' }
          $expected = "$v.0"
          $files = @(
            'src-tauri/binaries/cys-x86_64-pc-windows-msvc.exe',
            'src-tauri/binaries/cysd-x86_64-pc-windows-msvc.exe',
            'target/${{ matrix.target }}/release/cys-app.exe'
          )
          $bad = @()
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { $bad += "${f}: 파일 부재(빌드 산출 경로 회귀)"; continue }
            $vi = (Get-Item $f).VersionInfo
            $num = '{0}.{1}.{2}.{3}' -f $vi.FileMajorPart, $vi.FileMinorPart, $vi.FileBuildPart, $vi.FilePrivatePart
            if ($num -eq '0.0.0.0') { $bad += "${f}: 수치 VERSIONINFO 부재/0.0.0.0 — 리소스 없는 PE(크로스 빌드·winresource 회귀) = 현장 전 설치 거부(exit 4) 계급"; continue }
            if ($num -ne $expected) { $bad += "${f}: 수치 VERSIONINFO $num != 기대 $expected (버전 SOT 불일치 또는 스테일 산출물)"; continue }
            Write-Host "OK  $f  VS_FIXEDFILEINFO=$num"
          }
          if ($bad.Count) {
            $bad | ForEach-Object { Write-Host "::error::VERSIONINFO 게이트: $_" }
            throw "VERSIONINFO 게이트 실패 ($($bad.Count)건) — 이 산출물은 업로드 금지"
          }
          Write-Host "VERSIONINFO 게이트 통과: 3종 전부 수치 버전 == $expected"

      # tauri build → beforeBuildCommand(bundle-prep.sh)가 UI 번들 + cys/cysd 릴리스 빌드 + externalBin
      # 배치 → 번들(dmg/app) → createUpdaterArtifacts(.app.tar.gz + .sig + latest.json) → 비공개 repo 릴리스 업로드.
      # Windows: NSIS setup.exe + .sig — tauri-action이 같은 릴리스의 latest.json에 platforms.windows-x86_64를 병합.
      # ★양 플랫폼 모두 위 직접 빌드 스텝이 산출물을 이미 만들었으므로 tauriScript=true 로 빌드를 no-op
      #   시킨다(macOS=재빌드 fat 재역참조 방지·Windows=게이트 미통과 바이트 업로드 방지). tauri-action은
      #   표준 경로의 그 산출물을 수집·업로드·latest.json 병합만 수행한다.
      - name: Build, sign, and release (private)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYS_TARGET: ${{ matrix.target }}    # bundle-prep.sh가 매트릭스 타깃으로 사이드카(cys-<target>)를 크로스 빌드
          PYTHONUTF8: '1'                     # Windows 러너 python 한국어 print cp1252 크래시 방지(타 OS 무해)
          # ── 업데이트 무결성 서명 (필수 — 없으면 .sig·latest.json 미생성) ──
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''    # 이 키는 무암호로 생성됨(실측 확인) → 빈 문자열. 별도 시크릿 불필요.
          # ── macOS 코드사이닝 + 공증(v0.14.0~): 위 build-macos-signed.sh 스텝이 수행 완료 ──
          # 이 tauri-action은 macOS에서 빌드 no-op(수집 전용)이므로 APPLE_* 를 여기 전달하지 않는다
          # (빈 APPLE_* env는 tauri 번들러의 security import 실패를 유발 — 종전 함정 그대로 유효).
        with:
          # 양 플랫폼 'true'(빌드 no-op → 위 직접 빌드 스텝의 산출물 수집만) — 게이트 선행 구조(R2).
          tauriScript: 'true'
          tagName: ${{ github.ref_name }}
          # Phase 2(릴리스 통합·2026-07-03): 소스 repo가 public이 되면서 이 릴리스가 곧 공개 배포다.
          releaseName: 'cys ${{ github.ref_name }}'
          releaseBody: 'cys 터미널 ${{ github.ref_name }}. macOS는 .dmg, Windows는 -setup.exe를 내려받아 설치하세요. 기존 사용자는 앱 내 Update 버튼으로 자동 갱신됩니다.'
          releaseDraft: true      # ★v0.14.0(2026-07-28): draft 생성까지만 — 공개 발행·latest 마킹은 오너 승인 후
                                  #   별도 집행(발행=외부 공개 denylist). 구 'false 자동발행'은 승인 게이트와 충돌.
          prerelease: false
          args: --target ${{ matrix.target }}

      # 러너 키체인 잔류 방지 — 실패 경로 포함 항상 정리 (v0.13.23 구조 준용·브라우저 키 정리는 해당 없음)
      - name: Remove ephemeral macOS keychain
        if: always() && matrix.platform == 'macos-latest'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/cys-release-signing.keychain-db" 2>/dev/null || true

  # ── 무중단 팩 채널 아티팩트 (DESIGN-noshutdown-pack-update §2-①/§5/§7) ──
  # 기존 build/서명/updater 잡과 독립·가산. cys 바이너리를 네이티브로 빌드(팩 콘텐츠는 플랫폼 무관)해
  # 권위 manifest를 emit → cysjavis-pack/ 트리에서 결정론 tar 생성 → embed-vs-standalone 동일성 게이트
  # → pack-manifest.json을 minisign 서명(서명 대상=manifest, tar 아님) → 비공개 릴리스에 업로드.
  # relocate가 이 자산까지 공개 repo로 옮긴다(dist/* 일괄).
  pack-artifacts:
    # ★windows-health 결박(M4-3): 게이트가 빨가면 이 잡이 돌지 않아 팩 3종 자산이
    #   드래프트에 오르지 않고, release-publish 의 release-verify.py REQUIRED_ASSETS
    #   검증이 실패한다 = 공개 발행 차단. 위 windows-health-gate 잡 머리말 참조.
    needs: [build, windows-health-gate]
    runs-on: ubuntu-latest
    env:
      KEY_ID: '39E60A702949D6C3'    # 임베드 키링(cysjavis-pack/trusted-keys.json) key_id — manifest.key_id
      EXPIRES_DAYS: '90'            # 서명 신선도 유효창(§6-5 트레이드오프 — Replay 차단 vs 재발행 부담)
      # ★무중단 팩 채널 안전 하한(2026-07-12 오너 확정). seed-once 상태 보호(memory/·SESSION_STATE
      # 불가침)는 0.12.48+ 바이너리 코드다 — 공란이면 ≤0.12.47 구버전 pack-update가 사용자 상태를
      # vendor 골격으로 클로버한다(2026-07 실사고 계열). 새 팩이 더 새로운 바이너리 RPC에 의존할 때만 상향.
      # ★0.14.2 상향(S26 · 2026-07-29 실측 근거). 이 릴리스 팩의 `javis_orchestra.py`가 선언 생성 실패
      #   경로에서 **`cys todo-path --emit-decl` 실행을 지시**한다. 그 플래그는 이 릴리스에서 새로 생긴다:
      #     · `git show v0.14.1:src/bin/cys.rs | grep -c emit_decl` → 0
      #     · `git show v0.14.1:cysjavis-pack/bin/javis_orchestra.py | grep -c emit-decl` → 0
      #     · 작업 트리 `src/bin/cys.rs` → 4 (clap `#[arg(long)] emit_decl: bool`)
      #   즉 ≤0.14.1 바이너리 사용자가 이 팩을 받으면 지시대로 실행했을 때 unknown-flag 로 죽고,
      #   선언 없는 todo 가 남아 집계가 `unclaimed` 로 떨어진다. docs/RELEASE.md 불변 규칙
      #   ("새 팩이 더 새로운 바이너리 기능에 의존하면 그 버전으로 상향")의 직접 적용이다.
      #   ⚠위 문장("이 값은 이 태그의 버전과 같아야 의미가 있다")은 **0.14.2 태그 시점의 서술**이다.
      #   ★해석 정정(2026-08-16 · v0.14.18 릴리스에서 실측 판정): 이 값의 의미는 "이 태그의 버전"이
      #   아니라 **"팩이 의존하는 가장 새로운 바이너리 표면이 생긴 버전"**이다(docs/RELEASE.md
      #   불변 규칙의 문언 — "새 팩이 더 새로운 바이너리 기능에 의존하면 그 버전으로 상향").
      #   매 릴리스 자동 동기화가 아니다: 0.14.3~0.14.17 열다섯 릴리스가 0.14.2 를 유지했고 그것이
      #   옳았다. 무근거 상향은 그 사이 버전 사용자의 무중단 팩 채널을 이유 없이 끊는다.
      #   v0.14.18 판정: 이 릴리스 팩(role-bootstrap 선행 claim · javis_bootstrap 전제 가드)이 쓰는
      #   CLI 표면은 `claim-role --takeover-empty-seat` · `status --json` 뿐이고 둘 다 ≤0.14.2 에
      #   존재한다. 신 데몬의 rc 6 은 **진단 품질**만 좌우하고 구 바이너리에서도 폴백 가드가
      #   부서 증식을 막는다(스큐 S3 안전) → 상향 불필요, 0.14.2 유지.
      # ★0.14.29 상향(2026-08-31 · T5T6 R1-적대 차단 수리 · master 결재). 이 릴리스 팩의
      #   pack-guard.sh 가 "이 수정은 보존됩니다(kept-drift)" 를 **약속**하는데, 그 거동(수정된
      #   system 파일의 벤더 미전진 보존·전진 시 자동 3-way)은 0.14.29 바이너리에서 처음 생긴다 —
      #   ≤0.14.28 스윕은 종전대로 vendor 본으로 치유해 팩 자신의 약속이 거짓이 된다(기능 의존 —
      #   RELEASE.md 불변 규칙). pack-release.yml PACK_MIN_BINARY_OVERRIDE 와 동시 상향(두 값 동일 계약).
      PACK_MIN_BINARY: '0.14.29'
    steps:
      - uses: actions/checkout@v4

      # ★시크릿/개인정보 발행 hard-gate (팩 바이너리 빌드·임베드 전 최우선). 아래 scan-pack-secrets.sh는
      # cysjavis-pack 트리만·개인 계정 핸들 허용이라, 여기서 whole-repo 엄격 스캔(secret-scan.sh --all:
      # 개인 홈경로·개인 프로필 디렉토리·개인 핸들·이메일·키토큰)을 fail-closed로 선행해 누출을 이중 차단한다.
      - name: Secret/PII scan (pre-build hard-gate)
        shell: bash
        run: bash scripts/secret-scan.sh --all

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: pack-artifacts

      # ★콘텐츠 스캔 발행 hard-gate (지점①/2 — 바이너리 빌드 전). git-추적 cysjavis-pack 전 트리가
      # build.rs로 cys 바이너리에 자동 임베드되므로, gitignore가 못 잡는 콘텐츠 누출(개인 홈경로·
      # 이메일·키토큰)을 바이너리 link 전에 fail-closed로 차단한다. 비0이면 잡 실패(발행 차단).
      - name: Scan pack content (pre-build hard-gate)
        run: bash scripts/scan-pack-secrets.sh

      # ★★배송 팩 계약 게이트(C-1 교정 · 2026-07-26) — **이 잡이 pack.tar.gz 를 실제로 만든다.**
      # 위 build 잡(macOS aarch64)에도 같은 게이트를 걸었지만, 그건 앱 바이너리 레그다. 사용자에게
      # 배달되는 **Python 파서 본체**는 이 잡이 tar 로 묶어 minisign 서명한다. 서명 **전에** 검증하지
      # 않으면 "파리티 0회로 봉인된 파서"가 그대로 나간다 — 설계 대장이 ✅ 라고 적은 보증이 배송
      # 시점에 부재한 상태다. 그 이음매를 여기서 닫는다.
      # 위치: 시크릿 스캔 직후 · `cargo clean`/`Build cys`/tar 생성/서명 **전부보다 앞**(fail-fast).
      # 러너: ubuntu-latest. 앞의 `Setup Rust`(stable)가 rustc 를 PATH 에 올려두므로 2언어 파리티를
      #   **여기서도 온전히** 돌린다(파이썬 단독 축소본 아님). 하네스는 rustc 부재 시 hard fail 하므로
      #   조용한 축소는 발생하지 않는다.
      # 존재-단언은 이 리포 관례(`[ -f "$f" ] || exit 1`)를 그대로 따른다 — untracked 누락으로 게이트가
      #   조용히 skip 되면 초록이 거짓말이 된다.
      - name: 배송 팩 계약 게이트 (선언 파서 2언어 파리티 + 유령집계 회귀)
        shell: bash
        run: |
          set -euo pipefail
          d="cysjavis-pack/bin/tests/fixtures/todo-decl"
          h="cysjavis-pack/bin/tests/parity_todo_decl.py"
          [ -d "$d" ] || { echo "골든 픽스처 디렉터리 누락: $d (계약 SOT 부재 = 실패)" >&2; exit 1; }
          [ -f "$d/expected.json" ] || { echo "계약 대장 누락: $d/expected.json (git add 누락 의심)" >&2; exit 1; }
          n="$(find "$d" -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')"
          [ "$n" -ge 15 ] || { echo "픽스처 케이스 부족(${n}종 · 설계 P3-1 최소 15종)" >&2; exit 1; }
          [ -f "$h" ] || { echo "파리티 하네스 누락: $h (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_decl_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_decl_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_decl.rs" ] || { echo "Rust 파서 누락: src/todo_decl.rs (git add 누락 의심)" >&2; exit 1; }
          command -v rustc >/dev/null || { echo "rustc 부재 — 2언어 파리티 불가(축소 실행 금지)" >&2; exit 1; }
          echo "== [pack] todo 선언 파서 2언어 파리티(골든 ${n}종 + 조합 1024건) =="
          if ! python3 "$h" --fuzz 1024 --list-mismatch 20; then
            echo "::error::[pack] 선언 파서 2언어 파리티 실패 — 배송될 Python 파서가 Rust 와 갈렸다. 서명 전 차단." >&2
            exit 1
          fi
          echo "== [pack] todo 선언·유령집계 소비자 회귀 7종(+import 가드)+부트체인 =="
          # ★test_bootstrap_chain 등재(2026-08-12 R3 확정 — 위 build 레그와 동일 사유).
          # ★repair-w3(2026-08-29 · v0.14.28): 수리 회귀 핀 2종 편입 — test_hud_bridge_backoff
          #   (W2 replay_gap 재스폰 스톰 지수 백오프 — ★R2 라운드2에서 _reader 배선 통합 2건 추가)
          #   · test_wakeup_liveness(★R2 라운드2 신설 — _target_alive 3값 판정+drain zombie 가드
          #     행동 정본. 종전 유일 가드였던 rust substring 핀은 M8 변이에 초록이라 행동을 못
          #     지킨다 — lib.rs 역할 경계 주석) · test_preflight_c11b_seal(W3c 번들 봉인
          #   심링크 이관). 대상 javis_hud_bridge.py·javis_preflight.py 는 배송 팩 내용물인데
          #   두 핀 모두 어느 CI 레인에서도 0회 실행이었다("안 도는 검체는 게이트가 아니다" —
          #   W-CI 2026-08-21 동형 격차의 재발). 3완전 레인 동시·대칭 등재(release 는 양 루프) ·
          #   격리 스크래치 하네스(라이브 무접촉) · 실측 각 ≤0.1s.
          # ★2R-6(2026-08-31 · 0.14.29 성찰): test_preflight_c62_c68_ledger 편입 — T5 의 C62
          #   conflicted/quarantined 신설 판정·at-rest 병기와 T3 의 C68 영속 kind 기한 제외
          #   산식이 파이썬 검체 0건(무측정 변경)이던 격차 봉합. 픽스처 원장·뮤테이션
          #   양방향(PASS↔WARN) 검증 · 3완전 레인 동시·대칭 등재(release 는 양 루프) ·
          #   격리 CYS_PACK_DIR 하네스(라이브 무접촉) · 실측 0.01s.
          for t in test_todo_decl test_todo_stamp test_report_ghost test_hud_bridge_skew \
                   test_report_gate test_todo_shared_constants test_import_guard test_radio test_scrub \
                   test_bootstrap_chain test_snapshot \
                   test_role_bootstrap_hook test_seat_latch_negation \
                   test_hud_bridge_backoff test_preflight_c11b_seal test_wakeup_liveness \
                   test_preflight_c62_c68_ledger; do
            f="cysjavis-pack/bin/tests/$t.py"
            [ -f "$f" ] || { echo "선언·유령집계 테스트 파일 누락: $f (git add 누락 의심)" >&2; exit 1; }
            echo "== [pack] declared-state test: $t =="
            if ! CYS_PACK_DIR="$(mktemp -d)" python3 "$f"; then
              echo "::error::[pack] 선언·유령집계 게이트 실패($t) — 배송 팩 회귀. 서명 전 차단." >&2
              exit 1
            fi
          done
          # ★W-CI(2026-08-21): Wave 1 부트 결정론 회귀 핀 2종 편입(3완전 레인 동시·대칭 —
          #   ci-branch·pack-release 와 같은 커밋). 훅 role-bootstrap.sh 와 감지기 javis_detect.py
          #   는 이 잡이 tar·서명해 배송하는 팩 내용물이라 서명 전 차단이 정위치다.
          #   ① test_role_bootstrap_hook(위 루프 말미): _notify_bg 파이프 해제·≤0.3s 정렬 창·발화
          #      행렬 핀 — 실측 약 45s(hang 주입 케이스의 내부 subprocess timeout 20~30s 유계가
          #      상한). 분 단위 cargo 빌드가 지배하는 이 잡에서 지연 부담 없음 판단.
          #   ② 감지기 self-test(실측 0.03s): 4축 억제(neg·pre·quote·quotative) corpus +
          #      단일 원본 fixture(detect-corpus.json) 로딩 검증 — fixture 불량 시 hard fail.
          echo "== [pack] javis_detect 4축 감지기 self-test(corpus 단일 원본) =="
          g="cysjavis-pack/bin/javis_detect.py"
          [ -f "$g" ] || { echo "감지기 누락: $g (git add 누락 의심)" >&2; exit 1; }
          if ! CYS_PACK_DIR="$(mktemp -d)" python3 "$g" --self-test; then
            echo "::error::[pack] javis_detect self-test 실패 — 감지기 4축 억제 회귀. 서명 전 차단." >&2
            exit 1
          fi
          # ★W-CI2(2026-08-21): Wave 2 좌석 래치 회귀 핀 test_seat_latch_negation 편입(위 루프
          #   말미 · 실측 0.007s·19케이스 · 순수 픽스처·라이브 무접촉 — ci-branch·pack-release
          #   와 같은 커밋·3완전 레인 동시 대칭). 판정 원본 javis_orchestra.py·javis_boot_node.py
          #   가 이 잡이 tar·서명해 배송하는 팩 내용물이라 서명 전 차단이 정위치다. 봉인:
          #   awakened_at 래치 부정 3중 AND + ★agent_alive:null(Windows master) 래치 유지 +
          #   python↔Rust 파리티 소스 핀 — 낙관적 falsy 역수리 = Windows 전 pane 사망(치명 앵커
          #   ④) 재발 경로를 서명 전에 차단한다.
          # ★todo 스캔 집합 파리티(S18) — 파서 파리티와 다른 표면("같은 파일을 보는가").
          echo "== [pack] todo 스캔 집합 2언어 파리티(C1·C2 동일 파일 집합) =="
          hs="cysjavis-pack/bin/tests/parity_todo_scan.py"
          [ -f "$hs" ] || { echo "스캔 파리티 하네스 누락: $hs (git add 누락 의심)" >&2; exit 1; }
          [ -f "scripts/todo_scan_dump.rs" ] || { echo "Rust 덤퍼 누락: scripts/todo_scan_dump.rs (git add 누락 의심)" >&2; exit 1; }
          [ -f "src/todo_scan.rs" ] || { echo "스캔 단일 구현 누락: src/todo_scan.rs (git add 누락 의심)" >&2; exit 1; }
          if ! python3 "$hs"; then
            echo "::error::[pack] todo 스캔 집합 파리티 실패 — C1(보고기)과 C2(데몬)가 다른 파일을 본다. 서명 전 차단." >&2
            exit 1
          fi

      # ★cargo clean 선행 — rust-cache가 복원한 스테일 OUT_DIR/pack_all.rs(이전 cysjavis-pack 트리로
      # 생성된 임베드 테이블)가 재사용돼 manifest SOT를 오염시키는 회귀를 차단한다. 캐시 복원 직후에
      # target을 비워 build.rs 코드젠을 강제 재실행시킨다(스테일 생성표 무효화).
      - name: cargo clean (스테일 생성표 무효화)
        run: cargo clean

      # cys 바이너리(순수 Rust·Tauri 불요)를 러너에서 빌드 → pack-manifest emit에 사용.
      - name: Build cys
        run: cargo build --release --bin cys

      # 권위 manifest(임베드 PACK+PACK_SKILLS에서 파생)를 단일 SOT로 캡처. signed_at=지금,
      # expires_at=now+EXPIRES_DAYS, key_id=임베드 키링. min_binary_version=PACK_MIN_BINARY
      # (구 정책 '미지정=제약 없음'은 seed-once 이전 바이너리의 상태 클로버 경로라 폐기 — env 주석 참조).
      - name: Emit authoritative pack-manifest.json
        run: |
          set -euo pipefail
          SIGNED_AT="$(date -u +%s)"
          EXPIRES_AT="$(( SIGNED_AT + EXPIRES_DAYS * 86400 ))"
          ./target/release/cys pack-manifest \
            --key-id "$KEY_ID" \
            --signed-at "$SIGNED_AT" \
            --expires-at "$EXPIRES_AT" \
            --min-binary-version "$PACK_MIN_BINARY" \
            > pack-manifest.json
          echo "── pack-manifest.json (head) ──"; head -c 600 pack-manifest.json; echo

      # ★역방향 커버리지 게이트(디스크 고아 차단). 동일성 게이트(forward: manifest⊆disk)의 역방향 —
      # git-추적 cysjavis-pack/ 트리에서 build.rs가 임베드했어야 할 파일이 manifest에 누락(디스크 고아)
      # 됐는지 검출한다. ★SOT = `cys pack-manifest` 출력(임베드 권위 테이블) — 제외규칙을 python으로
      # 재구현해 임베드 집합을 독립 재유도하지 않는다. python은 (tracked − manifest) 잔차만 분류한다:
      # 잔차의 각 항목이 build.rs:41-44가 배제하는 알려진 카테고리(경로 컴포넌트가 '.'로 시작·tests·
      # __pycache__)면 정당한 제외, 아니면 디스크 고아 → exit 1. build.rs 제외규칙이 바뀌어 새 카테고리가
      # 생기면 잔차가 미설명으로 남아 게이트가 시끄럽게 실패(silent drift 차단).
      - name: Reverse coverage gate (disk orphan detection)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys

          man = json.load(open("pack-manifest.json"))
          embedded = set(man["files"])          # SOT: build.rs가 실제 임베드한 파일(권위 테이블)
          if not embedded:
              print("::error::manifest.files 비어있음 — 역커버리지 불가", file=sys.stderr); sys.exit(1)

          out = subprocess.run(
              ["git", "ls-files", "cysjavis-pack"],
              capture_output=True, text=True, check=True,
          ).stdout
          tracked = set()
          for line in out.splitlines():
              line = line.strip()
              if line.startswith("cysjavis-pack/"):
                  tracked.add(line[len("cysjavis-pack/"):])
          if not tracked:
              print("::error::git ls-files cysjavis-pack 비어있음 — 인덱스 부재?", file=sys.stderr); sys.exit(1)

          # build.rs:41-44 제외 카테고리(잔차 분류용 allowlist — 임베드 집합 재유도 아님).
          def is_excluded(rel):
              return any(c.startswith(".") or c == "tests" or c == "__pycache__"
                         for c in rel.split("/"))

          gap = tracked - embedded               # 추적되었으나 manifest에 없는 파일
          orphans = sorted(g for g in gap if not is_excluded(g))
          if orphans:
              print("::error::디스크 고아(git-추적이나 임베드 누락 — build.rs가 실었어야 함):", file=sys.stderr)
              for o in orphans:
                  print(f"::error::  {o}", file=sys.stderr)
              sys.exit(1)
          print(f"[역커버리지] tracked={len(tracked)} embedded={len(embedded)} "
                f"gap={len(gap)}(전부 제외규칙으로 설명) orphan=0 — 통과")
          PY

      # ★embed-vs-standalone 동일성 게이트 + 결정론 pack.tar.gz 생성(§5-1).
      # ① manifest.files(임베드 권위) ⇔ cysjavis-pack/ 온디스크 트리 sha256 전수 일치(드리프트 차단).
      # ② 정확히 manifest.files 집합만으로 결정론 tar(정렬·고정 mtime/uid) 생성.
      # ③ tar 재추출 sha256 == manifest.files 전수 일치(tar ⇔ manifest ⇔ embed 3자 폐포).
      # 하나라도 불일치 = exit 1 = 빌드 FAIL.
      - name: Identity gate + build pack.tar.gz
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys, tempfile

          ROOT = "cysjavis-pack"
          man = json.load(open("pack-manifest.json"))
          files = man["files"]
          if not files:
              print("::error::manifest.files 비어있음", file=sys.stderr); sys.exit(1)

          def sha256_file(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 16), b""):
                      h.update(chunk)
              return h.hexdigest()

          # ① embed 권위 vs 온디스크 cysjavis-pack/ 트리 전수 일치.
          for rel, want in files.items():
              src = os.path.join(ROOT, rel)
              if not os.path.isfile(src):
                  print(f"::error::manifest 등재 파일이 트리에 없음: {rel}", file=sys.stderr); sys.exit(1)
              got = sha256_file(src)
              if got != want:
                  print(f"::error::동일성 게이트 불일치 {rel}: embed {want} != tree {got}", file=sys.stderr)
                  sys.exit(1)
          print(f"[gate①] embed-vs-tree {len(files)}개 파일 sha256 전수 일치")

          # ② 정확히 manifest.files 집합만으로 결정론 tar 생성(GNU tar -T 파일목록).
          with open("pack-files.txt", "w") as f:
              for rel in sorted(files):
                  f.write(rel + "\n")
          subprocess.run([
              "tar", "--sort=name", "--owner=0", "--group=0", "--numeric-owner",
              "--mtime=UTC 2020-01-01", "-czf", "pack.tar.gz",
              "-C", ROOT, "-T", "pack-files.txt",
          ], check=True)
          print("[gate②] 결정론 pack.tar.gz 생성")

          # ③ tar 재추출 sha256 == manifest.files (집합·해시 양방향 일치).
          with tempfile.TemporaryDirectory() as td:
              subprocess.run(["tar", "-xzf", "pack.tar.gz", "-C", td], check=True)
              extracted = {}
              for dirpath, _, names in os.walk(td):
                  for n in names:
                      ap = os.path.join(dirpath, n)
                      rel = os.path.relpath(ap, td).replace(os.sep, "/")
                      extracted[rel] = sha256_file(ap)
              if set(extracted) != set(files):
                  miss = set(files) - set(extracted)
                  extra = set(extracted) - set(files)
                  print(f"::error::tar⇔manifest 집합 불일치 missing={sorted(miss)} extra={sorted(extra)}", file=sys.stderr)
                  sys.exit(1)
              for rel, want in files.items():
                  if extracted[rel] != want:
                      print(f"::error::tar sha256 불일치 {rel}: {extracted[rel]} != {want}", file=sys.stderr)
                      sys.exit(1)
          print(f"[gate③] tar⇔manifest⇔embed 3자 폐포 {len(files)}개 일치 — 동일성 게이트 통과")

          # ④ tar.gz digest를 서명 대상 manifest에 주입(WP-6 R-SIG-1) — ★서명 前 필수.
          #    프로덕션 검증기(pack_update_from_dir)가 전개 前 이 digest와 tarball sha256을 대조해
          #    미검증 tarball의 pre-auth traversal-write를 차단한다. digest는 서명 안에 들어가므로
          #    forge 불가·replay만 가능(packsig DIGEST_REQUIRED_EPOCH가 시간창으로 봉인).
          man["digest"] = sha256_file("pack.tar.gz")
          with open("pack-manifest.json", "w") as mf:
              json.dump(man, mf, ensure_ascii=False, indent=2)
              mf.write("\n")
          print(f"[gate④] tar.gz digest 주입 → manifest.digest={man['digest'][:16]}…")
          PY

      # ★콘텐츠 스캔 발행 hard-gate (지점②/2 — pack.tar.gz 생성 후 발행 전). 결정론 tar로 묶은 직후·
      # 서명·업로드 전에 한 번 더 fail-closed로 콘텐츠 누출을 차단한다(빌드 전 지점①과 이중 게이트 —
      # 빌드~tar 사이 어떤 변형도 발행 전 재검). 비0이면 잡 실패(발행 차단).
      - name: Scan pack content (pre-publish hard-gate)
        run: bash scripts/scan-pack-secrets.sh

      # pack-manifest.json을 minisign 서명(★서명 대상=manifest 단 하나·기존 TAURI_SIGNING_PRIVATE_KEY
      # 재사용). tauri signer는 base64 래핑 .sig를 내므로 base64 디코드해 표준 minisign 텍스트
      # (.minisig)로 변환한다 — packsig::verify(minisign_verify::Signature::decode)가 표준 형식을 기대.
      - name: Sign pack-manifest.json (minisign)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY 미설정 — 팩 서명 불가"; exit 1; }
          bunx "@tauri-apps/cli@${TAURI_CLI_VERSION}" signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "" \
            pack-manifest.json
          # tauri .sig(전체 base64) → 표준 minisign 텍스트(.minisig).
          base64 --decode pack-manifest.json.sig > pack-manifest.json.minisig
          echo "── pack-manifest.json.minisig (head) ──"; head -2 pack-manifest.json.minisig

      # ★실서명→실검증 폐포 게이트(릴리스 전 결정론 검증). 방금 PRODUCTION 서명기
      # (bunx @tauri-apps/cli signer → base64 --decode → .minisig)가 낸 실제 아티팩트를
      # PRODUCTION 검증기(cys pack-update → packsig::verify_minisign → minisign_verify)에
      # --dry-run으로 통과시킨다 — 서명+신선도+파일sha256+역방향 커버리지를 적용 없이 검증.
      # packsig 단위테스트는 minisign 크레이트로만 서명하므로 tauri-signer+base64 경로(release.yml이
      # 실제로 배포하는 형식)는 여기서만 행사된다. 형식 불일치 시 정상 팩이 전수 거부(DoS)되는데,
      # 이 단계가 그 가정을 프로덕션 배포 전 비0 종료로 차단한다. dist 자산 업로드 전에 배치.
      - name: Verify signed pack end-to-end (real signer → real verifier)
        run: |
          set -euo pipefail
          ./target/release/cys pack-update --from . --dry-run
          echo "✅ 실서명 아티팩트가 실검증기를 통과(서명+신선도+파일+커버리지) — 폐포 확인"

      # 비공개 릴리스(build 잡이 생성)에 팩 자산 업로드 → relocate가 공개 repo로 옮긴다.
      - name: Upload pack artifacts to source release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            pack.tar.gz pack-manifest.json pack-manifest.json.minisig \
            -R "$SRC_REPO" --clobber
          # ★v0.14.0(2026-07-28): 종전 '--latest --draft=false' 강제 공개를 제거 — draft 유지.
          #   공개 발행+latest 마킹은 오너 승인 후 별도 집행(발행=외부 공개 denylist·승인 게이트).
          echo "✅ 팩 아티팩트 업로드 완료 (draft 유지 — 공개는 오너 승인 후)"


  # (Phase 2-4 완결·2026-07-03) 전환기 미러(relocate) 잡 제거 — 구 repo(cys-terminal-releases)는
  # Archive됨. 마지막 미러(v0.10.0·자산 URL=소스 repo)가 읽기 전용으로 영구 생존하므로,
  # 늦게 업데이트하는 구 설치본도 그 경로로 이주 가능하다.
